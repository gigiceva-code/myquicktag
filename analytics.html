<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Analytics - myquicktag</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(255, 255, 255, 0.02);
            --border-light: rgba(255, 255, 255, 0.05);
            --accent-smeraldo: #50C878;
            --text-main: #ffffff;
            --text-sec: #6c6c70; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100%;
            width: 100%;
            overflow: hidden; /* LA REGOLA D'ORO: Zero Scroll */
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px 24px;
        }

        /* HEADER */
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 15px;
        }

        .btn-back {
            color: var(--text-sec);
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s ease;
        }
        .btn-back:active { color: var(--text-main); }
        .btn-back span { font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; }

        .brand-logo { font-size: 0.65rem; font-weight: 600; letter-spacing: 3px; color: var(--accent-smeraldo); }

        /* NUMERO GIGANTE (Sussurrato) */
        .hero-stats {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 0.8; /* Riempe lo spazio superiore ma non troppo */
        }
        .hero-stats h2 { font-size: 0.65rem; font-weight: 400; text-transform: uppercase; letter-spacing: 5px; color: var(--text-sec); margin-bottom: 5px; }
        .total-views { font-size: 4.5rem; font-weight: 300; color: var(--text-main); line-height: 1; letter-spacing: -2px; }

        /* CARDS (Sottili e chirurgiche) */
        .analytics-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
        .card-header i { color: var(--accent-smeraldo); font-size: 0.85rem; opacity: 0.8; }
        .card-header h3 { font-size: 0.7rem; font-weight: 500; letter-spacing: 2px; color: var(--text-main); text-transform: uppercase; }

        /* PROGRESS BARS */
        .bar-group { display: flex; flex-direction: column; gap: 5px; }
        .bar-labels { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text-sec); letter-spacing: 1px;}
        .bar-labels strong { color: var(--text-main); font-weight: 400; }
        
        .bar-track { width: 100%; height: 3px; background: rgba(255, 255, 255, 0.04); border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 10px; transition: width 1s cubic-bezier(0.16, 1, 0.3, 1); width: 0%; }
        
        .bar-fill.apple { background: #ffffff; } 
        .bar-fill.android { background: var(--accent-smeraldo); }
        .bar-fill.desktop { background: #d4af37; } /* Un tocco di oro per il desktop */

        /* LISTA LOCALITÀ (Massimo 3) */
        .geo-list { display: flex; flex-direction: column; gap: 10px; }
        .geo-item { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border-light); }
        .geo-item:last-child { border-bottom: none; padding-bottom: 0; }
        .geo-city { font-size: 0.75rem; color: #e8e8ed; display: flex; align-items: center; gap: 8px; font-weight: 300; letter-spacing: 0.5px;}
        .geo-views { font-size: 0.75rem; font-weight: 500; color: var(--accent-smeraldo); }

    </style>
</head>
<body>

<div class="dashboard-container">

    <header class="nav-header">
        <a href="#" id="btn-back-console" class="btn-back">
            <i class="fas fa-chevron-left"></i>
            <span>Console</span>
        </a>
        <div class="brand-logo">myquicktag</div>
    </header>

    <section class="hero-stats">
        <h2>Total Scans</h2>
        <div class="total-views" id="counter-views">0</div>
    </section>

    <section class="analytics-card">
        <div class="card-header">
            <i class="fas fa-mobile-alt"></i>
            <h3>Dispositivi</h3>
        </div>
        
        <div class="bar-group">
            <div class="bar-labels"><span>iOS (Apple)</span><strong id="os-apple-perc">0%</strong></div>
            <div class="bar-track"><div class="bar-fill apple" id="os-apple-bar"></div></div>
        </div>

        <div class="bar-group">
            <div class="bar-labels"><span>Android</span><strong id="os-android-perc">0%</strong></div>
            <div class="bar-track"><div class="bar-fill android" id="os-android-bar"></div></div>
        </div>

        <div class="bar-group">
            <div class="bar-labels"><span>Desktop / Altri</span><strong id="os-desktop-perc">0%</strong></div>
            <div class="bar-track"><div class="bar-fill desktop" id="os-desktop-bar"></div></div>
        </div>
    </section>

    <section class="analytics-card" style="margin-bottom: auto;">
        <div class="card-header">
            <i class="fas fa-map-marker-alt"></i>
            <h3>Località Rilevate</h3>
        </div>
        <div class="geo-list" id="geo-list-container">
            <div style="font-size:0.7rem; color:var(--text-sec); text-align:center; padding: 5px 0;">Recupero dati...</div>
        </div>
    </section>

</div>

<script>
    function animaContatore(idElemento, valoreFinale) {
        const el = document.getElementById(idElemento);
        if (!el) return;
        let start = 0;
        const duration = 1000; 
        const frameRate = 30;
        const increment = valoreFinale / (duration / frameRate);
        const timer = setInterval(() => {
            start += increment;
            if (start >= valoreFinale) {
                clearInterval(timer);
                el.innerText = valoreFinale;
            } else {
                el.innerText = Math.floor(start);
            }
        }, frameRate);
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const urlParams = new URLSearchParams(window.location.search);
        let usernameCorrente = urlParams.get("u") || localStorage.getItem("loggedUser");

        const btnBack = document.getElementById('btn-back-console');
        if(btnBack) {
            btnBack.addEventListener('click', (e) => {
                e.preventDefault();
                setTimeout(() => window.location.href = usernameCorrente ? `/profile.html?u=${usernameCorrente}` : '/profile.html', 150);
            });
        }

        if (!usernameCorrente) return;

        try {
            const response = await fetch(`/api/get-profile?u=${usernameCorrente}`);
            const data = await response.json();

            if (data.success && data.fields) {
                const viewsReali = data.fields.views || 0;
                animaContatore('counter-views', viewsReali);

                if (data.fields.analytics_data) {
                    try {
                        const analytics = JSON.parse(data.fields.analytics_data);
                        
                        // 1. Calcolo Dispositivi (iOS, Android, Desktop)
                        const os = analytics.os || {};
                        const appleViews = os.iOS || 0;
                        const androidViews = os.Android || 0;
                        const desktopViews = (os.Desktop || 0) + (os.Other || 0);
                        const totalOsViews = appleViews + androidViews + desktopViews;

                        if (totalOsViews > 0) {
                            const applePerc = Math.round((appleViews / totalOsViews) * 100);
                            const androidPerc = Math.round((androidViews / totalOsViews) * 100);
                            const desktopPerc = Math.round((desktopViews / totalOsViews) * 100);
                            
                            document.getElementById('os-apple-perc').innerText = applePerc + '%';
                            document.getElementById('os-android-perc').innerText = androidPerc + '%';
                            document.getElementById('os-desktop-perc').innerText = desktopPerc + '%';
                            
                            setTimeout(() => {
                                document.getElementById('os-apple-bar').style.width = applePerc + '%';
                                document.getElementById('os-android-bar').style.width = androidPerc + '%';
                                document.getElementById('os-desktop-bar').style.width = desktopPerc + '%';
                            }, 200);
                        }

                        // 2. Classifica Città (Max 3 per non creare scroll)
                        const geo = analytics.geo || {};
                        const geoArray = Object.entries(geo).map(([city, count]) => ({ city, count }));
                        geoArray.sort((a, b) => b.count - a.count);
                        const topGeo = geoArray.slice(0, 3);
                        
                        const geoListEl = document.getElementById('geo-list-container');
                        if (geoListEl) {
                            if (topGeo.length > 0) {
                                geoListEl.innerHTML = topGeo.map(item => `
                                    <div class="geo-item">
                                        <div class="geo-city"><i class="fas fa-location-arrow" style="color: #444; font-size: 0.65rem;"></i> ${item.city}</div>
                                        <div class="geo-views">${item.count}</div>
                                    </div>
                                `).join('');
                            } else {
                                geoListEl.innerHTML = '<div style="font-size:0.7rem; color:var(--text-sec); text-align:center;">Dati non sufficienti.</div>';
                            }
                        }
                    } catch(e) { console.error(e); }
                }
            }
        } catch (error) {
            document.getElementById('counter-views').innerText = "-";
        }
    });
</script>

</body>
</html>
