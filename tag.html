<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attiva Tag - MyQuickTag</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: rgba(255,255,255,0.03); padding: 40px; border-radius: 25px; border: 1px solid rgba(80, 200, 120, 0.2); text-align: center; width: 320px; backdrop-filter: blur(10px); }
        h2 { color: #50C878; font-size: 35px; text-shadow: 0 0 15px rgba(80, 200, 120, 0.4); margin: 0; }
        p { color: gray; font-size: 12px; letter-spacing: 1px; margin: 10px 0 30px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333; background: #111; color: white; margin-bottom: 20px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #50C878; color: black; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { box-shadow: 0 0 20px rgba(80, 200, 120, 0.6); }
        button:disabled { background: #222; color: #555; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="tag-name">@---</h2>
    <p>3 MESI GRATIS • POI 2€/ANNO</p>
    <input type="email" id="email-input" placeholder="La tua email migliore">
    <button id="btn-attiva" onclick="attivaProfilo()">ATTIVA ORA</button>
</div>

<script>
const AIRTABLE_TOKEN = "patHk1SHEGGvX0Odw.02f0d009cc72eb8fe01b9b8ec6876217b9d57f09c135cee6a40d63611974ccc9"; 
const BASE_ID = "app4eQDzqixPDbQTd";
const TABLE_NAME = "Table 1";

const params = new URLSearchParams(window.location.search);
const nomeScelto = params.get("nome") || "utente";
document.getElementById("tag-name").innerText = "@" + nomeScelto.toUpperCase();

async function attivaProfilo() {
    const email = document.getElementById("email-input").value;
    const btn = document.getElementById("btn-attiva");

    if(!email.includes("@")) return alert("Inserisci una email valida");

    btn.innerText = "ATTIVAZIONE...";
    btn.disabled = true;

    try {
        const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}`, {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${AIRTABLE_TOKEN}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                fields: {
                    "nome": nomeScelto.toLowerCase(),
                    "email": email,
                    "stato": "Attivo",
                    "bio": "Benvenuti sul mio profilo MyQuickTag!",
                    "instagram": "",
                    "linkedin": "",
                    "sito": "",
                    "facebook": "",
                    "telegram": "",
                    "reddit": "",
                    "tiktok": "",
                    "cv": "",
                    "youtube": "",
                    "x": ""
                }
            })
        });

        if (response.ok) {
            alert("Ottimo! Tag @" + nomeScelto + " attivata!");
            window.location.href = "edit.html?nome=" + nomeScelto.toLowerCase();
        } else {
            const error = await response.json();
            alert("Errore: " + error.error.message);
            btn.disabled = false;
            btn.innerText = "ATTIVA ORA";
        }
    } catch (e) {
        alert("Errore di connessione.");
        btn.disabled = false;
    }
}
</script>
</body>
</html>
