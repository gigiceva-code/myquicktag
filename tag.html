<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MyQuickTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link id="dynamic-manifest" rel="manifest" href="">
    <link id="dynamic-icon" rel="icon" href="">

    <style>
        :root {
            --bg-color: #000000;
            --accent-smeraldo: #50C878;
            --text-main: #ffffff;
            --text-sec: #6c6c70;
        }
        
        /* Effetto accensione showroom e setup base unificati */
        body {
            opacity: 0;
            transition: opacity 0.6s ease-out;
            margin: 0; padding: 24px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .profile-header {
            margin-top: 40px;
            display: flex; flex-direction: column; align-items: center;
            width: 100%;
        }

        .username {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .bio {
            font-size: 1rem;
            color: var(--text-sec);
            margin-top: 10px;
            max-width: 320px;
            line-height: 1.5;
        }

        .links-container {
            margin-top: 40px;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .pwa-btn {
            background: var(--accent-smeraldo);
            color: #000; border: none; padding: 18px; border-radius: 14px;
            font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        .back-link-top {
            align-self: flex-start;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .back-link-top:active {
            opacity: 1;
            transform: scale(0.97);
        }

        /* Bottone di Sblocco nello Showroom Unificato */
        .sblocco-btn {
            background: #ffffff; color: #000000;
            border: none; padding: 18px; border-radius: 14px;
            font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 10px 25px rgba(255,255,255,0.1);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s !important;
            -webkit-tap-highlight-color: transparent;
        }
        .sblocco-btn:active {
            transform: scale(0.98) !important;
            opacity: 0.9;
        }
        
        /* --- SHOWROOM OVERLAY LUXURY MINIMAL --- */
        .showroom-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 4, 0.75); /* Sfondo scuro premium di partenza */
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 99999;
            display: none; 
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
            transition: background-color 1.5s;
        } 

        .expanding-box {
            width: 0px; height: 0px;
            background: rgba(18, 18, 18, 0.8); /* Card satinata */
            border: 1px solid rgba(255, 255, 255, 0.08); /* Micro-bordo cristallino */
            border-radius: 24px;
            padding: 40px 24px;
            max-width: 360px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            overflow: hidden;
            transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1), height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        } 

        .conversion-content {
            opacity: 0;
            transition: opacity 0.4s ease-out;
            display: flex;
            flex-direction: column;
            gap: 28px;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        #conversion-title {
            font-size: 1.45rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }

        .rendilo-tuo-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.92rem;
            letter-spacing: -0.2px;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
            -webkit-tap-highlight-color: transparent;
        }
        .rendilo-tuo-btn:hover {
            background: #e5e7eb;
        }
        .rendilo-tuo-btn:active {
            transform: scale(0.97);
        }

        /* --- SCHERMATA BENVENUTO REALE TAG --- */
        .tag-welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 4, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 999999;
            padding: 20px;
            box-sizing: border-box;
        }

        .tag-welcome-card {
            background: rgba(18, 18, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 24px;
            max-width: 360px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: tagEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes tagEntrance {
            from { opacity: 0; transform: scale(0.96) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .tag-success-icon {
            font-size: 2.2rem;
            color: #34d399;
            margin-bottom: 20px;
        }

        .tag-welcome-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 12px 0;
            letter-spacing: -0.5px;
        }

        .tag-welcome-text {
            font-size: 0.9rem;
            color: #a1a1aa;
            line-height: 1.5;
            margin: 0 0 32px 0;
        }

        .tag-welcome-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.92rem;
            letter-spacing: -0.2px;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
            -webkit-tap-highlight-color: transparent;
        }
        .tag-welcome-btn:active {
            transform: scale(0.97);
            background: #e4e4e7;
        }

        .tag-skip-btn {
            background: transparent;
            border: none;
            color: #71717a;
            font-size: 0.85rem;
            margin-top: 18px;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .tag-skip-btn:hover {
            color: #a1a1aa;
        } 
    </style>
</head>
<body>

    <a href="#" id="back-to-config" class="back-link-top" style="display: none;">
        <i class="fas fa-arrow-left"></i> Torna alla configurazione
    </a>

    <div id="profile-content" style="display: none; width: 100%; max-width: 350px;">
        <div class="profile-header">
            <h1 class="username" id="tag-username">@...</h1>
            <p class="bio" id="tag-bio">Caricamento in corso...</p>
        </div>

        <div class="links-container" id="links-container"></div>
        
        <div id="cta-sblocco-container" style="display: none; margin-top: 40px; width: 100%;">
            <button class="sblocco-btn" onclick="vaiAlCheckout()">
                <i class="fas fa-unlock-alt"></i> Sblocca la tua MyQuickTag
            </button>
        </div>
    </div>

    <div id="showroom-overlay" class="showroom-overlay">
        <div id="expanding-box" class="expanding-box"> 
            <div class="conversion-content">
                <h2 id="conversion-title">Nessun altro potrà essere @...</h2>
                <button class="rendilo-tuo-btn" id="showroom-action-btn">Attiva la tua myquicktag</button>
            </div>
        </div>
    </div>

    <div id="tag-welcome-overlay" class="tag-welcome-overlay">
        <div class="tag-welcome-card">
            <div class="tag-success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 class="tag-welcome-title">Tag Attivata</h2>
            <p class="tag-welcome-text">
                La tua MyQuickTag è ora operativa. Installa l'applicazione per configurare i tuoi collegamenti e aggiornare la tua Tag in tempo reale.
            </p>
            
            <button class="tag-welcome-btn" id="trigger-pwa-install">
                <i class="fas fa-download"></i> Aggiungi alla Home
            </button>
            
           <button class="tag-skip-btn" onclick="chiudiWelcomeEMostraTag()" style="color: #10B981; font-size: 16px; font-weight: 500; background: none; border: none; cursor: pointer; margin-top: 15px;">
    Visualizza la Tag
</button>
        </div>
    </div>
   <div id="main-tag-profile" style="opacity: 0; transform: scale(0.98); transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); max-width: 480px; margin: 0 auto; padding: 20px;">
    
    <header style="text-align: center; margin-bottom: 40px; margin-top: 30px;">
        <div class="avatar-wrapper" style="position: relative; display: inline-block;">
            <img src="tuo-avatar.jpg" alt="Profile" style="width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
            </div>
        <h1 style="color: #FFFFFF; font-size: 24px; font-weight: 600; margin-top: 16px; letter-spacing: -0.5px;">Nome Utente</h1>
        <p style="color: #8E8E93; font-size: 14px; font-weight: 400; margin-top: 6px; line-height: 1.4;">Ruolo o Bio minimale in due righe.</p>
    </header>

    <main class="tag-grid" style="display: flex; flex-direction: column; gap: 16px;">
        </main>
    
</div> 

    <script>
    const params = new URLSearchParams(window.location.search);
    let nomeUtenteURL = params.get("u") || ""; 
    if (!nomeUtenteURL) {
        const pathParts = window.location.pathname.split('/');
        const uIndex = pathParts.indexOf('u');
        if (uIndex !== -1 && pathParts[uIndex + 1]) nomeUtenteURL = pathParts[uIndex + 1];
    }

    let globalUtente = "";
    let deferredPrompt;
    let identitaVerificata = false;

    if (nomeUtenteURL) {
        globalUtente = nomeUtenteURL.replace('@', '').trim().toLowerCase();
        document.getElementById("dynamic-manifest").href = `/api/manifest?u=${globalUtente}`;
        document.getElementById("dynamic-icon").href = `/api/icon?u=${globalUtente}`;
        caricaProfiloPubblico(globalUtente);
    }

    function vaiAlCheckout() {
        if (!globalUtente) return;
        window.location.href = `/checkout.html?u=${globalUtente}`;
    }

    function vaiAllaTag() {
        if (!globalUtente) return;
        window.location.href = `/tag.html?u=${globalUtente}`;
    }
        
    async function caricaProfiloPubblico(nomeMinuto) {
        try {
            const response = await fetch(`/api/get-profile?u=${nomeMinuto}`);
            const data = await response.json();
            
            if (data.success && data.fields) {
                const record = data.fields;
                const usernamePulito = (record.username_display || nomeMinuto).replace('@', '').toUpperCase();
                
                document.getElementById("tag-username").innerText = "@" + usernamePulito;
                document.getElementById("tag-bio").innerText = record.bio || "";

                const backLink = document.getElementById("back-to-config");
                if (backLink) {
                    backLink.href = `profile.html?u=${nomeMinuto}`;
                }

                const stato = (record.stato || "").toLowerCase().trim();

                if (stato === "in attesa") {
                    identitaVerificata = false;
                    if (backLink) backLink.style.display = "flex";
                    
                    document.getElementById("cta-sblocco-container").style.display = "none";
                    document.getElementById("profile-content").style.display = "block";
                    
                    document.getElementById("conversion-title").innerText = `Nessun altro potrà essere @${usernamePulito}`;
                    
                    const btnRendiloTuo = document.getElementById("showroom-action-btn");
                    if (btnRendiloTuo) {
                        btnRendiloTuo.innerText = "Attiva la tua myquicktag";
                        btnRendiloTuo.onclick = vaiAlCheckout;
                    }
                    
                    document.body.style.opacity = "1";
                    
                    setTimeout(() => {
                        const overlay = document.getElementById("showroom-overlay");
                        const box = document.getElementById("expanding-box"); 
                        const content = document.querySelector(".conversion-content");
                        
                        if (overlay && box && content) {
                            overlay.style.display = "flex";
                            
                            setTimeout(() => {
                                overlay.style.background = "rgba(4, 4, 4, 0.0)"; /* Torna trasparente come da logica animazione */
                                overlay.style.backdropFilter = "blur(0px)";
                                overlay.style.webkitBackdropFilter = "blur(0px)";
                                
                                box.style.width = "340px";  
                                box.style.height = "210px"; 
                                
                                setTimeout(() => {
                                    content.style.opacity = "1";
                                }, 300);
                            }, 50);
                        }
                    }, 2500);
                    
                } else if (stato === "attivo") {
                    identitaVerificata = true;
                    if (backLink) backLink.style.display = "none";
                    document.getElementById("cta-sblocco-container").style.display = "none";
                    if (document.getElementById("showroom-overlay")) {
                        document.getElementById("showroom-overlay").style.display = "none";
                    }
                    document.getElementById("profile-content").style.display = "block";
                    mostraInstallatorePremium();
                    document.body.style.opacity = "1";
                }
            } else {
                document.body.style.opacity = "1";
            }
        } catch (error) {
            console.error("Errore di caricamento:", error);
            document.body.style.opacity = "1";
        }
    }

    // Gestione Evento Installazione PWA Nativo
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (identitaVerificata) {
            mostraInstallatorePremium();
        }
    });

    function mostraInstallatorePremium() {
        if (!deferredPrompt || !identitaVerificata) return;
        
        const overlay = document.getElementById("tag-welcome-overlay");
        if (overlay) {
            overlay.style.display = "flex";
        }

        const btnInstall = document.getElementById("trigger-pwa-install");
        if (btnInstall) {
            btnInstall.onclick = () => {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('PWA installata con successo.');
                        chiudiWelcomeEMostraTag();
                    }
                    deferredPrompt = null;
                });
            };
        }
    }

   function chiudiWelcomeEMostraTag() {
    const overlay = document.getElementById("tag-welcome-overlay");
    if (overlay) {
        // 1. Iniettiamo al volo la transizione d'élite (curva cubic-bezier stile Apple)
        overlay.style.transition = "opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)";
        
        // 2. Facciamo sfumare e arretrare leggermente l'overlay
        overlay.style.opacity = "0";
        overlay.style.transform = "scale(0.98)";
        
        // 3. Solo quando l'animazione è finita (dopo 400ms), lo spegniamo del tutto
        setTimeout(function() {
            overlay.style.display = "none";
        }, 400);
    }
}

document.addEventListener("DOMContentLoaded", function() {
    const backLink = document.getElementById("back-to-config");
    if (backLink) {
        backLink.addEventListener("click", function(e) {
            e.preventDefault();
            const targetUrl = this.href;
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 250);
        });
    }
});
</script>

</body>
</html>
