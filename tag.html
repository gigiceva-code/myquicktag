<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyQuickTag - @${nome}</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <div class="max-w-2xl mx-auto pt-12 px-5">
    <a href="index.html" class="flex items-center gap-2 text-zinc-400 hover:text-white mb-8">← Torna alla ricerca</a>
    <div id="content"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let nome = urlParams.get('nome')?.toLowerCase().trim() || '';

    function loadTag() {
      const content = document.getElementById('content');
      
      content.innerHTML = `
        <div class="text-center mb-10">
          <div class="inline-flex items-center bg-emerald-500/10 text-emerald-400 rounded-full px-6 py-2 text-sm font-medium mb-6">
            <i class="fas fa-check-circle mr-2"></i> DISPONIBILE
          </div>
          <h1 class="text-7xl font-bold tracking-tighter mb-2">@${nome}</h1>
          <p class="text-2xl text-zinc-400">È libero. Prendilo prima che sparisca.</p>
        </div>

        <div class="bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-700">
          <div class="bg-gradient-to-r from-blue-600 to-purple-600 h-36 relative">
            <div class="absolute -bottom-12 left-8 w-24 h-24 bg-zinc-950 rounded-3xl border-4 border-zinc-900 flex items-center justify-center text-6xl shadow-2xl">
              👤
            </div>
          </div>

          <div class="pt-16 pb-10 px-8">
            <h2 class="text-4xl font-semibold">@${nome}</h2>
            <p class="text-zinc-400">La tua identità digitale unica</p>

            <div class="mt-10 space-y-6">
              <div class="flex items-center gap-4 bg-zinc-800 rounded-2xl p-5">
                <i class="fas fa-user text-3xl w-10"></i>
                <div><strong>Bio</strong><br>La tua presentazione apparirà qui</div>
              </div>
              <div class="flex items-center gap-4 bg-zinc-800 rounded-2xl p-5">
                <i class="fab fa-instagram text-3xl w-10"></i>
                <div><strong>Social & Link</strong><br>Tutti i tuoi collegamenti</div>
              </div>
              <div class="flex items-center gap-4 bg-zinc-800 rounded-2xl p-5">
                <i class="fas fa-qrcode text-3xl w-10"></i>
                <div><strong>QR Code</strong><br>Per condividere offline</div>
              </div>
            </div>
          </div>
        </div>

        <button onclick="claimName()" class="w-full mt-10 bg-white text-black py-7 rounded-3xl text-2xl font-semibold hover:bg-emerald-400 transition-all">
          🎯 Attiva @${nome} GRATIS per 3 mesi
        </button>

        <p class="text-center text-sm text-zinc-500 mt-6">Poi solo 2€/anno</p>
      `;
    }

    function claimName() {
      alert(`✅ @${nome} registrato con successo!`);
      setTimeout(() => {
        window.location.href = `edit.html?nome=${nome}`;
      }, 800);
    }

    window.onload = loadTag;
  </script>
</body>
</html>
