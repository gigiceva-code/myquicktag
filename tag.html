<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MyQuickTag Identity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link id="dynamic-manifest" rel="manifest" href="">
    <link id="dynamic-icon" rel="icon" href="">

    <style>
        /* Effetto accensione showroom */
body {
    opacity: 0;
    transition: opacity 0.6s ease-out; /* 0.6 secondi di pura dissolvenza fluida */
}
        :root {
            --bg-color: #000000;
            --accent-smeraldo: #50C878;
            --text-main: #ffffff;
            --text-sec: #6c6c70;
        }
        
        body {
            margin: 0; padding: 24px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .profile-header {
            margin-top: 40px;
            display: flex; flex-direction: column; align-items: center;
            width: 100%;
        }

        .avatar {
            width: 120px; height: 120px;
            border-radius: 50%;
            background-color: #111;
            border: 2px solid var(--accent-smeraldo);
            object-fit: cover;
            margin-bottom: 20px;
        }

        .username {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .bio {
            font-size: 1rem;
            color: var(--text-sec);
            margin-top: 10px;
            max-width: 320px;
            line-height: 1.5;
        }

        .links-container {
            margin-top: 40px;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Stile modale per la password */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 1000;
            justify-content: center; align-items: center; padding: 24px;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }

        .modal-box {
            background: #111; border: 1px solid #333; border-radius: 20px;
            padding: 30px 24px; width: 100%; max-width: 340px; text-align: center;
        }

        .modal-box h2 {
            color: var(--accent-smeraldo); margin: 0 0 10px 0; font-size: 1.4rem;
        }

        .modal-box p {
            color: #aaa; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.4;
        }

        .modal-box input {
            width: 100%; padding: 16px; margin-bottom: 20px;
            background: #000; border: 1px solid #444; color: white;
            border-radius: 12px; box-sizing: border-box; font-size: 1rem;
        }

        .modal-box input:focus {
            outline: none; border-color: var(--accent-smeraldo);
        }

        .modal-box button {
            background: var(--accent-smeraldo); color: #000;
            border: none; padding: 16px; border-radius: 12px;
            font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%;
            transition: opacity 0.2s;
        }
        
        .modal-box button:active { opacity: 0.8; }

        /* Bottone PWA dinamico */
        .pwa-btn {
            background: var(--accent-smeraldo);
            color: #000; border: none; padding: 18px; border-radius: 14px;
            font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        /* Stile per la freccia torna alla configurazione */
        .back-link-top {
            align-self: flex-start;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .back-link-top:active {
            opacity: 1;
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <a href="#" id="back-to-config" class="back-link-top" style="display: none;">
        <i class="fas fa-arrow-left"></i> Torna alla configurazione
    </a>

    <div id="profile-content" style="display: none; width: 100%; max-width: 350px;">
        
        <div class="profile-header">
            <h1 class="username" id="tag-username">@...</h1>
            <p class="bio" id="tag-bio">Caricamento identità...</p>
        </div>

        <div class="links-container" id="links-container"></div>
        
    </div>

    <div class="modal-overlay" id="activation-modal">
        <div class="modal-box">
            <h2>Ti scatta il regalo!</h2>
            <p>Crea la tua chiave (password) per attivare la tua MyQuickTag e abilitare l'app.</p>
            <input type="password" id="new-password" placeholder="Scegli una password">
            <button onclick="salvaPasswordEAttiva()">Salva e Attiva</button>
        </div>
    </div>
    <div class="links-container" id="links-container">
        </div>

    <div class="modal-overlay" id="activation-modal">
        <div class="modal-box">
            <h2>Ti scatta il regalo!</h2>
            <p>Crea la tua chiave (password) per attivare la tua MyQuickTag e abilitare l'app.</p>
            <input type="password" id="new-password" placeholder="Scegli una password">
            <button onclick="salvaPasswordEAttiva()">Salva e Attiva</button>
        </div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    let nomeUtenteURL = params.get("u") || ""; 
    if (!nomeUtenteURL) {
        const pathParts = window.location.pathname.split('/');
        const uIndex = pathParts.indexOf('u');
        if (uIndex !== -1 && pathParts[uIndex + 1]) nomeUtenteURL = pathParts[uIndex + 1];
    }

    let globalUtente = "";
    let deferredPrompt;
    let identitaVerificata = false; // NUOVO: Blocca il bottone finché non sappiamo lo stato

    if (nomeUtenteURL) {
        globalUtente = nomeUtenteURL.replace('@', '').trim().toLowerCase();
        document.getElementById("dynamic-manifest").href = `/api/manifest?u=${globalUtente}`;
        document.getElementById("dynamic-icon").href = `/api/icon?u=${globalUtente}`;
        caricaProfiloPubblico(globalUtente);
    }

    
async function caricaProfiloPubblico(nomeMinuto) {
    try {
        // La chiamata fetch viaggia al buio mentre lo schermo è nero
        const response = await fetch(`/api/get-profile?u=${nomeMinuto}`);
        const data = await response.json();
        
        if (data.success && data.fields) {
            const record = data.fields;
            
            // 1. Popoliamo i testi reali dietro le quinte
            document.getElementById("tag-username").innerText = "@" + (record.username_display || nomeMinuto).replace('@', '').toUpperCase();
            document.getElementById("tag-bio").innerText = record.bio || "";

            // Configura il link della freccia di ritorno alla configurazione (usando l'username pulito)
            const backLink = document.getElementById("back-to-config");
            if (backLink) {
                backLink.href = `profile.html?u=${nomeMinuto}`;
            }

            // Normalizzazione dello stato da Airtable
            const stato = (record.stato || "").toLowerCase().trim();

            if (stato === "in attesa") {
                // MODALITÀ SHOWROOM (Utente nuovo da attivare)
                identitaVerificata = false;
                
                // Facciamo apparire la freccia bianca "Torna alla configurazione"
                if (backLink) backLink.style.display = "flex";
                
                // Mostriamo il profilo compilato
                document.getElementById("profile-content").style.display = "block";
                
                // IMPORTANTE: La modale di attivazione NON si apre da sola. Resta spenta.
                document.getElementById("activation-modal").style.display = "none";
                
            } else if (stato === "attivo") {
                // MODALITÀ TAG FINALE ATTIVA
                identitaVerificata = true;
                
                // La freccia di ritorno sparisce (il profilo è pubblico)
                if (backLink) backLink.style.display = "none";
                
                // Mostriamo il profilo attivo e lanciamo il bottone PWA
                document.getElementById("profile-content").style.display = "block";
                mostraBottonePWA();
            }

            // SOLO ORA che tutto è pronto, accendiamo la pagina con la dissolvenza showroom
            document.body.style.opacity = "1";
        }
    } catch (error) {
        console.error("Errore di caricamento:", error);
        // Se c'è un errore, accendiamo comunque la pagina per non lasciare l'utente al buio eterno
        document.body.style.opacity = "1";
    }
}
    async function salvaPasswordEAttiva() {
    const pwd = document.getElementById("new-password").value;
    if (pwd.length < 4) {
        alert("La password deve essere di almeno 4 caratteri.");
        return;
    }

    try {
        // Inviamo i dati con i nomi esatti che l'API vuole
        const response = await fetch('/api/update-profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username_system: globalUtente, // CAMBIATO da 'u' a 'username_system'
                password: pwd,
            stato: "attivo"      
            })
        });
        
        const resData = await response.json();
        if (resData.success) {
            document.getElementById("activation-modal").style.display = "none";
            identitaVerificata = true; 
            setTimeout(() => {
                alert("Identità Attivata!");
                mostraBottonePWA();
            }, 300);
        } else {
            alert("Errore: " + (resData.error || "Riprova"));
        }
    } catch (e) {
        console.error(e);
        alert("Errore di rete.");
    }
}


    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });

    function mostraBottonePWA() {
        if (deferredPrompt && identitaVerificata && !document.getElementById("btn-installa-pwa")) {
            const btn = document.createElement('button');
            btn.id = "btn-installa-pwa";
            btn.className = "pwa-btn";
            btn.innerHTML = `<i class="fas fa-download"></i> Installa App`;
            btn.onclick = () => { deferredPrompt.prompt(); };
            document.getElementById("links-container").prepend(btn);
        }
    }
      document.addEventListener("DOMContentLoaded", function() {
    // Gestione del click ammortizzato sulla freccia di ritorno (250ms)
    const backLink = document.getElementById("back-to-config");
    if (backLink) {
        backLink.addEventListener("click", function(e) {
            e.preventDefault();
            const targetUrl = this.href;
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 250);
        });
    }
});
</script>

</body>
</html>
