<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MyQuickTag | Digital Touch</title>
    <meta name="description" content="Profilo digitale MyQuickTag - Connettiti con un tocco.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
    /* Reset & Base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        background-color: #000000; 
        color: #FFFFFF; 
        font-family: 'Inter', sans-serif; 
        display: flex; 
        justify-content: center; 
        min-height: 100vh;
    }

    #profile-container {
        width: 100%;
        max-width: 450px; /* Perfetto per Mobile */
        background: #000000;
        position: relative;
    }

    /* Header & Immagini */
    .profile-header { position: relative; height: 220px; }
    
    #cover-bg { 
        width: 100%; height: 100%; 
        background: #111; /* Sostituito dall'immagine di Airtable */
        background-size: cover; background-position: center;
    }

    #avatar-container {
        position: absolute;
        bottom: -50px; left: 50%;
        transform: translateX(-50%);
        width: 110px; height: 110px;
        border-radius: 50%;
        border: 3px solid #000;
        background: #222; overflow: hidden;
    }
    
    #user-avatar { width: 100%; height: 100%; object-fit: cover; }

    /* Testi */
    .profile-info { 
        margin-top: 60px; text-align: center; padding: 20px; 
    }
    
    #user-name { 
        font-size: 24px; font-weight: 600; letter-spacing: -0.5px; 
        color: #E0E0E0; /* Silver White */
    }
    
    #user-bio { 
        font-size: 14px; color: #888; margin-top: 10px; line-height: 1.5; 
    }

    /* Griglia Social */
    #social-grid { 
        display: grid; grid-template-columns: repeat(2, 1fr); 
        gap: 15px; padding: 20px; 
    }

    .social-btn {
        background: #0A0A0A; /* Nero quasi profondo */
        border: 1px solid #1A1A1A; /* Bordo sottile ed elegante */
        border-radius: 12px;
        padding: 15px;
        color: #FFF;
        text-decoration: none;
        display: flex; flex-direction: column; align-items: center;
        transition: transform 0.2s, background 0.2s;
    }

    .social-btn:active { transform: scale(0.95); background: #111; }

    /* Footer */
    .profile-footer { 
        text-align: center; padding: 40px 20px; 
        font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 2px;
    }
</style>

</head>
<body>

    <main id="profile-container">
        
        <header class="profile-header">
            <div id="cover-bg"></div>
            <div id="avatar-container">
                <img id="user-avatar" src="" alt="Avatar">
            </div>
        </header>

        <section class="profile-info">
            <h1 id="user-name"></h1>
            <p id="user-bio"></p>
        </section>

        <nav id="social-grid">
            </nav>

        <footer class="profile-footer">
            <div id="visits-counter">Visite: 0</div>
            <div id="last-update">Aggiornato: --/--/--</div>
        </nav>

    </main>
<script>
const AIRTABLE_TOKEN = "patHk1SHEGGvX0Odw.02f0d009cc72eb8fe01b9b8ec6876217b9d57f09c135cee6a40d63611974ccc9"; 
const BASE_ID = "app4eQDzqixPDbQTd";
const TABLE_NAME = "Table 1"; // Verifica se il nome della tabella è ancora questo

const params = new URLSearchParams(window.location.search);
const nomeUtente = params.get("nome");

if (nomeUtente) {
    caricaDatiProfilo(nomeUtente.toLowerCase());
} else {
    document.body.innerHTML = "<div style='padding:50px; text-align:center;'>Profilo non specificato.</div>";
}

async function caricaDatiProfilo(nome) {
    const url = `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}?filterByFormula={nome}='${nome}'`;
    
    try {
        const response = await fetch(url, {
            headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` }
        });
        const data = await response.json();

        if (data.records.length > 0) {
            const record = data.records[0].fields;

            // Popolamento testi
            document.getElementById("user-name").innerText = "@" + nome.toUpperCase();
            document.getElementById("user-bio").innerText = record.bio || "";
            
            // Gestione Immagini
            if(record.avatar) document.getElementById("user-avatar").src = record.avatar[0].url;
            if(record.cover) document.getElementById("cover-bg").style.backgroundImage = `url('${record.cover[0].url}')`;

            // Generazione Dinamica Social Buttons
            const socialGrid = document.getElementById("social-grid");
            const canaliSocial = ["instagram", "linkedin", "facebook", "tiktok", "telegram", "sito", "youtube", "x"];
            
            canaliSocial.forEach(social => {
                if (record[social]) {
                    const btn = document.createElement("a");
                    btn.href = record[social];
                    btn.className = "social-btn";
                    btn.target = "_blank";
                    btn.innerHTML = `<span>${social.toUpperCase()}</span>`;
                    socialGrid.appendChild(btn);
                }
            });

            // Footer
            document.getElementById("visits-counter").innerText = `Visite: ${record.visits || 0}`;

        } else {
            document.body.innerHTML = "<div style='padding:50px; text-align:center;'>Profilo non trovato.</div>";
        }
    } catch (error) {
        console.error("Errore:", error);
    }
}
</script>
</body>
</html>
