<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag | Digital Profile</title>
    <style>
        :root {
            --bg: #000000;
            --card-bg: #0a0a0a;
            --text: #ffffff;
            --accent: #ffffff;
            --gray: #888888;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .tag-container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 40px 20px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -1px;
            margin: 10px 0;
            text-transform: lowercase; /* Stile tech luxury */
        }

        .bio {
            color: var(--gray);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: var(--card-bg);
            color: var(--text);
            text-decoration: none;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: var(--accent);
            color: var(--bg);
            transform: translateY(-2px);
        }

        .footer-logo {
            margin-top: 50px;
            font-size: 12px;
            color: #333;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="tag-container">
        <img id="display-avatar" src="https://via.placeholder.com/150" alt="Avatar" class="avatar">
        <h1 id="display-name">@loading...</h1>
        <p id="display-bio" class="bio"></p>

        <div id="social-links" class="links-container"></div>

        <div class="footer-logo">MYQUICKTAG LUXURY</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let user = params.get("u");

        async function fetchProfile() {
            if (!user) return;
            const cleanUser = user.replace('@', '').toLowerCase();
            
            try {
                const response = await fetch(`/api/get-profile?u=${cleanUser}`);
                const result = await response.json();

                if (result.success) {
                    const d = result.fields;
                    document.getElementById("display-name").innerText = d.username_display || "@" + cleanUser;
                    document.getElementById("display-bio").innerText = d.bio || "";
                    
                    const container = document.getElementById("social-links");
                    const socialMap = ["instagram", "tiktok", "whatsapp", "linkedin", "youtube", "sito_web"];

                    socialMap.forEach(key => {
                        if (d[key]) {
                            const a = document.createElement("a");
                            a.className = "btn";
                            a.href = d[key].startsWith('http') ? d[key] : `https://${d[key]}`;
                            a.target = "_blank";
                            a.innerText = key.replace('_', ' ');
                            container.appendChild(a);
                        }
                    });
                }
            } catch (e) { console.error(e); }
        }
        fetchProfile();
    </script>
</body>
</html>
