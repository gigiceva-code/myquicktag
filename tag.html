<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag - Digital Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #ffffff;
            --text-secondary: #a0a0a0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Contenitore Principale */
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Header & Avatar */
        .header {
            margin-top: 40px;
            margin-bottom: 30px;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
        }

        #user-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
            padding: 5px;
            background: linear-gradient(45deg, #222, #000);
        }

        h1 { font-size: 1.4rem; font-weight: 600; margin: 10px 0 5px; letter-spacing: -0.5px; }
        .bio { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; margin-bottom: 30px; padding: 0 20px; }

        /* Griglia Social & Link */
        .links-container { display: flex; flex-direction: column; gap: 12px; }

        .btn-link {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn-link:active { transform: scale(0.97); background: rgba(255,255,255,0.1); }

        .btn-link i {
            font-size: 1.2rem;
            width: 30px;
            text-align: left;
        }

        .btn-link span { flex-grow: 1; text-align: center; font-weight: 400; font-size: 0.95rem; }
        .btn-link .arrow { font-size: 0.8rem; color: var(--text-secondary); }

        /* Footer */
        .footer {
            margin-top: 50px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="avatar-container">
                <img id="user-avatar" src="https://via.placeholder.com/150" alt="Avatar">
            </div>
            <h1 id="user-name">@NOMEUTENTE</h1>
            <p class="bio" id="user-bio">Caricamento profilo luxury...</p>
        </div>

        <div class="links-container" id="social-grid">
            <div class="btn-link">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
                <i class="fas fa-chevron-right arrow"></i>
            </div>
        </div>

        
    </div>

    <script>
        
const params = new URLSearchParams(window.location.search);
const nomeUtente = params.get("u"); // Cambiato da 'nome' a 'u'

// Mappatura Icone Social
const socialIcons = {
    instagram: "fab fa-instagram",
    linkedin: "fab fa-linkedin-in",
    facebook: "fab fa-facebook-f",
    tiktok: "fab fa-tiktok",
    telegram: "fab fa-telegram-plane",
    sito_web: "fas fa-globe",
    youtube: "fab fa-youtube",
    x: "fab fa-x-twitter",
    whatsapp: "fab fa-whatsapp"
};

if (nomeUtente) {
    caricaDatiProfilo(nomeUtente.toLowerCase());
} else {
    document.body.innerHTML = "<div style='padding:50px; text-align:center;'>Profilo non specificato.</div>";
}

async function caricaDatiProfilo(nome) {
    const nomePulito = nome.trim().toLowerCase();
    
    try {
        // Chiamata all'API sicura invece di Airtable diretto
        const response = await fetch(`/api/get-profile?u=${nomePulito}`);
        const data = await response.json();

        if (data.success) {
            const record = data.fields;

            // --- CONTROLLO STATO ---
            if (record.stato !== "Attivo") {
                document.body.innerHTML = "<div style='padding:50px; text-align:center;'>Profilo Sospeso.</div>";
                return;
            }

            // --- AGGIORNAMENTO INTERFACCIA ---
            document.getElementById("user-name").innerText = "@" + nomePulito.toUpperCase();
            document.getElementById("user-bio").innerText = record.bio || "Digital Identity";
            
            if(record.avatar && record.avatar[0]) {
                document.getElementById("user-avatar").src = record.avatar[0].url;
            }

            const linksContainer = document.getElementById("social-grid");
            linksContainer.innerHTML = ""; 

            // Ciclo sui social
            Object.keys(socialIcons).forEach(social => {
                if (record[social]) {
                    const btn = document.createElement("a");
                    btn.href = record[social];
                    btn.className = "btn-link";
                    btn.target = "_blank";
                    btn.innerHTML = `
                        <i class="${socialIcons[social]}"></i>
                        <span>${social === 'sito_web' ? 'SITO WEB' : social.toUpperCase()}</span>
                        <i class="fas fa-chevron-right arrow"></i>
                    `;
                    linksContainer.appendChild(btn);
                }
            });
        } else {
            document.body.innerHTML = "<div style='padding:50px; text-align:center;'>Profilo non trovato.</div>";
        }
    } catch (error) {
        console.error("Errore Fetch:", error);
    }
}
    </script>
</body>
</html>
