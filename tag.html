/* --- CONFIGURAZIONE MONOLITO: TOLLERANZE REALI --- */
:root {
    --bg-esterno: #0d0d0f;       
    --bg-chassis: #000000;       
    --accent-gold: #d4af37;      
    --text-main: #f5f5f7;
    --text-sec: #86868b;         /* 🎯 RIPRISTINATO: Grigio chiaro visibile e leggibile */
    --text-disattivato: #3a3a3c;
}

/* --- RESET AEROSPAZIALE --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

/* --- IL VIEWPORT ESTERNO CON REFRESH REATTIVO --- */
html {
    height: 100%;
    overscroll-behavior-y: auto !important; /* Autorizza il browser al bounce del refresh */
}
body {
    background-color: var(--bg-esterno);
    color: var(--text-main);
    
    /* 🎯 Sincronizzato in dvh + pixel fantasma per la molla del refresh */
    min-height: calc(100dvh + 1px) !important; 
    
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
    overflow-y: auto !important; 
    -webkit-overflow-scrolling: touch;
    -webkit-font-smoothing: antialiased;
}

/* --- APP CONTAINER: CHASSIS DINAMICO BLINDATO --- */
.app-container {
    display: none;
    opacity: 0;
    position: fixed !important;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.99);
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    
    width: calc(100% - 32px);
    max-width: 410px;
    
    /* 🎯 LA SVOLTA: Usiamo dvh al posto di vh. Lo chassis si rimpicciolisce 
       da solo se esce la barra di Chrome, tenendo il menu sempre visibile */
    height: calc(100svh - 32px); 
    max-height: 840px;
    padding: 40px 24px 32px 24px;
    
    background-color: var(--bg-chassis);
    border: 1px solid rgba(212, 175, 55, 0.5); 
    border-radius: 28px;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2;
    box-shadow: 0 30px 70px rgba(0,0,0,0.9);
    overflow: hidden; 
}

/* 🎯 INTERRUTTORE ACCENSIONE: Mantiene la centratura assoluta e applica la scala */
.app-container.ready {
    display: flex !important;
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) !important;
}
  /* ============================================================
   🏛️ BLOCCO 3: APPARATO ESTETICO LOGO E QR (MONOLITO VERTICALE)
   ============================================================ */

/* 🎯 L'AVATAR ADATTIVO - Ripulito dalla griglia orizzontale */
.avatar-block {
    display: flex !important; 
    width: 52px !important;
    height: 52px !important;
    
    /* Taglio a Rounded-Square Executive: perfetto sia per volti che per loghi aziendali */
    border-radius: 12px !important; 
    background: #070708 !important;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    margin-bottom: 5px;
}

/* 🎯 IL QR CODE D'AUTORE METALLICO CHROMATICO - Svincolato dalla griglia */
.qr-wrapper {
    width: 44px !important;
    height: 44px !important;
    background: #ffffff !important; /* Sfondo bianco nativo necessario al filtro per riflettere l'oro */
    border: 1px solid rgba(212, 175, 55, 0.3) !important;
    border-radius: 10px !important;
    padding: 4px !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    overflow: hidden;
    transition: all 0.3s ease;
}
/* Forzatura geometrica e cromatica del QR iniettato da qrcode.js */
.qr-wrapper canvas, .qr-wrapper img {
    width: 100% !important;
    height: 100% !important;
    display: block !important;
    object-fit: contain !important; /* Impedisce deformazioni dei pixel */
    filter: invert(1) sepia(1) saturate(6) hue-rotate(12deg) brightness(0.95);
}

// ============================================================
// APERTURA OVERLAY SEZIONE INTERNA
// ============================================================
function apriSezione(tipo) {
    console.log('apriSezione:', tipo);

    const overlay = document.getElementById('overlaySezione');
    const titolo = document.getElementById('titoloSezione');
    const corpo = document.getElementById('corpoSezione');
    
    console.log('overlay:', overlay, 'titolo:', titolo, 'corpo:', corpo);
    if (!overlay || !titolo || !corpo) return;

    // --- SEZIONE SITO WEB ---
    if (tipo === 'sito') {
        titolo.textContent = 'Sito Web';
        corpo.innerHTML = '';

        const urlSito = cacheDatiUtente.sito_web || '';
        const dominioPulito = urlSito.replace(/https?:\/\/(www\.)?/, '').split('/')[0];

        if (!urlSito) {
            corpo.textContent = 'Nessun sito web configurato.';
        } else {
            const riga = document.createElement('div');
            riga.style.cssText = 'display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.06);';

            const link = document.createElement('a');
            link.href = urlSito;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.style.cssText = 'display:flex; align-items:center; gap:12px; flex:1; text-decoration:none; color:inherit;';
            link.innerHTML = `<i class="fas fa-globe" style="font-size:1.1rem; width:22px; text-align:center; color:#ffffff;"></i><span style="font-size:0.95rem; color:#f5f5f7; font-weight:500;">${dominioPulito || urlSito}</span>`;

            const btnCopia = document.createElement('button');
            btnCopia.style.cssText = 'background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#ffffff; padding:7px 10px; border-radius:8px; cursor:pointer; flex-shrink:0;';
            btnCopia.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>';
            btnCopia.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                _condividi(dominioPulito || urlSito, urlSito);
            };

            riga.appendChild(link);
            riga.appendChild(btnCopia);
            corpo.appendChild(riga);
        }

        const btnCondividiSezione = document.getElementById('btnCondividiLink');
        if (btnCondividiSezione) btnCondividiSezione.style.display = 'none';

        overlay.classList.add('attiva');
        history.pushState({ overlay: 'sezione', tipo: 'sito' }, '');
        return;
    }

    // --- SEZIONE CONTATTI ---
    if (tipo === 'contatti') {
        titolo.textContent = 'Contatti';
        corpo.innerHTML = '';

        const piano = (cacheDatiUtente.plan || '').toUpperCase();
        let vcf = {};
        try { 
            const raw = cacheDatiUtente.modulo_vcf;
            vcf = typeof raw === 'object' ? raw : JSON.parse(raw || '{}');
        } catch(e) {}

        console.log('piano:', piano);
        console.log('vcf:', vcf);

        const email = cacheDatiUtente.email || vcf.email1 || '';
        const tel1 = vcf.telefono1 || '';
        const tel2 = vcf.telefono2 || '';
        const email2 = vcf.email2 || '';
        const indirizzo = vcf.indirizzo || '';
        const piva = vcf.piva || '';

        const campiBase = [];
        if (tel1) campiBase.push({ icona: 'fas fa-phone', label: tel1, azione: `tel:${tel1}`, copia: tel1 });
        if (email) campiBase.push({ icona: 'fas fa-envelope', label: email, azione: `mailto:${email}`, copia: email });

        const campiPremium = [];
        if (tel2) campiPremium.push({ icona: 'fas fa-phone', label: tel2, azione: `tel:${tel2}`, copia: tel2 });
        if (email2) campiPremium.push({ icona: 'fas fa-envelope', label: email2, azione: `mailto:${email2}`, copia: email2 });
        if (indirizzo) campiPremium.push({ icona: 'fas fa-map-marker-alt', label: indirizzo, azione: `https://maps.google.com/?q=${encodeURIComponent(indirizzo)}`, copia: indirizzo });
        if (piva) campiPremium.push({ icona: 'fas fa-file-invoice', label: 'P.IVA: ' + piva, azione: null, copia: piva });

        const tuttiCampi = piano === 'BASE' ? campiBase : [...campiBase, ...campiPremium];

        if (tuttiCampi.length === 0) {
            corpo.textContent = 'Nessun contatto configurato.';
        } else {
            tuttiCampi.forEach(campo => {
                const riga = document.createElement('div');
                riga.style.cssText = 'display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.06);';

                const sinistro = document.createElement(campo.azione ? 'a' : 'div');
                if (campo.azione) {
                    sinistro.href = campo.azione;
                    if (campo.azione.startsWith('http')) sinistro.target = '_blank';
                    sinistro.rel = 'noopener noreferrer';
                }
                sinistro.style.cssText = 'display:flex; align-items:center; gap:12px; flex:1; text-decoration:none; color:inherit;';
                sinistro.innerHTML = `<i class="${campo.icona}" style="font-size:1.1rem; width:22px; text-align:center; color:#ffffff;"></i><span style="font-size:0.9rem; color:#f5f5f7;">${campo.label}</span>`;

                const btnCopia = document.createElement('button');
                btnCopia.style.cssText = 'background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#ffffff; padding:7px 10px; border-radius:8px; cursor:pointer; flex-shrink:0;';
                btnCopia.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>';
                btnCopia.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    _condividi(campo.label, campo.copia);
                };

                riga.appendChild(sinistro);
                riga.appendChild(btnCopia);
                corpo.appendChild(riga);
            });

            if (piano !== 'BASE') {
                const btnVcf = document.createElement('button');
                btnVcf.style.cssText = 'width:100%; margin-top:20px; padding:14px; background:#10b981; border:none; border-radius:12px; color:#000000; font-size:0.9rem; font-weight:700; cursor:pointer;';
                btnVcf.textContent = 'Salva in rubrica';
                btnVcf.onclick = () => scaricaVCF(vcf, cacheDatiUtente);
                corpo.appendChild(btnVcf);
            }
        }

        const btnCondividiSezione = document.getElementById('btnCondividiLink');
        if (btnCondividiSezione) btnCondividiSezione.style.display = 'none';

        overlay.classList.add('attiva');
        history.pushState({ overlay: 'sezione', tipo: 'contatti' }, '');
        return;
    }

    // --- SEZIONE SOCIAL ---
    if (tipo === 'social') {
        titolo.textContent = 'Canali social';
        corpo.innerHTML = '';
        
        let canali = [];
        try { canali = JSON.parse(cacheDatiUtente.config_canali || '[]'); } catch(e) {}

        if (canali.length === 0) {
            corpo.textContent = 'Nessun canale configurato.';
        } else {
            canali.forEach(canale => {
                const nomeLower = canale.nome.toLowerCase();
                const iconClass = socialIcons[nomeLower] || socialIcons["default"];

                const riga = document.createElement('div');
                riga.style.cssText = 'display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.06);';

                const link = document.createElement('a');
                link.href = canale.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.style.cssText = 'display:flex; align-items:center; gap:12px; flex:1; text-decoration:none; color:inherit;';
                link.innerHTML = `<i class="${iconClass}" style="font-size:1.2rem; width:22px; text-align:center; color:#ffffff;"></i><span style="font-size:0.95rem; font-weight:500;">${canale.nome}</span>`;

                const btnCondividi = document.createElement('button');
                btnCondividi.style.cssText = 'background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#ffffff; padding:7px 10px; border-radius:8px; cursor:pointer; flex-shrink:0;';
                btnCondividi.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>';
                btnCondividi.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    _condividi(canale.nome, canale.url);
                };

                riga.appendChild(link);
                riga.appendChild(btnCondividi);
                corpo.appendChild(riga);
            });
        }

        const btnCondividiSezione = document.getElementById('btnCondividiLink');
        if (btnCondividiSezione) btnCondividiSezione.style.display = 'none';

        overlay.classList.add('attiva');
        history.pushState({ overlay: 'sezione', tipo: 'social' }, '');
        return;
    }

    // --- ALTRE SEZIONI TESTUALI (BIO, GALLERY, CV) ---
    const contenuti = {
        'bio':      { t: 'Biografia',        c: cacheDatiUtente.bio      || 'Nessuna bio disponibile.' },
        'cv':       { t: 'Curriculum Vitae', c: cacheDatiUtente.cv       || 'CV non ancora configurato.' },
        'gallery':  { t: 'Gallery',          c: cacheDatiUtente.gallery  || 'Gallery non ancora configurata.' },
        'futuro':   { t: 'Coming Soon',      c: 'Questo spazio sarà presto disponibile.' }
    };

    if (!contenuti[tipo]) return;

    titolo.textContent = contenuti[tipo].t;
    corpo.textContent  = contenuti[tipo].c;

    const btnCondividiSezione = document.getElementById('btnCondividiLink');
    if (btnCondividiSezione) {
        btnCondividiSezione.style.display = tipo === 'cv' ? 'block' : 'none';
    }

    overlay.classList.add('attiva');
    history.pushState({ overlay: 'sezione', tipo: tipo }, '');
}
/* ============================================================
   🚀 RETTIFICA QUICK ACTION: LA BARRA FLUTTUANTE PREMIUM
   ============================================================ */
#casella-quick-action {
    position: absolute !important;
    bottom: 70px !important; /* Solleva il calendario sopra la linea dei menu */
    left: 24px !important;
    right: 24px !important;

    height: 46px !important;

// ============================================================
// FLUSSO PRINCIPALE — determina lo stato e smista
// ============================================================
async function avviaFlusso(username) {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const mode = (urlParams.get('mode') || '').toLowerCase().trim();
        const modeDraft = mode === 'draft';

        // Sicurezza: solo il proprietario può vedere la bozza esplicita da edit
        if (modeDraft) {
            const loggedUser = localStorage.getItem('loggedUser');
            if (!loggedUser || loggedUser.toLowerCase() !== username.toLowerCase()) {
                window.location.href = `/profile.html?u=${username}`;
                return;
            }
        }

        const response = await fetch(`/api/get-profile?u=${username}`);
        const data = await response.json();
        if (!data.success || !data.fields) {
            // Profilo non trovato → showroom (tag libera, acquistabile)
            mostraShowroom(username);
            return;
        }

        let fields = data.fields;
        const stato = (fields.stato || "").toLowerCase().trim();
        
        const loggedUser = localStorage.getItem('loggedUser');
        const isOwner = loggedUser && loggedUser.toLowerCase() === username.toLowerCase();

        // 🎯 FIX: Se siamo in modalità anteprima (draft, new, o public dal profilo), carichiamo i dati da draft_json
        if ((modeDraft || mode === 'new' || mode === 'public' || isOwner) && fields.draft_json) {
            try {
                const bozza = JSON.parse(fields.draft_json);
                fields = { ...bozza, username_system: fields.username_system, stato: fields.stato, draft_json: fields.draft_json };
            } catch (e) {
                console.error("Errore parsing draft_json:", e);
            }
        }

        // Salviamo tutto in cache per gli altri blocchi
        cacheDatiUtente = fields;
        usernameCorrente = fields.username_system;

        // --- SMISTAMENTO DEI STATI ---
        if (stato === "attivo") {
            // Stato 1: tag attiva e pagata → rendering completo pulito pubblico
            renderizzaTagCompleta(fields);

      } else if (stato === "in attesa") {
            // 🎯 FIX: Sblocchiamo la visione se la richiesta arriva con mode=public dal pannello
            if (mode === 'new' || mode === 'draft' || mode === 'public' || isOwner) {
                // Utente che vede anteprima → rendering + overlay acquisto dedicato
                renderizzaTagCompleta(fields);
                mostraOverlayAcquisto();
            } else {
                // Chiunque altro scansiona il QR prima del pagamento → messaggio neutro
                mostraErrore("Questa tag non è ancora disponibile.");
            }
        } else {
            // Stato 3: showroom
            mostraShowroom(username);
        }

    } catch (err) {
        console.error("Errore critico avviaFlusso:", err);
        mostraErrore("Errore di connessione. Riprova tra qualche istante.");
    }
}

       function scaricaVCF(vcf, fields) {
    const nome = vcf.nome || fields.username_display || fields.username_system || '';
    const tel1 = vcf.telefono1 || '';
    const tel2 = vcf.telefono2 || '';
    const email1 = vcf.email1 || fields.email || '';
    const email2 = vcf.email2 || '';
    const sito = vcf.sito || fields.sito_web || '';
    const indirizzo = vcf.indirizzo || '';
    const piva = vcf.piva || '';

    const vcfContent = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN:${nome}`,
        tel1 ? `TEL;TYPE=CELL:${tel1}` : '',
        tel2 ? `TEL;TYPE=WORK:${tel2}` : '',
        email1 ? `EMAIL;TYPE=WORK:${email1}` : '',
        email2 ? `EMAIL;TYPE=HOME:${email2}` : '',
        sito ? `URL:${sito}` : '',
        indirizzo ? `ADR:;;${indirizzo};;;;` : '',
        piva ? `NOTE:P.IVA ${piva}` : '',
        'END:VCARD'
    ].filter(Boolean).join('\n');

    const blob = new Blob([vcfContent], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${nome || 'contatto'}.vcf`;
    a.click();
    URL.revokeObjectURL(url);
}
function renderizzaSocial(configCanali) {
    const container = document.getElementById("casella-social");
    if (!container) return;

    // Se non ci sono canali, nascondi la casella
    if (!configCanali || configCanali.trim() === "") {
        container.style.display = 'none';
        return;
    }

    try {
      const canali = JSON.parse(configCanali);

        if (!canali || !Array.isArray(canali) || canali.length === 0) {
            container.style.display = 'none';
            return;
        } 

        // Svuota il contenuto precedente
        container.innerHTML = "";

        canali.forEach(canale => {
            const nomeLower = canale.nome.toLowerCase();
            const iconClass = socialIcons[nomeLower] || socialIcons["default"];

            const btn = document.createElement("a");
            btn.className = "btn-social";
            btn.href = canale.url;
            btn.target = "_blank";
            btn.rel = "noopener noreferrer";
            btn.style.cssText = "text-decoration:none; color:inherit; display:flex; align-items:center; gap:8px;";
            btn.innerHTML = `<i class="${iconClass}"></i> ${canale.nome}`;

            // Condivisione singolo social (tasto lungo)
            btn.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                _condividi(canale.nome, canale.url);
            });

            container.appendChild(btn);
        });

        container.style.display = 'grid';

   } catch (e) {
        console.error("Errore parsing config_canali:", e);
        container.style.display = 'none';
        return;
    }
}

// HELPER CONDIVISIONE UNIVERSALE
// Web Share API su mobile, clipboard su desktop
// ============================================================
function _condividi(titolo, url) {
    if (navigator.share) {
        navigator.share({
            title: titolo,
            url: url
        }).catch(err => {
            // L'utente ha annullato — non è un errore reale
            if (err.name !== 'AbortError') console.error("Errore condivisione:", err);
        });
    } else {
        // Fallback desktop: copia negli appunti
        navigator.clipboard.writeText(url)
            .then(() => mostraToast('🔗 Link copiato!'))
            .catch(() => mostraToast('Errore nella copia del link'));
    }
}

    const toast = document.getElementById('toastNotifica');

    setTimeout(() => toast.classList.remove('mostra'), 2800);
}

// --- VARIABILE GLOBALE per l'evento di installazione ---
let pwaInstallEvent = null;

// ============================================================
// INTERCETTA L'EVENTO DI INSTALLAZIONE
// Il browser lo lancia quando la PWA è installabile
// ============================================================
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); // Blocca il banner automatico del browser
    pwaInstallEvent = e; // Lo salviamo per usarlo quando vogliamo noi

    // Mostra il bottone di installazione se presente nella pagina
    const btnInstall = document.getElementById('trigger-pwa-install');
    if (btnInstall) btnInstall.style.display = 'block';
});

// ============================================================
// INSTALLAZIONE PWA — chiamata dal bottone nel welcome overlay
// ============================================================
async function installaPWA() {
    // iOS — nessun beforeinstallprompt, mostra istruzioni manuali
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS) {
        mostraIstruzioniIOS();
        return;
    }

    // Android/Chrome — evento disponibile
    if (pwaInstallEvent) {
        try {
            pwaInstallEvent.prompt();
            const { outcome } = await pwaInstallEvent.userChoice;
            if (outcome === 'accepted') {
                pwaInstallEvent = null;
                chiudiWelcomeEMostraTag();
            } else {
                mostraToast('Installazione annullata');
            }
        } catch (err) {
            console.error("Errore installazione PWA:", err);
            mostraToast('Errore durante l\'installazione');
        }
        return;
    }
    // Android ma evento non disponibile — app già installata o browser non supportato
    mostraToast('Apri dal browser Chrome per installare');
}
