<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attiva la tua Tag | MyQuickTag</title>
    <style>
        :root { --smeraldo: #00C896; --dark: #1a1a1a; }
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; background: #f9f9f9; color: var(--dark); display: flex; justify-content: center; }
        .container { max-width: 400px; width: 100%; padding: 20px; text-align: center; }
        
        /* iPhone Mockup */
        .iphone-x {
            position: relative; width: 280px; height: 560px; margin: 20px auto;
            border: 12px solid #222; border-radius: 40px; background: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); overflow: hidden;
        }
        .iphone-notch {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 150px; height: 25px; background: #222; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 10;
        }

        /* Screen Content */
        .screen { padding: 40px 20px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; }
        .user-badge { font-size: 24px; font-weight: 800; color: var(--smeraldo); margin-bottom: 10px; }
        .placeholder-box { 
            background: #f0f0f0; border-radius: 12px; padding: 15px; 
            text-align: left; font-size: 14px; color: #888; border: 1px dashed #ccc;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* Form */
        .input-group { margin-top: 20px; }
        input[type="email"] {
            width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #eee;
            margin-bottom: 10px; box-sizing: border-box; font-size: 16px;
        }
        input:focus { border-color: var(--smeraldo); outline: none; }
        
        .buy-btn {
            width: 100%; padding: 18px; background: var(--smeraldo); color: white;
            border: none; border-radius: 12px; font-size: 18px; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
        }
        .buy-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,200,150,0.3); }

        /* Success State */
        #success-ui { display: none; padding-top: 50px; }
        .checkmark { font-size: 80px; color: var(--smeraldo); display: block; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container" id="main-ui">
    <h1 style="font-size: 22px;">La tua Tag è pronta.</h1>
    <p style="color: #666;">Guarda l'anteprima sul tuo futuro profilo:</p>

    <div class="iphone-x">
        <div class="iphone-notch"></div>
        <div class="screen">
            <div class="user-badge" id="previewName">@nome</div>
            <div class="placeholder-box">📝 Bio (clicca per aggiungere)</div>
            <div class="placeholder-box">📄 Il tuo CV (PDF/Link)</div>
            <div class="placeholder-box">📸 Instagram / TikTok</div>
            <div style="margin-top: auto; font-size: 10px; color: #bbb;">Powered by MyQuickTag</div>
        </div>
    </div>

    <div class="input-group">
        <input type="email" id="userEmail" placeholder="Inserisci la tua email" required>
        <button class="buy-btn" id="actionBtn" onclick="attivaOra()">ATTIVA ADESSO</button>
    </div>
</div>

<div class="container" id="success-ui">
    <span class="checkmark">✓</span>
    <h2>Tag Prenotata!</h2>
    <p>Abbiamo inviato i dettagli a <br><strong id="displayEmail"></strong></p>
    <p style="font-size: 14px; color: #666;">Ti stiamo reindirizzando al pannello di modifica...</p>
</div>

<script>
    // 1. Dati dinamici
    const params = new URLSearchParams(window.location.search);
    const username = params.get("name") || "utente";
    document.getElementById("previewName").innerText = "@" + username;

    // 2. Credenziali Airtable (Tienile tu Gemini)
    const AIRTABLE_TOKEN = 'pat7XmPCH9o7vNf1i.7f89d5321...'; 
    const BASE_ID = 'appLqZ8j4W7kP3...';
    const TABLE_NAME = 'Leads';

    async function attivaOra() {
        const email = document.getElementById("userEmail").value;
        const btn = document.getElementById("actionBtn");

        if(!email.includes("@")) { alert("Inserisci una email valida"); return; }

        btn.innerText = "SINCRO...";
        btn.disabled = true;

        try {
            await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    "fields": {
                        "Tag": "@" + username,
                        "Email": email,
                        "Stato": "Attivo",
                        "Data": new Date().toISOString()
                    }
                })
            });

            // Transizione UI
            document.getElementById("main-ui").style.display = "none";
            document.getElementById("displayEmail").innerText = email;
            document.getElementById("success-ui").style.display = "block";

            // Reindirizzamento simulato dopo 3 secondi
            setTimeout(() => {
                window.location.href = "https://myquicktag.vercel.app/dashboard?user=" + username;
            }, 3000);

        } catch (e) {
            alert("Errore di connessione. Riprova.");
            btn.innerText = "ATTIVA ADESSO";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
