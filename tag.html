<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyQuickTag - Prenota il tuo Tag</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: white; margin: 0; }
    
    .draw-path {
      stroke-dasharray: 400; stroke-dashoffset: 400;
      animation: draw 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 28px;
    }

    .premium-input {
      background: #121212;
      border: 2px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    .premium-input:focus {
      border-color: #10b981;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }

    .btn-claim {
      background: #10b981;
      color: #000;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      animation: pulseGreen 2s infinite;
    }
    @keyframes pulseGreen {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-6 pb-16 px-6">

  <header class="w-full flex flex-col items-center mb-8">
    <a href="index.html" class="flex flex-col items-center">
      <svg width="40" height="40" viewBox="0 0 100 100" fill="none" class="drop-shadow-[0_0_10px_rgba(16,185,129,0.4)]">
        <path class="draw-path" d="M80 50C80 66.5685 66.5685 80 50 80C33.4315 80 20 66.5685 20 50C20 33.4315 33.4315 20 50 20C60.5 20 69.5 25.5 74.5 34" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
        <path class="draw-path" d="M60 60L85 85" stroke="#10b981" stroke-width="8" stroke-linecap="round" style="animation-delay: 0.5s;"/>
        <text x="50" y="56" text-anchor="middle" font-family="Arial" font-weight="900" font-size="28" fill="#10b981" opacity="0" style="animation: fadeIn 0.8s ease forwards 1s;">@</text>
      </svg>
      <h2 class="text-[10px] font-black tracking-[0.5em] text-white/50 uppercase italic mt-2">MyQuickTag</h2>
    </a>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center max-w-md mx-auto w-full">
    
    <div class="inline-flex items-center bg-emerald-500/10 text-emerald-400 rounded-full px-4 py-1 text-[10px] font-black tracking-widest uppercase mb-4 border border-emerald-500/20">
      <i class="fas fa-check-circle mr-2"></i> Disponibile
    </div>

    <h1 id="displayName" class="text-5xl font-black italic uppercase tracking-tighter text-white mb-8">
      @NOME
    </h1>

    <div class="w-full glass-card p-8 space-y-6">
      <p class="text-zinc-400 text-center text-sm font-medium">Associa la tua email per attivare la tua identità digitale.</p>
      
      <div class="space-y-4">
        <input id="userEmail" type="email" placeholder="LA TUA EMAIL" 
               class="w-full premium-input rounded-2xl px-6 py-4 text-white outline-none font-bold uppercase text-sm">
        
        <button onclick="claimName()" class="w-full btn-claim py-5 rounded-2xl text-lg shadow-xl active:scale-95 transition-transform">
          Attiva Gratis
        </button>
      </div>

      <p class="text-[9px] text-zinc-600 text-center uppercase tracking-widest leading-relaxed">
        Nessun costo nascosto.<br>Il tuo nome rimarrà riservato per te.
      </p>
    </div>
  </main>

  <footer class="mt-8">
    <a href="index.html" class="text-zinc-500 text-[10px] uppercase tracking-widest font-bold hover:text-white transition-colors">
      ← Torna alla ricerca
    </a>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let nome = urlParams.get('nome')?.toLowerCase().trim() || '';
    
    // Airtable Config
    const AIRTABLE_PAT = "patWfr8e2nM0vvhtR.69b3beff785c42c9d59a6d1f898023a16ce907f43e22716d94b497eef8dec54c";
    const BASE_ID = "appG2S8jV9Ams3wYq";
    const TABLE_NAME = "Tabella 1";

    if(nome) {
      document.getElementById('displayName').innerText = '@' + nome.toUpperCase();
    }

    async function claimName() {
      const email = document.getElementById('userEmail').value.trim();
      if(!email || !email.includes('@')) { 
        alert("Inserisci una email valida!"); 
        return; 
      }

      const btn = document.querySelector('.btn-claim');
      btn.innerText = "REGISTRAZIONE...";
      btn.disabled = true;

      try {
        const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${AIRTABLE_PAT}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            fields: { "nome": nome, "email": email }
          })
        });

        if(response.ok) {
          window.location.href = `edit.html?nome=${nome}&status=success`;
        } else {
          alert("Errore durante la registrazione. Riprova.");
          btn.innerText = "ATTIVA GRATIS";
          btn.disabled = false;
        }
      } catch (e) {
        alert("Errore di connessione.");
        btn.innerText = "ATTIVA GRATIS";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
