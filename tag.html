<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>La tua Tag | MyQuickTag</title>

<style>
    body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #222;
    }

    .container {
        max-width: 480px;
        margin: 0 auto;
        padding: 20px;
        text-align: center;
    }

    .title {
        font-size: 26px;
        font-weight: 700;
        color: #00C896;
        margin-bottom: 20px;
    }

    .preview-box {
        width: 100%;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 8px 28px rgba(0,0,0,0.18);
        border: 2px solid #00C896;
        background: #ffffff;
        margin-bottom: 25px;
    }

    .preview-header {
        background: #f7f7f7;
        padding: 18px;
        font-size: 18px;
        font-weight: 600;
        color: #00C896;
    }

    .preview-area {
        padding: 22px;
    }

    .preview-inner {
        width: 100%;
        height: 420px;
        border-radius: 20px;
        background: linear-gradient(145deg, #ffffff, #e8e8e8);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 500;
        color: #333;
        border: 1px solid #ddd;
    }

    .description {
        padding: 16px;
        font-size: 15px;
        color: #555;
        line-height: 1.5;
    }

    .buy-btn {
        display: block;
        width: 100%;
        padding: 16px;
        background: #00C896;
        color: white;
        font-size: 18px;
        font-weight: 600;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        margin-top: 20px;
        transition: transform 0.2s, background 0.3s;
    }

    .buy-btn:hover {
        transform: scale(1.02);
        background: #00b386;
    }
</style>

</head>
<body>

<div class="container">

    <div class="title" id="dynamicName">@nome</div>

    <div class="preview-box">
        <div class="preview-header">Il tuo @nome prende vita</div>

        <div class="preview-area">
            <div class="preview-inner" id="previewName">
                @nome
            </div>
        </div>

        <div class="description">
            Questa è l’anteprima della tua tag personale.<br><br>
            Quando premi “Ok, lo compro”, stai acquistando:
            <br><br>
            • Il tuo @nome unico<br>
            • La tua pagina personale<br>
            • La possibilità di modificarla quando vuoi<br>
            • La pubblicazione online del tuo profilo
        </div>
    </div>

    <button class="buy-btn" id="mainButton" onclick="confermaAcquisto()">Ok, lo compro</button>

</div>

<script>
    // 1. GESTIONE NOME DINAMICO
    const params = new URLSearchParams(window.location.search);
    const username = params.get("name") || "utente";
    
    document.getElementById("dynamicName").innerText = "@" + username;
    document.getElementById("previewName").innerText = "@" + username;

    // 2. MOTORE AIRTABLE (CHIAVI INSERITE)
    const AIRTABLE_TOKEN = 'pat7XmPCH9o7vNf1i.7f89d5321...'; // Il tuo Token salvato
    const BASE_ID = 'appLqZ8j4W7kP3...'; // Il tuo Base ID salvato
    const TABLE_NAME = 'Leads';

    async function confermaAcquisto() {
        const btn = document.getElementById("mainButton");
        btn.innerText = "REGISTRAZIONE...";
        btn.disabled = true;

        try {
            const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    "fields": {
                        "Tag": "@" + username,
                        "Data": new Date().toISOString(),
                        "Stato": "Prenotato",
                        "Colore": "Verde Smeraldo"
                    }
                })
            });

            if (response.ok) {
                btn.innerText = "CONFERMATO! ✓";
                btn.style.background = "#2ecc71";
                alert("Ottimo lavoro Socio! Tag prenotata. Adesso sei pronto per il milione.");
            } else {
                throw new Error("Errore durante il salvataggio");
            }
        } catch (error) {
            console.error(error);
            btn.innerText = "ERRORE - RIPROVA";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
