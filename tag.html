<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MyQuickTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link id="dynamic-manifest" rel="manifest" href="">
    <link id="dynamic-icon" rel="icon" href="">

    <style>
        :root {
            --bg-color: #0A0A0A;
            --text-main: #ffffff;
            --text-sec: #8E8E93;
            
            /* Default Tema: BLACK DNA */
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.15);
            --card-glow: rgba(255, 255, 255, 0.05);
            --btn-bg: rgba(255, 255, 255, 0.04);
            --btn-border: rgba(255, 255, 255, 0.06);
            --btn-text: #FFFFFF;
        }

        /* --- CONFIGURAZIONE VARIABILI PER STILI D'ÉLITE --- */
        body.style-black-dna {
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.5);
            --card-glow: rgba(255, 255, 255, 0.15);
            --btn-bg: rgba(18, 18, 18, 0.6);
            --btn-border: rgba(255, 255, 255, 0.06);
            --btn-text: #FFFFFF;
        }

        body.style-titanium {
            --card-bg: rgba(30, 30, 35, 0.4);
            --card-border: rgba(180, 185, 190, 0.4);
            --card-glow: rgba(140, 150, 160, 0.1);
            --btn-bg: linear-gradient(145deg, rgba(28, 28, 32, 0.8), rgba(20, 20, 23, 0.8));
            --btn-border: rgba(255, 255, 255, 0.08);
            --btn-text: #F2F2F7;
        }

        body.style-obsidian-gold {
            --card-bg: rgba(20, 18, 15, 0.6);
            --card-border: rgba(197, 160, 89, 0.4);
            --card-glow: rgba(197, 160, 89, 0.15);
            --btn-bg: rgba(18, 16, 14, 0.7);
            --btn-border: rgba(197, 160, 89, 0.12);
            --btn-text: #FFFFFF;
        }
        
        body {
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            margin: 0; 
            padding: 24px 16px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex; 
            flex-direction: column; 
            align-items: center;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .profile-container {
            display: none; 
            opacity: 0; 
            transform: scale(0.98); 
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%; 
            max-width: 420px; 
            margin: 0 auto; 
            box-sizing: border-box;
        }

        /* --- TAVOLETTA DI VETRO ADATTIVA (HUGS THE CONTENT) --- */
        .tag-identity-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 30px auto 15px auto;
            width: fit-content;
            min-width: 200px;
            max-width: 100%;
            
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--card-border);
            box-shadow: 0 0 30px var(--card-glow), inset 0 0 15px rgba(255, 255, 255, 0.02);
            
            border-radius: 24px;
            padding: 24px 36px;
            box-sizing: border-box;
        }

        .username-display {
            font-size: 1.35rem;
            font-weight: 700;
            margin: 0;
            color: #FFFFFF;
            text-align: center;
            word-break: break-all;
            letter-spacing: -0.5px;
        }

        /* --- LOGICA BIO MINIMALE ESTERNA --- */
        .tag-bio-text {
            font-size: 0.9rem;
            color: var(--text-sec);
            max-width: 280px;
            margin: 0 auto 35px auto;
            line-height: 1.5;
            text-align: center;
            font-weight: 400;
        }

        /* --- GRID SYSTEM ADATTIVO LUXURY --- */
        .links-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            box-sizing: border-box;
        }

        /* Se c'è solo un link o spazio ridotto, si espande elegantemente */
        @media (max-width: 360px) {
            .links-container {
                grid-template-columns: 1fr;
            }
        }

        .link-box {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--btn-text);
            box-sizing: border-box;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease;
        }

        .link-box i {
            font-size: 1.15rem;
            width: 20px;
            text-align: center;
            color: #FFFFFF;
        }

        body.style-obsidian-gold .link-box i {
            color: #c5a059;
        }

        .link-box:active { 
            transform: scale(0.97); 
            background: rgba(255,255,255,0.08);
        }

        #back-to-config {
            color: #FFFFFF !important;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            align-self: flex-start;
            margin-bottom: 10px;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }
        #back-to-config:hover { opacity: 1; }

        /* --- INTERFACCIA COPERTURA SHOWROOM (STATO IN ATTESA) --- */
        .showroom-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 4, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 40px;
            z-index: 999;
            box-sizing: border-box;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .expanding-box {
            background: #111111;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            width: 90%;
            max-width: 360px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .conversion-content {
            opacity: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 24px;
            width: 100%;
            box-sizing: border-box;
            transition: opacity 0.4s ease;
        }

        .conversion-content h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin: 0 0 20px 0;
            color: #FFFFFF;
        }

        .rendilo-tuo-btn, .sblocco-btn {
            background: #FFFFFF;
            color: #000000;
            border: none;
            padding: 14px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.15s ease;
        }
        .rendilo-tuo-btn:active { transform: scale(0.98); }

        /* --- MODALE INTRO PWA WELCOME --- */
        .tag-welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 6, 6, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .tag-welcome-card {
            background: #121214;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 32px 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            box-sizing: border-box;
            transform: scale(0.95);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tag-success-icon {
            font-size: 2.5rem;
            color: #10B981;
            margin-bottom: 16px;
        }

        .tag-welcome-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0 0 10px 0;
        }

        .tag-welcome-text {
            font-size: 0.88rem;
            color: var(--text-sec);
            line-height: 1.5;
            margin: 0 0 24px 0;
        }

        .tag-welcome-btn {
            background: #10B981;
            color: #FFFFFF;
            border: none;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tag-skip-btn {
            background: transparent;
            color: var(--text-sec);
            border: none;
            padding: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <a href="#" id="back-to-config" style="display: none;">
        <i class="fas fa-arrow-left"></i> Configurazione
    </a>

    <div id="profile-content" class="profile-container">
        <header class="tag-identity-card" id="identity-card">
            <h1 class="username-display" id="tag-username">@tuonome</h1>
        </header>

        <div id="tag-bio" class="tag-bio-text"></div>

        <div class="links-container" id="links-container"></div>
        
        <div id="cta-sblocco-container" style="display: none; margin-top: 40px; width: 100%;">
            <button class="sblocco-btn" onclick="vaiAlCheckout()">
                <i class="fas fa-unlock-alt"></i> Sblocca la tua MyQuickTag
            </button>
        </div>
    </div>

    <div id="showroom-overlay" class="showroom-overlay">
        <div id="expanding-box" class="expanding-box"> 
            <div class="conversion-content">
                <h2 id="conversion-title">Nessun altro potrà essere @...</h2>
                <button class="rendilo-tuo-btn" id="showroom-action-btn">Attiva la tua myquicktag</button>
            </div>
        </div>
    </div>

    <div id="tag-welcome-overlay" class="tag-welcome-overlay">
        <div class="tag-welcome-card">
            <div class="tag-success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 class="tag-welcome-title">Tag Attivata</h2>
            <p class="tag-welcome-text">
                La tua MyQuickTag è ora operativa. Aggiungila alla schermata Home per gestirla istantaneamente.
            </p>
            
            <button class="tag-welcome-btn" id="trigger-pwa-install">
                <i class="fas fa-download"></i> Aggiungi alla Home
            </button>
            
            <button class="tag-skip-btn" onclick="chiudiWelcomeEMostraTag()">
                Visualizza la Tag
            </button>
        </div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    let nomeUtenteURL = params.get("u") || ""; 
    if (!nomeUtenteURL) {
        const pathParts = window.location.pathname.split('/');
        const uIndex = pathParts.indexOf('u');
        if (uIndex !== -1 && pathParts[uIndex + 1]) nomeUtenteURL = pathParts[uIndex + 1];
    }

    let globalUtente = "";
    let deferredPrompt;
    let identitaVerificata = false;

    if (nomeUtenteURL) {
        globalUtente = nomeUtenteURL.replace('@', '').trim().toLowerCase();
        document.getElementById("dynamic-manifest").href = `/api/manifest?u=${globalUtente}`;
        document.getElementById("dynamic-icon").href = `/api/icon?u=${globalUtente}`;
        caricaProfiloPubblico(globalUtente);
    }

    function vaiAlCheckout() {
        if (!globalUtente) return;
        window.location.href = `/checkout.html?u=${globalUtente}`;
    }

    async function caricaProfiloPubblico(nomeMinuto) {
        try {
            const response = await fetch(`/api/get-profile?u=${nomeMinuto}`);
            const data = await response.json();
            
            if (data.success && data.fields) {
                const record = data.fields;
                const usernamePulito = (record.username_display || nomeMinuto).replace('@', '').toUpperCase();
                
                const usernameEl = document.getElementById("tag-username");
                if (usernameEl) {
                    usernameEl.innerText = "@" + usernamePulito;
                }
                
                // Gestione Bio Esterna Dinamica
                const bioEl = document.getElementById("tag-bio");
                if (bioEl && record.bio && record.bio.trim() !== "") {
                    bioEl.innerText = record.bio.trim();
                    bioEl.style.display = "block";
                } else if (bioEl) {
                    bioEl.style.display = "none";
                }
               
                document.getElementById("profile-content").style.display = "block";

                // --- 1. CONFIGURAZIONE DINAMICA DELLO STILE D'ÉLITE ---
                if (record.digital_style) {
                    document.body.className = `style-${record.digital_style.toLowerCase().trim()}`;
                } else {
                    document.body.className = 'style-black-dna';
                }

                // --- 2. GENERAZIONE STRUTTURATA DEI PULSANTI (GEOMETRIA LUXURY) ---
                const linksContainer = document.getElementById("links-container");
                linksContainer.innerHTML = ""; 

                const mappingCanali = {
                    email: { icon: "fas fa-envelope", label: "Email", url: val => val.startsWith("mailto:") ? val : `mailto:${val}` },
                    phone: { icon: "fas fa-phone", label: "Telefono", url: val => val.startsWith("tel:") ? val : `tel:${val}` },
                    whatsapp: { icon: "fab fa-whatsapp", label: "WhatsApp", url: val => val.startsWith("http") ? val : `https://wa.me/${val.replace(/\s+/g, '')}` },
                    instagram: { icon: "fab fa-instagram", label: "Instagram", url: val => val.startsWith("http") ? val : `https://instagram.com/${val.replace('@', '')}` },
                    tiktok: { icon: "fab fa-tiktok", label: "TikTok", url: val => val.startsWith("http") ? val : `https://tiktok.com/@${val.replace('@', '')}` },
                    facebook: { icon: "fab fa-facebook-f", label: "Facebook", url: val => val.startsWith("http") ? val : val },
                    linkedin: { icon: "fab fa-linkedin-in", label: "LinkedIn", url: val => val.startsWith("http") ? val : val },
                    youtube: { icon: "fab fa-youtube", label: "YouTube", url: val => val.startsWith("http") ? val : val },
                    x: { icon: "fab fa-x-twitter", label: "X", url: val => val.startsWith("http") ? val : `https://x.com/${val.replace('@', '')}` },
                    telegram: { icon: "fab fa-telegram-plane", label: "Telegram", url: val => val.startsWith("http") ? val : `https://t.me/${val.replace('@', '')}` },
                    reddit: { icon: "fab fa-reddit-alien", label: "Reddit", url: val => val.startsWith("http") ? val : `https://reddit.com/user/${val}` },
                    sito_web: { icon: "fas fa-globe", label: "Sito Web", url: val => val.startsWith("http") ? val : `https://${val}` },
                    cv: { icon: "fas fa-file-pdf", label: "Curriculum Vitae", url: val => val }
                };

                if (record.config_canali) {
                    try {
                        const canaliObj = typeof record.config_canali === 'string' 
                            ? JSON.parse(record.config_canali) 
                            : record.config_canali;

                        Object.keys(mappingCanali).forEach(chiave => {
                            const valoreRaw = canaliObj[chiave];
                            if (valoreRaw && valoreRaw.trim() !== "") {
                                const info = mappingCanali[chiave];
                                const linkCompleto = info.url(valoreRaw.trim());

                                const linkElement = document.createElement('a');
                                linkElement.href = linkCompleto;
                                linkElement.className = 'link-box';
                                linkElement.target = '_blank';
                                linkElement.rel = 'noopener noreferrer';
                                linkElement.innerHTML = `
                                    <i class="${info.icon}"></i>
                                    <span>${info.label}</span>
                                `;
                                linksContainer.appendChild(linkElement);
                            }
                        });
                    } catch (jsonError) {
                        console.error("Errore decodifica config_canali:", jsonError);
                    }
                }

                const backLink = document.getElementById("back-to-config");
                if (backLink) {
                    backLink.href = `profile.html?u=${nomeMinuto}`;
                }

                const stato = (record.stato || "").toLowerCase().trim();

                if (stato === "in attesa") {
                    identitaVerificata = false;
                    if (backLink) backLink.style.display = "flex";
                    document.getElementById("cta-sblocco-container").style.display = "none";
                    
                    const profile = document.getElementById("profile-content");
                    if (profile) {
                        profile.style.display = "block";
                        setTimeout(() => { profile.style.opacity = "1"; profile.style.transform = "scale(1)"; }, 50);
                    }
                    
                    document.getElementById("conversion-title").innerText = `Nessun altro potrà essere @${usernamePulito}`;
                    
                    const btnRendiloTuo = document.getElementById("showroom-action-btn");
                    if (btnRendiloTuo) {
                        btnRendiloTuo.onclick = vaiAlCheckout;
                    }
                    
                    document.body.style.opacity = "1";
                    
                    // Trigger Animazione Showroom Protetto
                    setTimeout(() => {
                        const overlay = document.getElementById("showroom-overlay");
                        const box = document.getElementById("expanding-box"); 
                        const content = document.querySelector(".conversion-content");
                        
                        if (overlay && box && content) {
                            overlay.style.display = "flex";
                            
                            setTimeout(() => {
                                overlay.style.background = "rgba(4, 4, 4, 0.4)"; 
                                box.style.width = "340px";  
                                box.style.height = "180px"; 
                                
                                setTimeout(() => {
                                    content.style.opacity = "1";
                                }, 250);
                            }, 50);
                        }
                    }, 2500);

                } else if (stato === "attivo") {
                    identitaVerificata = true;
                    if (backLink) backLink.style.display = "none";
                    document.getElementById("cta-sblocco-container").style.display = "none";

                    if (document.getElementById("showroom-overlay")) {
                        document.getElementById("showroom-overlay").style.display = "none";
                    }
                    
                    const profile = document.getElementById("profile-content");
                    if (profile) {
                        profile.style.display = "block";
                        profile.style.opacity = "1";
                        profile.style.transform = "scale(1)";
                    }
                    document.body.style.opacity = "1";
                    
                    // Innesca il Welcome solo al ritorno dal checkout
                    if (params.get('checkout') === 'success') {
                        mostraInstallatorePremium();
                    }
                }
            } else {
                document.body.style.opacity = "1";
            }
        } catch (error) {
            console.error("Errore di caricamento:", error);
            document.body.style.opacity = "1";
        }
    } 

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (identitaVerificata) {
            mostraInstallatorePremium();
        }
    });

    function mostraInstallatorePremium() {
        if (localStorage.getItem('welcome_overlay_chiuso') === 'true') return;
        if (!deferredPrompt || !identitaVerificata) return;
        
        const overlay = document.getElementById("tag-welcome-overlay");
        if (overlay) {
            overlay.style.display = "flex";
            setTimeout(() => {
                const card = document.querySelector(".tag-welcome-card");
                if (card) card.style.transform = "scale(1)";
            }, 50);
        }

        const btnInstall = document.getElementById("trigger-pwa-install");
        if (btnInstall) {
            btnInstall.onclick = () => {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        chiudiWelcomeEMostraTag();
                    }
                    deferredPrompt = null;
                });
            };
        }
    }

    function chiudiWelcomeEMostraTag() {
        localStorage.setItem('welcome_overlay_chiuso', 'true');
        const overlay = document.getElementById("tag-welcome-overlay");
        if (overlay) {
            overlay.style.opacity = "0";
            setTimeout(() => { overlay.style.display = "none"; }, 500);
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        const backLink = document.getElementById("back-to-config");
        if (backLink) {
            backLink.addEventListener("click", function(e) {
                e.preventDefault();
                const targetUrl = this.href;
                setTimeout(() => { window.location.href = targetUrl; }, 200);
            });
        }
    });
    </script>
</body>
</html>
