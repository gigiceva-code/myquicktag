                    <!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MyQuickTag Identity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link id="dynamic-manifest" rel="manifest" href="">
    <link id="dynamic-icon" rel="icon" href="">

    <style>
        /* Effetto accensione showroom */
        body {
            opacity: 0;
            transition: opacity 0.6s ease-out; /* 0.6 secondi di pura dissolvenza fluida */
        }
        :root {
            --bg-color: #000000;
            --accent-smeraldo: #50C878;
            --text-main: #ffffff;
            --text-sec: #6c6c70;
        }
        
        body {
            margin: 0; padding: 24px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .profile-header {
            margin-top: 40px;
            display: flex; flex-direction: column; align-items: center;
            width: 100%;
        }

        .username {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .bio {
            font-size: 1rem;
            color: var(--text-sec);
            margin-top: 10px;
            max-width: 320px;
            line-height: 1.5;
        }

        .links-container {
            margin-top: 40px;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Bottone PWA dinamico */
        .pwa-btn {
            background: var(--accent-smeraldo);
            color: #000; border: none; padding: 18px; border-radius: 14px;
            font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        /* Stile per la freccia torna alla configurazione */
        .back-link-top {
            align-self: flex-start;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .back-link-top:active {
            opacity: 1;
            transform: scale(0.97);
        }

        /* Bottone di Sblocco nello Showroom */
        .sblocco-btn {
            background: #ffffff; color: #000000;
            border: none; padding: 18px; border-radius: 14px;
            font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 10px 25px rgba(255,255,255,0.1);
        }
        
        /* Effetti di pressione ammortizzati senza scatti */
        .sblocco-btn {
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s !important;
            -webkit-tap-highlight-color: transparent;
        }
        .sblocco-btn:active {
            transform: scale(0.98) !important;
            opacity: 0.9;
        }
        
        /* Sfondo completamente trasparente e interazioni libere */
        .showroom-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0); /* Zero oscuramento: massima trasparenza */
            backdrop-filter: blur(0px); /* Zero sfocatura sul profilo */
            -webkit-backdrop-filter: blur(0px);
            z-index: 900;
            display: none; 
            justify-content: center;
            align-items: center;
            pointer-events: none; /* L'utente può ancora toccare e vedere il profilo sotto */
            transition: background-color 1.5s;
        } 

        /* Il rettangolo fluttuante che si espande in larghezza */
        .expanding-box {
            width: 0px;
            height: 0px;
            border-radius: 12px; /* Angoli leggermente smussati, elegantissimo */
            background: rgba(255, 255, 255, 0.02); /* Trasparenza cristallina */
            border: 1px solid rgba(255, 255, 255, 0.3); /* Bordo bianco luminoso e nitido */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            pointer-events: auto;
            /* Transizione fluida su larghezza e altezza */
            transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1), height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        } 

        .conversion-content {
            opacity: 0;
            transition: opacity 0.4s ease-out;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .conversion-content h2 {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            line-height: 1.4;
            margin-bottom: 30px;
            color: #ffffff;
        }

        /* Il bottone premium in vetro satinato trasparente */
        .rendilo-tuo-btn {
            background: rgba(255, 255, 255, 0.07); /* Trasparenza ghiaccio */
            color: #ffffff; /* Testo bianco puro e nitido */
            border: 1px solid rgba(255, 255, 255, 0.15); /* Bordino finissimo stile orologeria */
            padding: 16px 32px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            cursor: pointer;
            width: 100%;
            backdrop-filter: blur(10px); /* Un micro-vetro nel vetro */
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.3s, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        /* Effetto reattività premium quando viene toccato */
        .rendilo-tuo-btn:active {
            background: rgba(255, 255, 255, 0.15); /* Si illumina leggermente sotto il dito */
            transform: scale(0.97);
        }
      // 4. REINDIRIZZAMENTO FINALE ALLA TAG ORA ATTIVA (Corretto per tag.html)
function vaiAllaTag() {
    if (!targetUserClean) return;
    window.location.href = `/tag.html?u=${targetUserClean}`;
}
    </style>
</head>
<body>

    <a href="#" id="back-to-config" class="back-link-top" style="display: none;">
        <i class="fas fa-arrow-left"></i> Torna alla configurazione
    </a>

    <div id="profile-content" style="display: none; width: 100%; max-width: 350px;">
        
        <div class="profile-header">
            <h1 class="username" id="tag-username">@...</h1>
            <p class="bio" id="tag-bio">Caricamento identità...</p>
        </div>

        <div class="links-container" id="links-container"></div>
        
        <div id="cta-sblocco-container" style="display: none; margin-top: 40px; width: 100%;">
            <button class="sblocco-btn" onclick="vaiAlCheckout()">
                <i class="fas fa-unlock-alt"></i> Sblocca la tua MyQuickTag
            </button>
        </div>
        
    </div>

    <div id="showroom-overlay" class="showroom-overlay">
        <div id="expanding-box" class="expanding-box"> 
            <div class="conversion-content">
                <h2 id="conversion-title">Nessun altro potrà essere @...</h2>
                <button class="rendilo-tuo-btn" id="showroom-action-btn">Attiva la tua myquicktag</button>
            </div>
        </div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    let nomeUtenteURL = params.get("u") || ""; 
    if (!nomeUtenteURL) {
        const pathParts = window.location.pathname.split('/');
        const uIndex = pathParts.indexOf('u');
        if (uIndex !== -1 && pathParts[uIndex + 1]) nomeUtenteURL = pathParts[uIndex + 1];
    }

    let globalUtente = "";
    let deferredPrompt;
    let identitaVerificata = false;

    if (nomeUtenteURL) {
        globalUtente = nomeUtenteURL.replace('@', '').trim().toLowerCase();
        document.getElementById("dynamic-manifest").href = `/api/manifest?u=${globalUtente}`;
        document.getElementById("dynamic-icon").href = `/api/icon?u=${globalUtente}`;
        caricaProfiloPubblico(globalUtente);
    }

    // Indirizzamento formale alla pagina commerciale esterna protetta
    function vaiAlCheckout() {
        if (!globalUtente) return;
        window.location.href = `/checkout.html?u=${globalUtente}`;
    }
        
    async function caricaProfiloPubblico(nomeMinuto) {
        try {
            const response = await fetch(`/api/get-profile?u=${nomeMinuto}`);
            const data = await response.json();
            
            if (data.success && data.fields) {
                const record = data.fields;
                const usernamePulito = (record.username_display || nomeMinuto).replace('@', '').toUpperCase();
                
                document.getElementById("tag-username").innerText = "@" + usernamePulito;
                document.getElementById("tag-bio").innerText = record.bio || "";

                const backLink = document.getElementById("back-to-config");
                if (backLink) {
                    backLink.href = `profile.html?u=${nomeMinuto}`;
                }

                const stato = (record.stato || "").toLowerCase().trim();

                if (stato === "in attesa") {
                    identitaVerificata = false;
                    if (backLink) backLink.style.display = "flex";
                    
                    document.getElementById("cta-sblocco-container").style.display = "none";
                    document.getElementById("profile-content").style.display = "block";
                    
                    // Impostazione testi e link diretti sul modulo di vendita
                    document.getElementById("conversion-title").innerText = `Nessun altro potrà essere @${usernamePulito}`;
                    
                    const btnRendiloTuo = document.getElementById("showroom-action-btn");
                    if (btnRendiloTuo) {
                        btnRendiloTuo.innerText = "Attiva la tua myquicktag";
                        btnRendiloTuo.onclick = vaiAlCheckout;
                    }
                    
                    // Forza l'accensione dello schermo per mostrare il profilo sotto pulito e trasparente
                    document.body.style.opacity = "1";
                    
                    // PARTENZA ANIMAZIONE RETTANGOLO (Dopo 2.5 secondi)
                    setTimeout(() => {
                        const overlay = document.getElementById("showroom-overlay");
                        const box = document.getElementById("expanding-box"); 
                        const content = document.querySelector(".conversion-content");
                        
                        if (overlay && box && content) {
                            overlay.style.display = "flex";
                            
                            setTimeout(() => {
                                overlay.style.background = "rgba(0, 0, 0, 0)";
                                overlay.style.backdropFilter = "blur(0px)";
                                overlay.style.webkitBackdropFilter = "blur(0px)";
                                
                                // Il rettangolo luminoso d'élite si spalanca
                                box.style.width = "340px";  
                                box.style.height = "210px"; 
                                
                                // Appena aperto, mostra fluidamente la frase e il tasto in vetro al suo interno
                                setTimeout(() => {
                                    content.style.opacity = "1";
                                }, 300);
                            }, 50);
                        }
                    }, 2500);
                    
                } else if (stato === "attivo") {
                    identitaVerificata = true;
                    if (backLink) backLink.style.display = "none";
                    document.getElementById("cta-sblocco-container").style.display = "none";
                    if (document.getElementById("showroom-overlay")) {
                        document.getElementById("showroom-overlay").style.display = "none";
                    }
                    document.getElementById("profile-content").style.display = "block";
                   mostraInstallatorePremium();
                    document.body.style.opacity = "1";
                }
            } else {
                document.body.style.opacity = "1";
            }
        } catch (error) {
            console.error("Errore di caricamento:", error);
            document.body.style.opacity = "1";
        }
    }

  // 1. ASCOLTATORE INTERNAZIONALE PWA
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Se l'utente è già attivo nel momento in cui il browser è pronto, inneschiamo l'installatore premium
        if (identitaVerificata) {
            mostraInstallatorePremium();
        }
    });

    // 2. NUOVO INSTALLATORE FLUTTUANTE PREMIUM (Sostituisce la vecchia mostraBottonePWA)
    function mostraInstallatorePremium() {
        if (!deferredPrompt || !identitaVerificata || document.getElementById("premium-pwa-banner")) return;

        const banner = document.createElement('div');
        banner.id = "premium-pwa-banner";
        banner.className = "premium-install-banner";
        
        banner.innerHTML = `
            <div class="install-banner-header">
                <p class="install-banner-text">
                    ⚡️ <strong>Identità Attiva!</strong> Installa l'applicazione ufficiale sul tuo smartphone per gestire la tua MyQuickTag in tempo reale.
                </p>
                <button class="install-close-btn" onclick="chiudiBannerPremium()"><i class="fas fa-times"></i></button>
            </div>
            <button class="premium-install-action-btn" id="btn-effettivo-pwa">
                <i class="fas fa-download"></i> Aggiungi alla Home
            </button>
        `;

        document.body.appendChild(banner);

        document.getElementById("btn-effettivo-pwa").onclick = () => {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('PWA Installata con successo');
                    chiudiBannerPremium();
                }
                deferredPrompt = null;
            });
        };

        setTimeout(() => {
            banner.classList.add("show");
        }, 100);
    }

    // 3. FUNZIONE DI CHIUSURA BANNER SATINATO
    function chiudiBannerPremium() {
        const banner = document.getElementById("premium-pwa-banner");
        if (banner) {
            banner.classList.remove("show");
            setTimeout(() => {
                banner.remove();
            }, 500);
        }
    }

    // 4. GESTIONE TRANSIZIONE LINK DI CONFIGURAZIONE (CONSERVATO)
    document.addEventListener("DOMContentLoaded", function() {
        const backLink = document.getElementById("back-to-config");
        if (backLink) {
            backLink.addEventListener("click", function(e) {
                e.preventDefault();
                const targetUrl = this.href;
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 250);
            });
        }
    }); 
</script>

</body>
</html>
