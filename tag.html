<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyQuickTag - Ottieni il tuo nome</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <div class="max-w-2xl mx-auto pt-12 px-5">
    <a href="index.html" class="flex items-center gap-2 text-zinc-400 hover:text-white mb-8">
      ← Torna alla ricerca
    </a>

    <div id="content"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let nome = urlParams.get('nome')?.toLowerCase().trim() || 'tag';

    function loadTag() {
      const content = document.getElementById('content');

      content.innerHTML = `
        <div class="text-center mb-10">
          <div class="inline-flex items-center bg-emerald-500/10 text-emerald-400 rounded-full px-6 py-2 text-sm font-medium mb-6">
            <i class="fas fa-check-circle mr-2"></i> NOME DISPONIBILE
          </div>
          <h1 class="text-7xl font-bold tracking-tighter mb-2">@${nome}</h1>
          <p class="text-2xl text-zinc-400">È libero. Prendilo prima che sparisca.</p>
        </div>

        <div class="bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-700">
          <div class="bg-gradient-to-r from-blue-600 to-purple-600 h-32 relative">
            <div class="absolute -bottom-12 left-6 w-24 h-24 bg-zinc-950 rounded-2xl border-4 border-zinc-900 flex items-center justify-center text-5xl shadow-xl">
              👤
            </div>
          </div>

          <div class="pt-16 pb-8 px-6">
            <h2 class="text-3xl font-semibold">@${nome}</h2>
            <p class="text-zinc-400 mt-1">La tua identità digitale unica</p>

            <p class="mt-6 text-zinc-300 leading-relaxed">
              Ciao! Sono un professionista creativo appassionato di tecnologia e innovazione. 
              Qui trovi tutti i miei contatti e progetti.
            </p>

            <div class="mt-8 space-y-3">
              <div class="flex items-center gap-4 bg-zinc-800 rounded-2xl p-4 opacity-50">
                <i class="fab fa-instagram text-2xl w-8"></i>
                <div>
                  <p class="font-medium">Instagram</p>
                  <p class="text-sm text-zinc-400">@${nome}</p>
                </div>
              </div>
              <div class="flex items-center gap-4 bg-zinc-800 rounded-2xl p-4 opacity-50">
                <i class="fas fa-globe text-2xl w-8"></i>
                <div>
                  <p class="font-medium">Sito Web</p>
                  <p class="text-sm text-zinc-400">www.iltuositoweb.it</p>
                </div>
              </div>
            </div>

            <div class="mt-10 flex justify-center">
              <div class="bg-white p-4 rounded-2xl">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://gigiceva-code.github.io/myquicktag/tag.html?nome=${nome}" 
                     alt="QR Code" class="w-52 h-52">
              </div>
            </div>
            <p class="text-center text-xs text-zinc-500 mt-3">Esempio di QR Code generato</p>
          </div>
        </div>

        <button onclick="claimName()" 
                class="w-full mt-10 bg-white text-black py-7 rounded-3xl text-2xl font-semibold hover:bg-emerald-400 transition-all active:scale-95 shadow-[0_0_30px_rgba(255,255,255,0.1)]">
          🎯 Attiva @${nome} GRATIS per 3 mesi
        </button>

        <p class="text-center text-sm text-zinc-500 mt-6">
          Poi solo 2€/anno • Puoi disdire quando vuoi
        </p>
      `;
    }

    async function claimName() {
      // Feedback visivo di successo
      alert(`✅ @${nome} attivato!\n\nOra personalizzalo.`);
      // Reindirizzamento alla pagina di modifica
      window.location.href = `edit.html?nome=${nome}`;
    }

    window.onload = loadTag;
  </script>

</body>
</html>
