
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il tuo MyQuickTag</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f9fafb; }
        .profile-card {
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="profile-card bg-white p-10 rounded-[2.5rem] shadow-2xl shadow-gray-200/50 border border-gray-100 w-full max-w-sm text-center">
        
        <p class="text-[10px] font-bold text-gray-300 uppercase tracking-[0.2em] mb-8">MyQuickTag Identity</p>

        <h1 id="tag" class="text-5xl font-black text-gray-900 mb-4 tracking-tight"></h1>

        <div class="space-y-1 mb-10">
            <p class="text-blue-600 font-semibold text-sm">Identità digitale attiva</p>
            <p class="text-gray-400 text-xs">Contatti · Link · Social · QR personale</p>
        </div>

        <button onclick="condividi()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-4 rounded-2xl transition-all active:scale-95 shadow-lg">
            Condividi profilo
        </button>

        <p class="mt-8 text-[10px] text-gray-300">© 2024 MyQuickTag Protocol</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const nome = params.get("nome");

        if (nome) {
            document.getElementById("tag").innerText = "@" + nome.toLowerCase();
            document.title = "@" + nome + " | MyQuickTag";
        } else {
            document.getElementById("tag").innerText = "@guest";
        }

        function condividi() {
            if (navigator.share) {
                navigator.share({
                    title: 'Il mio MyQuickTag',
                    url: window.location.href
                });
            } else {
                alert("Copia questo link per condividere: " + window.location.href);
            }
        }
    </script>
</body>
</html>
