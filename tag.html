
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag | Il Tuo Profilo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #fdfdfd; font-family: 'Inter', sans-serif; }
        .gold-gradient { background: linear-gradient(45deg, #d4af37, #f9e29c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 20px; }
        .btn-gold { background: linear-gradient(45deg, #d4af37, #f9e29c); color: #000; font-weight: bold; border-radius: 12px; transition: transform 0.2s; }
        .btn-gold:hover { transform: scale(1.05); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md text-center">
        <div class="w-24 h-24 bg-gray-800 rounded-full mx-auto mb-4 border-2 border-[#d4af37] flex items-center justify-center">
            <span class="text-3xl">👤</span>
        </div>
        <h1 class="text-2xl font-bold gold-gradient">Nome Utente</h1>
        <p class="text-gray-400 mt-2 italic" id="user-bio">Inserisci qui la tua biografia breve...</p>
    </div>

    <div class="w-full max-w-md mt-8 space-y-4">
        
        <div class="card p-6">
            <h2 class="text-[#d4af37] font-semibold mb-2 uppercase text-xs tracking-widest">Esperienza & CV</h2>
            <p class="text-sm text-gray-300 leading-relaxed" id="user-cv">
                Qui apparirà il riepilogo del tuo curriculum professionale.
            </p>
        </div>

        <div class="flex gap-4">
            <a href="#" class="card flex-1 p-4 text-center hover:border-[#d4af37]">
                <span class="text-sm font-medium">Instagram</span>
            </a>
            <a href="#" class="card flex-1 p-4 text-center hover:border-[#d4af37]">
                <span class="text-sm font-medium">LinkedIn</span>
            </a>
        </div>
    </div>

    <div class="mt-12 text-center">
        <p class="text-xs text-gray-500 mb-4">Puoi modificare questa pagina in qualsiasi momento dal tuo pannello.</p>
        <button onclick="window.location.href='/edit'" class="btn-gold px-8 py-3 text-sm shadow-lg">
            PERSONALIZZA PAGINA
        </button>
    </div>

</body>
</html>
