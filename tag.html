<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attiva Tag</title>
    <style>
        body { background: #000; color: white; font-family: Arial; text-align: center; padding: 40px; }
        input { padding: 15px; border-radius: 10px; border: none; width: 250px; margin-bottom: 10px; }
        button { padding: 15px; background: #50C878; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2 id="mostra-nome"></h2>
    <p>3 mesi gratis · poi 2€/anno</p>

    <input id="email" placeholder="Inserisci la tua email">
    <br>
    <button id="btn-conferma" onclick="salva()">Conferma e Crea</button>
<script>
const AIRTABLE_TOKEN = "patHk1SHEGGvX0Odw.02f0d009cc72eb8fe01b9b8ec6876217b9d57f09c135cee6a40d63611974ccc9";
const BASE_ID = "app4eQDzqixPDbQTd";
const TABLE_NAME = "Table 1";

const params = new URLSearchParams(window.location.search);
const username = params.get("nome") || "utente";

// Visualizziamo la chiocciola solo per estetica
document.getElementById("mostra-nome").innerText = "@" + username.toUpperCase();

async function salva(){
    const email = document.getElementById("email").value;
    const btn = document.getElementById("btn-conferma");

    if(!email.includes("@")) return alert("Inserisci una email valida");
    
    btn.innerText = "Registrazione...";
    btn.disabled = true;

    try {
        const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}`, {
            method: "POST",
            headers: {
                Authorization: `Bearer ${AIRTABLE_TOKEN}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                fields: {
                    "nome": username.toLowerCase(), 
                    "email": email,                 
                    "bio": "Benvenuti sul mio profilo!",
                    "Stato": "Attivo" // Campo aggiunto per evitare l'errore di Airtable
                }
            })
        });

        if (response.ok) {
            alert("Tag @" + username + " creata con successo!");
            window.location.href = "edit.html?nome=" + username;
        } else {
            // Leggiamo l'errore specifico se Airtable rifiuta ancora
            const errorData = await response.json();
            alert("Errore Airtable: " + (errorData.error ? errorData.error.message : "Controlla le colonne"));
            btn.innerText = "Conferma";
            btn.disabled = false;
        }
    } catch (e) {
        alert("Errore di connessione.");
        btn.disabled = false;
        btn.innerText = "Conferma";
    }
}
</script>
</body>
</html>
