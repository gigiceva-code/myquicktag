
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MyQuickTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link id="dynamic-manifest" rel="manifest" href="">
    <link id="dynamic-icon" rel="icon" href="">

    <style>
        :root {
            --bg-color: #0A0A0A;          /* Nero profondo vellutato (non piatto) */
            --accent-smeraldo: #10B981;   /* Verde Smeraldo Premium */
            --text-main: #ffffff;
            --text-sec: #8E8E93;          /* Grigio calibrato stile Apple iOS */
        }
        
        body {
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            margin: 0; 
            padding: 24px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex; 
            flex-direction: column; 
            align-items: center;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        /* --- STRUTTURA PROFILO PREMIUM UNIFICATA --- */
        .profile-container {
            display: none; 
            opacity: 0; 
            transform: scale(0.98); 
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%; 
            max-width: 420px; 
            margin: 0 auto; 
            padding: 20px;
            box-sizing: border-box;
        }

        .profile-header {
            margin-top: 30px;
            margin-bottom: 40px;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            width: 100%;
        }

        .avatar-wrapper {
            position: relative; 
            display: inline-block;
            margin-bottom: 16px;
        }

        .avatar-img {
            width: 96px; 
            height: 96px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid rgba(255,255,255,0.08); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .username {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.5px;
            color: #FFFFFF;
        }

        .bio {
            font-size: 0.92rem;
            color: var(--text-sec);
            margin-top: 8px;
            max-width: 320px;
            line-height: 1.4;
            font-weight: 400;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .back-link-top {
            align-self: flex-start;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .back-link-top:active {
            opacity: 1;
            transform: scale(0.97);
        }

        /* Tasti di Interazione */
        .sblocco-btn {
            background: #ffffff; 
            color: #000000;
            border: none; 
            padding: 18px; 
            border-radius: 14px;
            font-weight: 600; 
            font-size: 1rem; 
            cursor: pointer; 
            width: 100%;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px;
            box-shadow: 0 10px 25px rgba(255,255,255,0.08);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .sblocco-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        
        /* --- SHOWROOM OVERLAY --- */
        .showroom-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 4, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 99999;
            display: none; 
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
            transition: background-color 1.5s;
        } 

        .expanding-box {
            width: 0px; height: 0px;
            background: rgba(18, 18, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 40px 24px;
            max-width: 360px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            overflow: hidden;
            transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1), height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        } 

        .conversion-content {
            opacity: 0;
            transition: opacity 0.4s ease-out;
            display: flex;
            flex-direction: column;
            gap: 28px;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        #conversion-title {
            font-size: 1.45rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }

        .rendilo-tuo-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.92rem;
            letter-spacing: -0.2px;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
            -webkit-tap-highlight-color: transparent;
        }
        .rendilo-tuo-btn:hover { background: #e5e7eb; }
        .rendilo-tuo-btn:active { transform: scale(0.97); }

        /* --- TAG WELCOME OVERLAY --- */
        .tag-welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 4, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 999999;
            padding: 20px;
            box-sizing: border-box;
        }

        .tag-welcome-card {
            background: rgba(18, 18, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 24px;
            max-width: 360px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: tagEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes tagEntrance {
            from { opacity: 0; transform: scale(0.96) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .tag-success-icon {
            font-size: 2.2rem;
            color: var(--accent-smeraldo);
            margin-bottom: 20px;
        }

        .tag-welcome-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 12px 0;
            letter-spacing: -0.5px;
        }

        .tag-welcome-text {
            font-size: 0.9rem;
            color: #a1a1aa;
            line-height: 1.5;
            margin: 0 0 32px 0;
        }

        .tag-welcome-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.92rem;
            letter-spacing: -0.2px;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
            -webkit-tap-highlight-color: transparent;
        }
        .tag-welcome-btn:active {
            transform: scale(0.97);
            background: #e4e4e7;
        }

        .tag-skip-btn {
            background: transparent;
            border: none;
            color: var(--accent-smeraldo);
            font-size: 16px;
            font-weight: 500;
            margin-top: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
            display: inline-block;
        }
        .tag-skip-btn:hover {
            opacity: 0.8;
        } 
       /* --- STRUTTURA UNIVERSALE DEI COLLEGAMENTI (GEOMETRIA LUXURY) --- */
        .link-box {
            display: flex;
            align-items: center;
            padding: 18px 22px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: -0.1px;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                        background-color 0.25s ease, 
                        border-color 0.25s ease, 
                        box-shadow 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .link-box i {
            font-size: 1.25rem;
            width: 32px;
            text-align: left;
        }

        .link-box span {
            flex-grow: 1;
            text-align: left;
        }

        .link-box:active {
            transform: scale(0.975);
        }

        /* --- 1. BLACK DNA (Minimalismo Stealth & Accenti Chirurgici) --- */
        body.style-black-dna {
            --bg-color: #050505;
            --text-main: #FFFFFF;
            --text-sec: #8E8E93;
            --accent-dinamico: #10B981; /* Il verde smeraldo chirurgico */
        }
        .style-black-dna .link-box {
            background: rgba(18, 18, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #FFFFFF;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .style-black-dna .link-box i {
            color: var(--accent-dinamico);
        }
        .style-black-dna .link-box:active {
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.12);
        }

        /* --- 2. TITANIUM (Precisione Industriale & Riflessi Opachi) --- */
        body.style-titanium {
            --bg-color: #121214;
            --text-main: #F2F2F7;
            --text-sec: #A1A1AA;
            --accent-dinamico: #E4E4E7; /* Platino satinato */
        }
        .style-titanium .link-box {
            background: linear-gradient(145deg, rgba(28, 28, 32, 0.8), rgba(20, 20, 23, 0.8));
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #F2F2F7;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .style-titanium .link-box i {
            color: #8E8E93;
        }
        .style-titanium .link-box:active {
            background: rgba(34, 34, 38, 0.9);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* --- 3. OBSIDIAN GOLD (Vetro Vulcanico & Oro Calibrato) --- */
        body.style-obsidian-gold {
            --bg-color: #070605; /* Nero caldo profondo */
            --text-main: #FFFFFF;
            --text-sec: #A3A3A3;
            --accent-dinamico: #C5A059; /* Oro satinato premium, non pacchiano */
        }
        .style-obsidian-gold .link-box {
            background: rgba(18, 16, 14, 0.7);
            border: 1px solid rgba(197, 160, 89, 0.12);
            color: #FFFFFF;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.6);
        }
        .style-obsidian-gold .link-box i {
            color: var(--accent-dinamico);
        }
        .style-obsidian-gold .link-box:active {
            border-color: rgba(197, 160, 89, 0.4);
            box-shadow: 0 0 22px rgba(197, 160, 89, 0.18);
        }
    </style>
</head>
<body>

    <a href="#" id="back-to-config" class="back-link-top" style="display: none;">
        <i class="fas fa-arrow-left"></i> Torna alla configurazione
    </a>

    <div id="profile-content" class="profile-container">
       <header class="tag-identity-card" id="identity-card">
    <div class="identity-main">
        <h1 class="username-display" onclick="condividiTag()" id="tag-username">@...</h1>
        <p class="user-bio" id="tag-bio"></p>
    </div>
    <button class="share-trigger" onclick="condividiTag()" aria-label="Condividi">
        <i class="fas fa-share-nodes"></i>
    </button>
</header>

        <div class="links-container" id="links-container"></div>
        
        <div id="cta-sblocco-container" style="display: none; margin-top: 40px; width: 100%;">
            <button class="sblocco-btn" onclick="vaiAlCheckout()">
                <i class="fas fa-unlock-alt"></i> Sblocca la tua MyQuickTag
            </button>
        </div>
    </div>

    <div id="showroom-overlay" class="showroom-overlay">
        <div id="expanding-box" class="expanding-box"> 
            <div class="conversion-content">
                <h2 id="conversion-title">Nessun altro potrà essere @...</h2>
                <button class="rendilo-tuo-btn" id="showroom-action-btn">Attiva la tua myquicktag</button>
            </div>
        </div>
    </div>

    <div id="tag-welcome-overlay" class="tag-welcome-overlay">
        <div class="tag-welcome-card">
            <div class="tag-success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 class="tag-welcome-title">Tag Attivata</h2>
            <p class="tag-welcome-text">
                La tua MyQuickTag è ora operativa. Installa l'applicazione per configurare i tuoi collegamenti e aggiornare la tua Tag in tempo reale.
            </p>
            
            <button class="tag-welcome-btn" id="trigger-pwa-install">
                <i class="fas fa-download"></i> Aggiungi alla Home
            </button>
            
            <button class="tag-skip-btn" onclick="chiudiWelcomeEMostraTag()">
                Visualizza la Tag
            </button>
        </div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    let nomeUtenteURL = params.get("u") || ""; 
    if (!nomeUtenteURL) {
        const pathParts = window.location.pathname.split('/');
        const uIndex = pathParts.indexOf('u');
        if (uIndex !== -1 && pathParts[uIndex + 1]) nomeUtenteURL = pathParts[uIndex + 1];
    }

    let globalUtente = "";
    let deferredPrompt;
    let identitaVerificata = false;

    if (nomeUtenteURL) {
        globalUtente = nomeUtenteURL.replace('@', '').trim().toLowerCase();
        document.getElementById("dynamic-manifest").href = `/api/manifest?u=${globalUtente}`;
        document.getElementById("dynamic-icon").href = `/api/icon?u=${globalUtente}`;
        caricaProfiloPubblico(globalUtente);
    }

    function vaiAlCheckout() {
        if (!globalUtente) return;
        window.location.href = `/checkout.html?u=${globalUtente}`;
    }

    async function caricaProfiloPubblico(nomeMinuto) {
        try {
            const response = await fetch(`/api/get-profile?u=${nomeMinuto}`);
            const data = await response.json();
            
            if (data.success && data.fields) {
                const record = data.fields;
                const usernamePulito = (record.username_display || nomeMinuto).replace('@', '').toUpperCase();
                
                document.getElementById("tag-username").innerText = "@" + usernamePulito;
                document.getElementById("tag-bio").innerText = record.bio || "";

                // --- 1. GESTIONE DINAMICA DELLO STILE D'ÉLITE ---
                if (record.digital_style) {
                    document.body.className = `style-${record.digital_style.toLowerCase().trim()}`;
                } else {
                    document.body.className = 'style-black-dna'; // Default di lusso
                }

                // --- 2. RENDERING GENERATIVO DEI PULSANTI (GEOMETRIA LUXURY) ---
                const linksContainer = document.getElementById("links-container");
                linksContainer.innerHTML = ""; 

                // Mappatura d'élite per icone, etichette e pulizia automatica degli URL
                const mappingCanali = {
                    email: { icon: "fas fa-envelope", label: "Email", url: val => val.startsWith("mailto:") ? val : `mailto:${val}` },
                    phone: { icon: "fas fa-phone", label: "Telefono", url: val => val.startsWith("tel:") ? val : `tel:${val}` },
                    whatsapp: { icon: "fab fa-whatsapp", label: "WhatsApp", url: val => val.startsWith("http") ? val : `https://wa.me/${val.replace(/\s+/g, '')}` },
                    instagram: { icon: "fab fa-instagram", label: "Instagram", url: val => val.startsWith("http") ? val : `https://instagram.com/${val.replace('@', '')}` },
                    tiktok: { icon: "fab fa-tiktok", label: "TikTok", url: val => val.startsWith("http") ? val : `https://tiktok.com/@${val.replace('@', '')}` },
                    facebook: { icon: "fab fa-facebook-f", label: "Facebook", url: val => val.startsWith("http") ? val : val },
                    linkedin: { icon: "fab fa-linkedin-in", label: "LinkedIn", url: val => val.startsWith("http") ? val : val },
                    youtube: { icon: "fab fa-youtube", label: "YouTube", url: val => val.startsWith("http") ? val : val },
                    x: { icon: "fab fa-x-twitter", label: "X", url: val => val.startsWith("http") ? val : `https://x.com/${val.replace('@', '')}` },
                    telegram: { icon: "fab fa-telegram-plane", label: "Telegram", url: val => val.startsWith("http") ? val : `https://t.me/${val.replace('@', '')}` },
                    reddit: { icon: "fab fa-reddit-alien", label: "Reddit", url: val => val.startsWith("http") ? val : `https://reddit.com/user/${val}` },
                    sito_web: { icon: "fas fa-globe", label: "Sito Web", url: val => val.startsWith("http") ? val : `https://${val}` },
                    cv: { icon: "fas fa-file-pdf", label: "Curriculum Vitae", url: val => val }
                };

                if (record.config_canali) {
                    try {
                        const canaliObj = typeof record.config_canali === 'string' 
                            ? JSON.parse(record.config_canali) 
                            : record.config_canali;

                        // Generazione controllata e ordinata secondo il design system di MyQuickTag
                        Object.keys(mappingCanali).forEach(chiave => {
                            const valoreRaw = canaliObj[chiave];
                            if (valoreRaw && valoreRaw.trim() !== "") {
                                const info = mappingCanali[chiave];
                                const linkCompleto = info.url(valoreRaw.trim());

                                const linkElement = document.createElement('a');
                                linkElement.href = linkCompleto;
                                linkElement.className = 'link-box';
                                linkElement.target = '_blank';
                                linkElement.rel = 'noopener noreferrer';
                                linkElement.innerHTML = `
                                    <i class="${info.icon}"></i>
                                    <span>${info.label}</span>
                                `;
                                linksContainer.appendChild(linkElement);
                            }
                        });
                    } catch (jsonError) {
                        console.error("Errore decodifica config_canali:", jsonError);
                    }
                }

                const backLink = document.getElementById("back-to-config");
                if (backLink) {
                    backLink.href = `profile.html?u=${nomeMinuto}`;
                }

                const stato = (record.stato || "").toLowerCase().trim();

                if (stato === "in attesa") {
                    identitaVerificata = false;
                    if (backLink) backLink.style.display = "flex";
                    
                    document.getElementById("cta-sblocco-container").style.display = "none";
                    
                    const profile = document.getElementById("profile-content");
                    if (profile) {
                        profile.style.display = "block";
                        setTimeout(() => { profile.style.opacity = "1"; profile.style.transform = "scale(1)"; }, 50);
                    }
                    
                    document.getElementById("conversion-title").innerText = `Nessun altro potrà essere @${usernamePulito}`;
                    
                    const btnRendiloTuo = document.getElementById("showroom-action-btn");
                    if (btnRendiloTuo) {
                        btnRendiloTuo.innerText = "Attiva la tua myquicktag";
                        btnRendiloTuo.onclick = vaiAlCheckout;
                    }
                    
                    document.body.style.opacity = "1";
                    
                    setTimeout(() => {
                        const overlay = document.getElementById("showroom-overlay");
                        const box = document.getElementById("expanding-box"); 
                        const content = document.querySelector(".conversion-content");
                        
                        if (overlay && box && content) {
                            overlay.style.display = "flex";
                            
                            setTimeout(() => {
                                overlay.style.background = "rgba(4, 4, 4, 0.0)"; 
                                overlay.style.backdropFilter = "blur(0px)";
                                overlay.style.webkitBackdropFilter = "blur(0px)";
                                
                                box.style.width = "340px";  
                                box.style.height = "210px"; 
                                
                                setTimeout(() => {
                                    content.style.opacity = "1";
                                }, 300);
                            }, 50);
                        }
                    }, 2500);
                    
                } else if (stato === "attivo") {
                    identitaVerificata = true;
                    if (backLink) backLink.style.display = "none";
                    document.getElementById("cta-sblocco-container").style.display = "none";
                    if (document.getElementById("showroom-overlay")) {
                        document.getElementById("showroom-overlay").style.display = "none";
                    }
                    
                    const profile = document.getElementById("profile-content");
                    if (profile) {
                        profile.style.display = "block";
                        setTimeout(() => {
                            if (!deferredPrompt) {
                                profile.style.opacity = "1";
                                profile.style.transform = "scale(1)";
                            }
                        }, 50);
                    }
                    
                    mostraInstallatorePremium();
                    document.body.style.opacity = "1";
                }
            } else {
                document.body.style.opacity = "1";
            }
        } catch (error) {
            console.error("Errore di caricamento:", error);
            document.body.style.opacity = "1";
        }
    } 

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (identitaVerificata) {
            mostraInstallatorePremium();
        }
    });

    function mostraInstallatorePremium() {
        if (!deferredPrompt || !identitaVerificata) return;
        
        const overlay = document.getElementById("tag-welcome-overlay");
        if (overlay) {
            overlay.style.display = "flex";
            const profile = document.getElementById("profile-content");
            if (profile) {
                profile.style.opacity = "0";
                profile.style.transform = "scale(0.98)";
            }
        }

        const btnInstall = document.getElementById("trigger-pwa-install");
        if (btnInstall) {
            btnInstall.onclick = () => {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('PWA installata con successo.');
                        chiudiWelcomeEMostraTag();
                    }
                    deferredPrompt = null;
                });
            };
        }
    }

    function chiudiWelcomeEMostraTag() {
        const overlay = document.getElementById("tag-welcome-overlay");
        const profile = document.getElementById("profile-content");
        
        if (overlay) {
            overlay.style.transition = "opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)";
            overlay.style.opacity = "0";
            overlay.style.transform = "scale(0.95)";
            
            if (profile) {
                profile.style.opacity = "1";
                profile.style.transform = "scale(1)";
            }
            
            setTimeout(function() {
                overlay.style.display = "none";
            }, 500);
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        const backLink = document.getElementById("back-to-config");
        if (backLink) {
            backLink.addEventListener("click", function(e) {
                e.preventDefault();
                const targetUrl = this.href;
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 250);
            });
        }
    });
    </script>

</body>
</html>
