<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyQuickTag</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap'); body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <div class="max-w-2xl mx-auto pt-12 px-5">
    <a href="index.html" class="flex items-center gap-2 text-zinc-400 hover:text-white mb-8 text-sm">
      ← Torna alla ricerca
    </a>

    <div id="content" class="min-h-[400px]"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let nome = urlParams.get('nome')?.toLowerCase().trim() || '';

    async function loadTag() {
      const content = document.getElementById('content');
      if (!nome) { content.innerHTML = `<p class="text-red-400 text-center">Nessun nome trovato.</p>`; return; }

      content.innerHTML = `
        <div class="text-center">
          <div class="inline-flex items-center bg-emerald-400/10 text-emerald-400 rounded-3xl px-6 py-2 text-sm font-medium mb-8">
            <i class="fas fa-check mr-2"></i> DISPONIBILE
          </div>
          <h1 class="text-7xl font-bold mb-2">@${nome}</h1>
          <p class="text-xl text-zinc-400">Questo nome è libero. Prendilo ora.</p>
        </div>

        <div class="mt-12 bg-zinc-900 rounded-3xl p-8">
          <h2 class="text-lg font-medium mb-6">Ecco come apparirà la tua pagina personale:</h2>
          
          <div class="bg-zinc-950 rounded-2xl p-6 border border-zinc-700">
            <div class="flex items-center gap-4 mb-6">
              <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-purple-500 rounded-2xl flex items-center justify-center text-4xl">👤</div>
              <div>
                <p class="font-semibold text-xl">@${nome}</p>
                <p class="text-zinc-400 text-sm">La tua identità digitale unica</p>
              </div>
            </div>
            
            <div class="space-y-4 text-zinc-400">
              <div class="flex justify-between"><span>Bio</span><span class="text-emerald-400">• • •</span></div>
              <div class="flex justify-between"><span>Link social e sito</span><span class="text-emerald-400">• • •</span></div>
              <div class="flex justify-between"><span>Contatti diretti</span><span class="text-emerald-400">• • •</span></div>
              <div class="flex justify-between"><span>Curriculum / Portfolio</span><span class="text-emerald-400">• • •</span></div>
              <div class="flex justify-between"><span>Codice QR</span><span class="text-emerald-400">• • •</span></div>
            </div>
          </div>

          <button onclick="claimName()" 
                  class="w-full mt-10 bg-white text-black py-6 rounded-3xl text-xl font-semibold hover:bg-emerald-400 hover:text-black transition-all">
            Attiva @${nome} GRATIS per 3 mesi
          </button>
          
          <p class="text-center text-xs text-zinc-500 mt-6">Poi rinnovi a soli 2€/anno</p>
        </div>
      `;
    }

    async function claimName() {
      alert(`✅ @${nome} attivato con successo!\n\nOra puoi personalizzare la tua pagina (prossima funzionalità).`);
      // Qui in futuro andrai alla pagina di editing
    }

    window.onload = loadTag;
  </script>
</body>
</html>
