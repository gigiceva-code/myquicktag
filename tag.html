
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag - Profilo</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <div id="tag-container" class="profile-card">
        <div class="header">
            <img id="display-avatar" src="default-avatar.png" alt="Avatar" class="avatar">
            <h1 id="display-name">Caricamento...</h1>
            <p id="display-bio"></p>
        </div>

        <div id="social-links" class="links-container">
            </div>
    </div>

    <script>
        // 1. Recuperiamo l'utente dalla URL (es. tag.html?u=test)
        const params = new URLSearchParams(window.location.search);
        let user = params.get("u");

        if (user) {
            // Puliamo il nome per la ricerca nel sistema
            user = user.replace('@', '').toLowerCase();
            caricaProfiloPubblico(user);
        } else {
            document.body.innerHTML = "<h1>Profilo non specificato</h1>";
        }

        async function caricaProfiloPubblico(username) {
            try {
                const response = await fetch(`/api/get-profile?u=${username}`);
                const result = await response.json();

                if (result.success) {
                    const dati = result.fields;

                    // Mostriamo il nome estetico (username_display)
                    document.getElementById("display-name").innerText = dati.username_display || "@" + username;
                    document.getElementById("display-bio").innerText = dati.bio || "";
                    
                    // Se hai una colonna per l'immagine
                    if (dati.avatar_url) {
                        document.getElementById("display-avatar").src = dati.avatar_url;
                    }

                    // Esempio di creazione dinamica dei link social
                    const socialLinks = document.getElementById("social-links");
                    const piattaforme = ["instagram", "tiktok", "whatsapp", "linkedin", "youtube", "sito_web"];

                    piattaforme.forEach(p => {
                        if (dati[p]) {
                            const btn = document.createElement("a");
                            btn.href = dati[p].startsWith('http') ? dati[p] : `https://${dati[p]}`;
                            btn.className = `btn btn-${p}`;
                            btn.innerText = p.toUpperCase().replace('_', ' ');
                            btn.target = "_blank";
                            socialLinks.appendChild(btn);
                        }
                    });

                } else {
                    document.getElementById("display-name").innerText = "Profilo non trovato";
                }
            } catch (error) {
                console.error("Errore nel caricamento:", error);
            }
        }
    </script>
</body>
</html>
