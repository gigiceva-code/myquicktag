<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MyQuickTag Identity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link id="dynamic-manifest" rel="manifest" href="">
    <link id="dynamic-icon" rel="icon" href="">

    <style>
        /* Effetto accensione showroom */
        body {
            opacity: 0;
            transition: opacity 0.6s ease-out; /* 0.6 secondi di pura dissolvenza fluida */
        }
        :root {
            --bg-color: #000000;
            --accent-smeraldo: #50C878;
            --text-main: #ffffff;
            --text-sec: #6c6c70;
        }
        
        body {
            margin: 0; padding: 24px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .profile-header {
            margin-top: 40px;
            display: flex; flex-direction: column; align-items: center;
            width: 100%;
        }

        .username {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .bio {
            font-size: 1rem;
            color: var(--text-sec);
            margin-top: 10px;
            max-width: 320px;
            line-height: 1.5;
        }

        .links-container {
            margin-top: 40px;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Stile modale per la password */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 1000;
            justify-content: center; align-items: center; padding: 24px;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }

        .modal-box {
            background: #111; border: 1px solid #333; border-radius: 20px;
            padding: 30px 24px; width: 100%; max-width: 340px; text-align: center;
        }

        .modal-box h2 {
            color: var(--accent-smeraldo); margin: 0 0 10px 0; font-size: 1.4rem;
        }

        .modal-box p {
            color: #aaa; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.4;
        }

        .modal-box input {
            width: 100%; padding: 16px; margin-bottom: 20px;
            background: #000; border: 1px solid #444; color: white;
            border-radius: 12px; box-sizing: border-box; font-size: 1rem;
        }

        .modal-box input:focus {
            outline: none; border-color: var(--accent-smeraldo);
        }

        /* Bottone PWA dinamico */
        .pwa-btn {
            background: var(--accent-smeraldo);
            color: #000; border: none; padding: 18px; border-radius: 14px;
            font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        /* Stile per la freccia torna alla configurazione */
        .back-link-top {
            align-self: flex-start;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .back-link-top:active {
            opacity: 1;
            transform: scale(0.97);
        }

        /* Bottone di Sblocco nello Showroom */
        .sblocco-btn {
            background: #ffffff; color: #000000;
            border: none; padding: 18px; border-radius: 14px;
            font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 10px 25px rgba(255,255,255,0.1);
        }
        
        /* Bottone di conferma interno alla modale */
        .modal-confirm-btn {
            background: var(--accent-smeraldo); color: #000000;
            border: none; padding: 16px; border-radius: 12px;
            font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%;
        }

        /* Effetti di pressione ammortizzati senza scatti */
        .sblocco-btn, .modal-confirm-btn {
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s !important;
            -webkit-tap-highlight-color: transparent;
        }
        .sblocco-btn:active, .modal-confirm-btn:active {
            transform: scale(0.98) !important;
            opacity: 0.9;
        }
     /* 1. Sfondo completamente trasparente e interazioni libere */
        .showroom-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0); /* Zero oscuramento: massima trasparenza */
            backdrop-filter: blur(0px); /* Zero sfocatura sul profilo */
            -webkit-backdrop-filter: blur(0px);
            z-index: 900;
            display: none; 
            justify-content: center;
            align-items: center;
            pointer-events: none; /* L'utente può ancora toccare e vedere il profilo sotto */
            transition: background-color 1.5s;
        } 

       /* 2. Il rettangolo fluttuante che si espande in larghezza */
        .expanding-box {
            width: 0px;
            height: 0px;
            border-radius: 12px; /* Angoli leggermente smussati, elegantissimo */
            background: rgba(255, 255, 255, 0.02); /* Trasparenza cristallina */
            border: 1px solid rgba(255, 255, 255, 0.3); /* Bordo bianco luminoso e nitido */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            pointer-events: auto;
            /* Transizione fluida su larghezza e altezza */
            transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1), height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        } 

   /* 2. Il cerchio fluttuante (Anello di luce puro, zero sfocatura dietro) */
        .expanding-circle {
            width: 0px;
            height: 0px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.01); /* Quasi invisibile il fondo */
            border: 1px solid rgba(255, 255, 255, 0.2); /* Un raggio di luce nitido che definisce il cerchio */
            backdrop-filter: blur(0px); /* ELIMINATO IL BLUR: trasparenza totale */
            -webkit-backdrop-filter: blur(0px);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            pointer-events: auto;
            transition: width 1.8s cubic-bezier(0.16, 1, 0.3, 1), height 1.8s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .conversion-content h2 {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            line-height: 1.4;
            margin-bottom: 30px;
            color: #ffffff;
        }

      /* 4. Il bottone premium in vetro satinato trasparente */
        .rendilo-tuo-btn {
            background: rgba(255, 255, 255, 0.07); /* Trasparenza ghiaccio */
            color: #ffffff; /* Testo bianco puro e nitido */
            border: 1px solid rgba(255, 255, 255, 0.15); /* Bordino finissimo stile orologeria */
            padding: 16px 32px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            cursor: pointer;
            width: 100%;
            backdrop-filter: blur(10px); /* Un micro-vetro nel vetro */
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.3s, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        /* Effetto reattività premium quando viene toccato */
        .rendilo-tuo-btn:active {
            background: rgba(255, 255, 255, 0.15); /* Si illumina leggermente sotto il dito */
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <a href="#" id="back-to-config" class="back-link-top" style="display: none;">
        <i class="fas fa-arrow-left"></i> Torna alla configurazione
    </a>

    <div id="profile-content" style="display: none; width: 100%; max-width: 350px;">
        
        <div class="profile-header">
            <h1 class="username" id="tag-username">@...</h1>
            <p class="bio" id="tag-bio">Caricamento identità...</p>
        </div>

        <div class="links-container" id="links-container"></div>
        
        <div id="cta-sblocco-container" style="display: none; margin-top: 40px; width: 100%;">
            <button class="sblocco-btn" onclick="apriModaleAttivazione()">
                <i class="fas fa-unlock-alt"></i> Sblocca la tua MyQuickTag
            </button>
        </div>
        
    </div>
    <div id="showroom-overlay" class="showroom-overlay">
        <div id="expanding-box" class="expanding-box"> <div class="conversion-content">
                <h2 id="conversion-title">Nessun altro potrà essere @...</h2>
                <button class="rendilo-tuo-btn" onclick="apriModaleAttivazione()">Rendilo tuo</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="activation-modal">
        <div class="modal-box">
            <h2>Attivazione Identità</h2>
            <p>Imposta la tua chiave di sicurezza (password) per rendere pubblica la tua Tag e abilitare l'App.</p>
            <input type="password" id="new-password" placeholder="Scegli una password">
            <button class="modal-confirm-btn" onclick="salvaPasswordEAttiva()">Conferma e Attiva</button>
        </div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    let nomeUtenteURL = params.get("u") || ""; 
    if (!nomeUtenteURL) {
        const pathParts = window.location.pathname.split('/');
        const uIndex = pathParts.indexOf('u');
        if (uIndex !== -1 && pathParts[uIndex + 1]) nomeUtenteURL = pathParts[uIndex + 1];
    }

    let globalUtente = "";
    let deferredPrompt;
    let identitaVerificata = false;

    if (nomeUtenteURL) {
        globalUtente = nomeUtenteURL.replace('@', '').trim().toLowerCase();
        document.getElementById("dynamic-manifest").href = `/api/manifest?u=${globalUtente}`;
        document.getElementById("dynamic-icon").href = `/api/icon?u=${globalUtente}`;
        caricaProfiloPubblico(globalUtente);
    }

    // Funzione per aprire la modale quando si clicca sul tasto di sblocco
    function apriModaleAttivazione() {
        document.getElementById("activation-modal").style.display = "flex";
    }

async function caricaProfiloPubblico(nomeMinuto) {
    try {
        const response = await fetch(`/api/get-profile?u=${nomeMinuto}`);
        const data = await response.json();
        
        if (data.success && data.fields) {
            const record = data.fields;
            
            const usernamePulito = (record.username_display || nomeMinuto).replace('@', '').toUpperCase();
            
            document.getElementById("tag-username").innerText = "@" + usernamePulito;
            document.getElementById("tag-bio").innerText = record.bio || "";

            const backLink = document.getElementById("back-to-config");
            if (backLink) {
                backLink.href = `profile.html?u=${nomeMinuto}`;
            }

            const stato = (record.stato || "").toLowerCase().trim();

            if (stato === "in attesa") {
                identitaVerificata = false;
                
                if (backLink) backLink.style.display = "flex";
                
                document.getElementById("cta-sblocco-container").style.display = "none";
                document.getElementById("profile-content").style.display = "block";
                document.getElementById("activation-modal").style.display = "none";
                
                document.getElementById("conversion-title").innerText = `Nessun altro potrà essere @${usernamePulito}`;
                
                // PARTENZA ANIMAZIONE (Dopo 2.5 secondi di quiete)
                setTimeout(() => {
                    const overlay = document.getElementById("showroom-overlay");
                    const circle = document.getElementById("expanding-circle");
                    const content = document.querySelector(".conversion-content");
                    
                    if (overlay && circle && content) {
                        overlay.style.display = "flex";
                        
                      // PARTENZA ANIMAZIONE RETTANGOLO (Dopo 2.5 secondi)
                setTimeout(() => {
                    const overlay = document.getElementById("showroom-overlay");
                    const box = document.getElementById("expanding-box"); // Puntiamo al box
                    const content = document.querySelector(".conversion-content");
                    
                    if (overlay && box && content) {
                        overlay.style.display = "flex";
                        
                        setTimeout(() => {
                            overlay.style.background = "rgba(0, 0, 0, 0)";
                            overlay.style.backdropFilter = "blur(0px)";
                            overlay.style.webkitBackdropFilter = "blur(0px)";
                            
                            // Il rettangolo si apre: prima prende l'altezza, poi si spalanca in larghezza
                            box.style.width = "320px";  // Larghezza perfetta per la frase
                            box.style.height = "210px"; // Altezza proporzionata per contenere tutto comodo
                            
                            // La frase appare dolcemente al suo interno appena è aperto
                            content.style.opacity = "1";
                        }, 50);
                    }
                }, 2500);
                
            } else if (stato === "attivo") {
                identitaVerificata = true;
                
                if (backLink) backLink.style.display = "none";
                document.getElementById("cta-sblocco-container").style.display = "none";
                if (document.getElementById("showroom-overlay")) {
                    document.getElementById("showroom-overlay").style.display = "none";
                }
                document.getElementById("profile-content").style.display = "block";
                mostraBottonePWA();
            }

            document.body.style.opacity = "1";
        }
    } catch (error) {
        console.error("Errore di caricamento:", error);
        document.body.style.opacity = "1";
    }
  }

    async function salvaPasswordEAttiva() {
        const pwd = document.getElementById("new-password").value;
        if (pwd.length < 4) {
            alert("La password deve essere di almeno 4 caratteri.");
            return;
        }

        try {
            const response = await fetch('/api/update-profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username_system: globalUtente,
                    password: pwd,
                    stato: "attivo"      
                })
            });
            
            const resData = await response.json();
            if (resData.success) {
                document.getElementById("activation-modal").style.display = "none";
                document.getElementById("cta-sblocco-container").style.display = "none";
                identitaVerificata = true; 
                setTimeout(() => {
                    alert("Identità Attivata!");
                    mostraBottonePWA();
                }, 300);
            } else {
                alert("Errore: " + (resData.error || "Riprova"));
            }
        } catch (e) {
            console.error(e);
            alert("Errore di rete.");
        }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });

    function mostraBottonePWA() {
        if (deferredPrompt && identitaVerificata && !document.getElementById("btn-installa-pwa")) {
            const btn = document.createElement('button');
            btn.id = "btn-installa-pwa";
            btn.className = "pwa-btn";
            btn.innerHTML = `<i class="fas fa-download"></i> Installa App`;
            btn.onclick = () => { deferredPrompt.prompt(); };
            document.getElementById("links-container").prepend(btn);
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        const backLink = document.getElementById("back-to-config");
        if (backLink) {
            backLink.addEventListener("click", function(e) {
                e.preventDefault();
                const targetUrl = this.href;
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 250);
            });
        }
    });
</script>

</body>
</html>
