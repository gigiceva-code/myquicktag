<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MyQuickTag | Digital Profile</title>
    <style>
        :root {
            --bg: #000000;
            --card-bg: #0a0a0a;
            --text: #ffffff;
            --accent: #ffffff;
            --gray: #888888;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .tag-container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 60px 20px;
            flex-grow: 1;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 25px;
            object-fit: cover;
            background: #111;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -1px;
            margin: 10px 0;
            text-transform: lowercase;
        }

        .bio {
            color: var(--gray);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: var(--card-bg);
            color: var(--text);
            text-decoration: none;
            padding: 18px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .btn:active {
            transform: scale(0.97);
            background: rgba(255,255,255,0.05);
        }

        /* Banner Celebrativo */
        #activation-banner {
            display: none;
            position: fixed;
            bottom: 30px;
            width: 90%;
            max-width: 380px;
            background: #ffffff;
            color: #000000;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            z-index: 999;
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(150%); }
            to { transform: translateY(0); }
        }

        .footer-logo {
            margin: 50px 0 120px;
            font-size: 10px;
            color: #444;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Overlay Password */
        #password-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
    <link id="dynamic-manifest" rel="manifest" href="">
    <link id="dynamic-icon" rel="icon" href="">
</head>
<body>

    <div class="tag-container">
        <img id="display-avatar" src="https://via.placeholder.com/150" alt="Avatar" class="avatar">
        <h1 id="display-name">@loading...</h1>
        <p id="display-bio" class="bio"></p>
        <div id="social-links" class="links-container"></div>
        <div class="footer-logo">MyQuickTag Luxury Identity</div>
    </div>

    <div id="activation-banner">
        <p style="margin:0 0 10px 0; font-weight:700; font-size:14px; letter-spacing:1px;">COMPLIMENTI! 🎉</p>
        <p style="margin:0 0 15px 0; font-size:13px; opacity:0.8;">Il tuo @tag è pronto. Hai sbloccato <b>3 MESI GRATIS</b>. Attivalo ora.</p>
        <button onclick="openPwd()" style="width:100%; padding:12px; background:#000; color:#fff; border:none; border-radius:12px; font-weight:bold; cursor:pointer;">RISCATTA REGALO</button>
    </div>

    <div id="password-overlay">
        <div style="text-align:center; max-width:320px; padding:20px;">
            <h2 style="letter-spacing:2px; font-size:18px;">CREA LA TUA CHIAVE</h2>
            <p style="opacity:0.6; font-size:13px; margin-bottom:30px;">Scegli una password per gestire il tuo profilo in futuro.</p>
            <input type="password" id="new-pwd" placeholder="Password" style="width:100%; padding:15px; background:transparent; border:1px solid #333; color:white; border-radius:12px; margin-bottom:15px; text-align:center; outline:none;">
            <button id="save-btn" onclick="savePwd()" style="width:100%; padding:15px; background:#fff; color:#000; border:none; border-radius:12px; font-weight:bold;">ATTIVA ORA</button>
            <p onclick="closePwd()" style="margin-top:20px; font-size:12px; opacity:0.4; cursor:pointer;">Annulla</p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const user = params.get("u");

        function openPwd() { document.getElementById('password-overlay').style.display = 'flex'; }
        function closePwd() { document.getElementById('password-overlay').style.display = 'none'; }

        async function fetchProfile() {
            if (!user) return;
            const cleanUser = user.replace('@', '').toLowerCase();
            const manifestLink = document.getElementById('dynamic-manifest');
            const iconLink = document.getElementById('dynamic-icon');
            if (manifestLink) manifestLink.href = `/api/manifest?u=${cleanUser}`;
            if (iconLink) iconLink.href = `/api/generate-icon?u=${cleanUser}`;
            try {
                const response = await fetch(`/api/get-profile?u=${cleanUser}`);
                const result = await response.json();

                if (!result.success || !result.fields) {
                    document.getElementById("display-name").innerText = "IDENTITÀ NON DISPONIBILE";
                    document.getElementById("display-bio").innerHTML = `
                        <div style="margin-top: 20px;">
                            <p style="opacity: 0.6;">Questo Tag non è ancora stato configurato.</p>
                            <br><br>
                            <a href="/" style="color: #fff; text-decoration: none; border: 1px solid #333; padding: 12px 25px; border-radius: 50px; font-size: 12px; letter-spacing: 1px;">TORNA ALLA HOME</a>
                        </div>
                    `;
                    return; // Interrompe l'esecuzione così non cerca altri dati
                }
                // --- FINE AGGIUNTA ---
                if (result.success) {
                    const d = result.fields;
                    document.getElementById("display-name").innerText = d.username_display || "@" + cleanUser;
                    document.getElementById("display-bio").innerText = d.bio || "";
                    
                    // Se NON ha la password, mostra il banner dei complimenti
                    if (!d.password) {
                        setTimeout(() => {
                            document.getElementById("activation-banner").style.display = "block";
                        }, 2000); // Appare dopo 2 secondi per effetto wow
                    }

                    const container = document.getElementById("social-links");
                    const socialMap = ["instagram", "tiktok", "whatsapp", "linkedin", "youtube", "sito_web"];

                    socialMap.forEach(key => {
                        if (d[key]) {
                            const a = document.createElement("a");
                            a.className = "btn";
                            a.href = d[key].startsWith('http') ? d[key] : `https://${d[key]}`;
                            a.target = "_blank";
                            a.innerText = key.replace('_', ' ');
                            container.appendChild(a);
                        }
                    });
                }
            } catch (e) { console.error(e); }
        }

        async function savePwd() {
            const pwd = document.getElementById('new-pwd').value;
            const btn = document.getElementById('save-btn');
            if (pwd.length < 4) { alert("Minimo 4 caratteri"); return; }

            btn.innerText = "ATTIVAZIONE...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/set-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username_system: user.replace('@',''), password: pwd })
                });
                const data = await res.json();
                if (data.success) {
                    alert("Profilo Attivato! Benvenuto in MyQuickTag.");
                    window.location.href = 'celebration.html';
                }
            } catch (e) { alert("Errore attivazione"); btn.disabled = false; }
        }

        fetchProfile();
    </script>
</body>
</html>
