<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyQuickTag - Disponibilità</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <div class="max-w-2xl mx-auto pt-12 px-5">
    <a href="index.html" class="flex items-center gap-2 text-zinc-400 hover:text-white mb-8">← Torna alla ricerca</a>
    <div id="content">
        <p class="text-center animate-pulse">Caricamento dati...</p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let nome = urlParams.get('nome')?.toLowerCase().trim() || '';
    
    // I tuoi dati Airtable
    const AIRTABLE_PAT = "patWfr8e2nM0vvhtR.69b3beff785c42c9d59a6d1f898023a16ce907f43e22716d94b497eef8dec54c";
    const BASE_ID = "appG2S8jV9Ams3wYq";
    const TABLE_NAME = "Tabella 1";

    function loadTag() {
      const content = document.getElementById('content');
      if(!nome) { content.innerHTML = "Tag non specificato."; return; }

      content.innerHTML = `
        <div class="text-center mb-10">
          <div class="inline-flex items-center bg-emerald-500/10 text-emerald-400 rounded-full px-6 py-2 text-sm font-medium mb-6">
            <i class="fas fa-check-circle mr-2"></i> DISPONIBILE
          </div>
          <h1 class="text-7xl font-bold tracking-tighter mb-2">@${nome}</h1>
          <p class="text-2xl text-zinc-400">Inserisci la tua email per bloccarlo.</p>
        </div>

        <div class="bg-zinc-900 rounded-3xl p-8 border border-zinc-700 mb-8">
            <input id="userEmail" type="email" placeholder="La tua email (obbligatoria)" 
                   class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-white outline-none focus:border-emerald-500 mb-4">
            <button onclick="claimName()" class="w-full bg-white text-black py-7 rounded-3xl text-2xl font-semibold hover:bg-emerald-400 transition-all">
              🎯 Attiva @${nome} GRATIS
            </button>
        </div>
      `;
    }

    async function claimName() {
      const email = document.getElementById('userEmail').value.trim();
      if(!email) { alert("Inserisci una mail valida!"); return; }

      try {
        const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${AIRTABLE_PAT}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            fields: { "nome": nome, "email": email }
          })
        });

        if(response.ok) {
          alert(`✅ @${nome} registrato con successo!`);
          window.location.href = `edit.html?nome=${nome}`;
        } else {
          alert("Errore durante la registrazione. Riprova.");
        }
      } catch (e) {
        alert("Errore di connessione.");
      }
    }

    window.onload = loadTag;
  </script>
</body>
</html>
