<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configura il tuo Tag</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-50 font-sans p-6 text-black">
    <div class="max-w-xl mx-auto bg-white rounded-[40px] shadow-[20px_20px_0px_0px_rgba(0,0,0,1)] overflow-hidden border-[3px] border-black mt-10">
        
        <div class="bg-black p-12 text-center">
            <div class="w-24 h-24 bg-zinc-800 rounded-full mx-auto mb-6 border-2 border-white/20"></div>
            <h2 id="displayTag" class="text-white text-5xl font-black italic tracking-tighter">@NOME</h2>
            <p class="text-zinc-500 mt-2 uppercase tracking-widest text-xs font-bold">Anteprima del tuo profilo</p>
        </div>
        
        <div class="p-10">
            <h3 class="text-3xl font-black mb-2 italic">LIBERO! 🎉</h3>
            <p class="text-zinc-500 mb-8 font-medium">Per attivare ufficialmente la tua identità e ricevere la conferma, inserisci la tua mail qui sotto.</p>
            
            <label class="block text-[10px] font-black uppercase tracking-[0.2em] mb-2 ml-1 text-zinc-400">Indirizzo Email</label>
            <input id="userEmail" type="email" placeholder="esempio@email.com" 
                   class="w-full p-5 border-[3px] border-black rounded-2xl mb-6 focus:bg-yellow-50 outline-none font-bold text-lg shadow-inner">
            
            <button onclick="salvaEAttiva()" class="w-full bg-black text-white py-6 rounded-2xl font-black text-2xl hover:bg-zinc-800 transition-all active:scale-95 shadow-xl">
                CONFERMA E ATTIVA
            </button>
            
            <p id="feedback" class="mt-6 text-center font-black italic uppercase"></p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const nomeTag = params.get('nome');
        document.getElementById('displayTag').innerText = "@" + (nomeTag ? nomeTag.toUpperCase() : "NOME");

        async function salvaEAttiva() {
            const email = document.getElementById('userEmail').value.trim();
            const feedback = document.getElementById('feedback');
            
            if(!email) { alert("Ehi, inserisci la mail!"); return; }

            feedback.innerText = "REGISTRAZIONE IN CORSO...";
            feedback.className = "mt-6 text-center font-black italic text-zinc-400 animate-pulse";

            try {
                const response = await fetch(`https://api.airtable.com/v0/appG2S8jV9Ams3wYq/Tabella%201`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer patWfr8e2nM0vvhtR.69b3beff785c42c9d59a6d1f898023a16ce907f43e22716d94b497eef8dec54c',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fields: { 
                            "nome": nomeTag, 
                            "email": email,
                            "Data_Inizio": new Date().toISOString().split('T')[0]
                        }
                    })
                });

                if(response.ok) {
                    feedback.innerText = "🎉 ECCELLENTE! TAG REGISTRATO.";
                    feedback.className = "mt-6 text-center font-black italic text-emerald-600";
                    // Qui potremmo aggiungere il re-indirizzamento a una pagina di ringraziamento
                } else {
                    feedback.innerText = "ERRORE DURANTE IL SALVATAGGIO.";
                    feedback.className = "mt-6 text-center font-black italic text-red-500";
                }
            } catch (e) {
                feedback.innerText = "PROBLEMA DI RETE.";
            }
        }
    </script>
</body>
</html>
