<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag - Prenota il tuo Tag</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black font-sans">
    <div class="flex flex-col items-center justify-center min-h-screen px-4">
        <h1 class="text-6xl font-black mb-4 tracking-tighter uppercase italic">MyQuickTag</h1>
        <p class="text-xl mb-10 text-gray-500 font-medium">Il tuo nome unico. La tua identità digitale.</p>
        
        <div class="w-full max-w-md bg-white p-2 rounded-full border-[3px] border-black flex items-center shadow-[10px_10px_0px_0px_rgba(0,0,0,1)]">
            <span class="pl-6 text-3xl font-black text-black">@</span>
            <input id="tagInput" type="text" placeholder="iltuonome" 
                   class="bg-transparent text-2xl font-bold focus:outline-none w-full p-4 uppercase">
            <button onclick="checkTag()" class="bg-black text-white px-10 py-4 rounded-full font-black hover:bg-zinc-800 transition-all active:scale-95">
                VAI
            </button>
        </div>
        <p id="statusMsg" class="mt-8 font-bold text-lg italic"></p>
    </div>

    <script>
        const AIRTABLE_PAT = "patWfr8e2nM0vvhtR.69b3beff785c42c9d59a6d1f898023a16ce907f43e22716d94b497eef8dec54c";
        const BASE_ID = "appG2S8jV9Ams3wYq";
        const TABLE_NAME = "Tabella 1";

        async function checkTag() {
            const nome = document.getElementById('tagInput').value.trim().toLowerCase();
            const msg = document.getElementById('statusMsg');
            if(!nome) return;

            msg.innerText = "CONTROLLO DISPONIBILITÀ...";
            msg.className = "mt-8 font-bold text-lg italic text-zinc-400 animate-pulse";
            
            try {
                const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={nome}='${nome}'`;
                const response = await fetch(url, { headers: { Authorization: `Bearer ${AIRTABLE_PAT}` } });
                const data = await response.json();

                if (data.records && data.records.length > 0) {
                    msg.innerText = "❌ QUESTO NOME È GIÀ PRESO.";
                    msg.className = "mt-8 font-bold text-lg text-red-500";
                } else {
                    window.location.href = `tag.html?nome=${nome}`;
                }
            } catch (e) {
                msg.innerText = "ERRORE DI CONNESSIONE.";
            }
        }
    </script>
</body>
</html>
