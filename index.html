<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyQuickTag - Il mondo dentro il tuo nome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    
    @keyframes softPulse {
      0% { opacity: 0.4; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.4; transform: scale(0.98); }
    }
    .pulse-text { animation: softPulse 3s infinite ease-in-out; }

    .input-group:focus-within {
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="bg-[#050505] text-white min-h-screen flex flex-col p-6 overflow-hidden">

  <div class="h-16 w-full flex items-center justify-between px-2 mb-4">
    <div class="w-10 h-10 bg-zinc-900/50 rounded-full flex items-center justify-center border border-zinc-800">
      <i class="fas fa-bars text-xs text-zinc-500"></i>
    </div>
  </div>

  <div class="flex-1 flex flex-col items-center pt-4 text-center">
    <h1 class="text-5xl font-[900] tracking-tighter italic uppercase mb-3">MyQuickTag</h1>
    <p class="text-xl text-zinc-300 font-medium mb-16 pulse-text tracking-tight">Il mondo dentro il tuo nome</p>

    <div class="w-full max-w-sm bg-[#111] border border-zinc-800/50 rounded-[2rem] p-2 shadow-2xl input-group transition-all">
      <div class="flex items-center px-6 py-5 border-b border-zinc-800/30">
        <span class="text-2xl font-bold text-zinc-600 mr-1">@</span>
        <input id="searchInput" type="text" placeholder="iltuonome" 
               class="flex-1 bg-transparent outline-none text-xl text-white font-semibold uppercase placeholder-zinc-800">
      </div>
      <button onclick="checkName()" 
              class="w-full bg-white text-black font-bold py-4 mt-2 rounded-[1.5rem] text-base hover:bg-zinc-200 transition-all active:scale-95">
        Verifica
      </button>
    </div>
    
    <p id="status" class="mt-8 text-[10px] font-black uppercase tracking-[0.3em] min-h-[20px]"></p>
  </div>

  <div class="flex justify-around text-[9px] text-zinc-600 font-bold uppercase tracking-[0.2em] pb-6 pt-6 border-t border-zinc-900/30">
    <div class="text-center"><span class="block text-zinc-400">90 GG</span>TRIAL</div>
    <div class="text-center"><span class="block text-zinc-400">2€</span>ANNO</div>
    <div class="text-center"><span class="block text-zinc-400">UNIQUE</span>STATUS</div>
  </div>

  <script>
    const AIRTABLE_PAT = "patWfr8e2nM0vvhtR.69b3beff785c42c9d59a6d1f898023a16ce907f43e22716d94b497eef8dec54c";
    const BASE_ID = "appG2S8jV9Ams3wYq";
    const TABLE_NAME = "Tabella 1";

    async function checkName() {
      let input = document.getElementById('searchInput').value.trim();
      const status = document.getElementById('status');
      if (!input) return;

      input = input.replace('@', '').replace(/\s+/g, '').toLowerCase();
      status.innerHTML = '<span class="text-zinc-500 animate-pulse">Sincronizzazione...</span>';

      try {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={nome}='${input}'`;
        const response = await fetch(url, { headers: { Authorization: `Bearer ${AIRTABLE_PAT}` } });
        const data = await response.json();

        if (data.records && data.records.length > 0) {
          status.innerHTML = '<span class="text-red-600">Occupato</span>';
        } else {
          status.innerHTML = '<span class="text-emerald-500">Libero</span>';
          setTimeout(() => { window.location.href = `tag.html?nome=${input}`; }, 700);
        }
      } catch (e) {
        status.innerHTML = 'Errore';
      }
    }
  </script>
