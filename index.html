<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MyQuickTag</title>
    <style>
        body, html {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100dvh; /* Altezza dinamica reale */
            padding-top: 30px;
            box-sizing: border-box;
        }

        /* LOGO E TITOLO (Bloccati in alto) */
        .brand-section {
            z-index: 10;
            text-align: center;
            margin-bottom: 20px;
        }

        /* IPHONE: Slanciato (300px) ma scala ridotta per non invadere */
        .iphone-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-bottom: 80px; /* DISTANZA DI SICUREZZA BARRA ANDROID */
        }

        #iphone-mockup {
            width: 140px; /* Larghezza moderata (stabile) */
            height: 300px; /* Slancio verticale */
            background: #1a1a1a;
            border: 3px solid #333;
            border-radius: 30px;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* L'EQUILIBRIO: Scala a 1.45 invece di 1.6/1.8 */
        /* Questo permette all'iPhone di crescere senza toccare né il titolo né i tasti */
        .iphone-active {
            transform: scale(1.45) !important; 
            box-shadow: 0 0 80px rgba(80, 200, 120, 0.1);
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="brand-section">
            <div style="position: relative; width: 65px; height: 65px; margin: 0 auto 10px;">
                <div style="width: 100%; height: 100%; border: 6px solid #50C878; border-radius: 50%; box-sizing: border-box;"></div>
                <div style="position: absolute; width: 6px; height: 20px; background: #50C878; bottom: -2px; right: -2px; transform: rotate(-45deg); border-radius: 3px;"></div>
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); color: #fff; font-size: 32px; font-weight: bold;">@</div>
            </div>
            <h1 style="color:#fff; font-size: 26px; font-weight: 900; margin: 0; text-transform: uppercase;">MYQUICKTAG</h1>
            <p style="color: #50C878; font-size: 11px; font-weight: 600; letter-spacing: 2px; margin-top: 4px; text-transform: uppercase;">Istant Digital Identity</p>
        </div>

        <div class="iphone-wrapper">
            <div id="iphone-mockup" onclick="toggleIphone()">
                <div style="width: 45px; height: 12px; background: #000; border-radius: 6px; margin-top: 12px;"></div>
                <span style="color: #50C878; font-size: 9px; margin-top: 15px; opacity: 0.6; letter-spacing: 1px;">TAP TO SIMULATE</span>
                <div style="margin-top: 55px; width: 65px; height: 65px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; border: 1px solid #444;">
                     <span style="color: #50C878; font-size: 26px; font-weight: bold;">@</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        function toggleIphone() {
            document.getElementById('iphone-mockup').classList.toggle('iphone-active');
        }
    </script>
</body>
</html>
