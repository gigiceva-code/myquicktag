
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>MYQUICKTAG – Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #050505;
      --text: #ffffff;
      --accent: #00c896; /* verde smeraldo */
      --card: #111111;
      --muted: #888888;
      --border: #1f1f1f;
      --button-bg: #181818;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #101010 0, #000000 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .hero {
      max-width: 1100px;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
      gap: 48px;
      align-items: center;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }

    .logo-mark {
      width: 56px;
      height: 56px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #00ffbf, #007a52);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 24px rgba(0, 200, 150, 0.6);
    }

    .logo-mark span {
      font-size: 28px;
      font-weight: 700;
      color: #000;
    }

    h1 {
      font-size: clamp(2.6rem, 4vw, 3.4rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--accent);
      margin-bottom: 32px;
    }

    .headline-block {
      margin-top: 32px;
      line-height: 1.25;
      font-weight: 600;
      font-size: 1.4rem;
      text-transform: uppercase;
    }

    .headline-block span {
      display: block;
    }

    .headline-block span:nth-child(1) {
      color: #f5f5f5;
    }

    .headline-block span:nth-child(2) {
      color: #d0d0d0;
    }

    .headline-block span:nth-child(3) {
      color: var(--accent);
    }

    .phone-wrapper {
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 280px;
      max-width: 100%;
      aspect-ratio: 9 / 19;
      border-radius: 32px;
      padding: 18px 14px;
      background: radial-gradient(circle at top, #1a1a1a 0, #050505 55%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04),
        0 24px 60px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
    }

    .phone-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 18px;
      background: #000;
      border-radius: 999px;
    }

    .phone-inner {
      margin-top: 32px;
      padding: 18px 14px 14px;
      border-radius: 22px;
      background: linear-gradient(145deg, #050505, #151515);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .tag {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .tag span {
      color: var(--accent);
    }

    .tag-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin-top: 2px;
    }

    .social-main {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, #0b5cff, #00c896);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .social-main span:first-child {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .social-main-icon {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
    }

    .social-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 10px;
    }

    .social-pill {
      border-radius: 999px;
      padding: 6px 0;
      background: var(--button-bg);
      border: 1px solid var(--border);
      font-size: 0.65rem;
      text-align: center;
      color: #f0f0f0;
    }

    .social-pill:nth-child(2) {
      color: #00f2ea;
    }

    .social-pill:nth-child(3) {
      color: #1da1f2;
    }

    .social-pill:nth-child(4) {
      color: #ff4500;
    }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
    }

    .qr {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: repeating-linear-gradient(
          45deg,
          #ffffff,
          #ffffff 2px,
          #000000 2px,
          #000000 4px
        );
      overflow: hidden;
      position: relative;
    }

    .qr::after {
      content: "";
      position: absolute;
      inset: 10px;
      background: #000;
      mix-blend-mode: multiply;
    }

    .verified {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #00ffbf, #007a52);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 1rem;
      box-shadow: 0 0 16px rgba(0, 200, 150, 0.7);
    }

    .verified span {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="hero">
    <!-- Colonna testo -->
    <section>
      <div class="logo-mark">
        <span>@</span>
      </div>

      <h1>MYQUICKTAG</h1>
      <p class="subtitle">premium digitalbtag</p>

      <div class="headline-block">
        <span>Immagina la tua identità così.</span>
        <span>Un mondo dove il tuo nome</span>
        <span>è il tuo nome nel mondo.</span>
      </div>
    </section>

    <!-- Colonna telefono -->
    <section class="phone-wrapper">
      <div class="phone">
        <div class="phone-notch"></div>

        <div class="phone-inner">
          <div>
            <div class="avatar">@</div>
            <div class="tag">
              <span>@</span>ILTUOTAG
            </div>
            <div class="tag-label">Identità digitale</div>
          </div>

          <div class="social-main">
            <span>
              <span class="social-main-icon">f</span>
              iltuonome
            </span>
            <span>Facebook</span>
          </div>

          <div class="social-row">
            <div class="social-pill">Facebook</div>
            <div class="social-pill">TikTok</div>
            <div class="social-pill">Twitter</div>
            <div class="social-pill">Reddit</div>
          </div>

          <div class="bottom-row">
            <div class="qr"></div>
            <div class="verified">
              <span>✓</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
