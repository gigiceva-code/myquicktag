<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag - Ottieni il tuo @nome</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-black text-white font-sans">

    <div class="max-w-md mx-auto pt-20 px-6">
        <h1 class="text-4xl font-bold text-center mb-10">Un @nome. Una sola identità.</h1>
        
        <div class="bg-zinc-900 p-8 rounded-3xl border border-zinc-800">
            <div class="flex items-center gap-3 mb-6">
                <span class="text-3xl text-blue-500">@</span>
                <input id="tagInput" type="text" placeholder="iltuonome" 
                       class="bg-transparent text-2xl font-semibold focus:outline-none w-full text-white">
            </div>

            <div class="mt-8 mb-6">
                <label class="block text-sm text-zinc-400 mb-2 font-medium">La tua email (per ricevere il tuo tag)</label>
                <input id="userEmail" type="email" placeholder="esempio@mail.com" 
                       class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-lg focus:border-blue-500 outline-none text-white">
            </div>

            <button onclick="checkAndClaim()" 
                    class="w-full bg-white text-black py-5 rounded-2xl text-xl font-bold hover:bg-zinc-200 transition">
                Verifica e Attiva
            </button>
            
            <p id="statusMsg" class="mt-4 text-center text-sm"></p>
        </div>
    </div>

    <script>
        const AIRTABLE_PAT = "patYjNPr7D7z5fLgW.5432d4b971165e317072e92c286567849e75529f7902911b338384f683f12445"; 
        const BASE_ID = "appG2S8jV9Ams3wYq";
        const TABLE_NAME = "Tabella 1";

        async function checkAndClaim() {
            const nome = document.getElementById('tagInput').value.trim().toLowerCase();
            const email = document.getElementById('userEmail').value.trim();
            const msg = document.getElementById('statusMsg');

            if (!nome || !email) {
                alert("Inserisci sia il nome che l'email!");
                return;
            }

            msg.innerText = "Controllo disponibilità...";
            msg.className = "mt-4 text-center text-sm text-zinc-500";

            try {
                const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={nome}='${nome}'`;
                const response = await fetch(url, {
                    headers: { Authorization: `Bearer ${AIRTABLE_PAT}` }
                });
                const data = await response.json();

                if (data.records && data.records.length > 0) {
                    msg.innerText = `❌ @${nome} è già occupato`;
                    msg.className = "mt-4 text-center text-sm text-red-500";
                } else {
                    saveToAirtable(nome, email);
                }
            } catch (e) {
                msg.innerText = "Errore di connessione. Riprova.";
            }
        }

        async function saveToAirtable(nome, email) {
            try {
                const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}`, {
                    method: 'POST',
                    headers: {
                        Authorization: `Bearer ${AIRTABLE_PAT}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fields: {
                            "nome": nome,
                            "email": email,
                            "Data_Inizio": new Date().toISOString().split('T')[0]
                        }
                    })
                });

                if (response.ok) {
                    showSuccessModal(nome);
                } else {
                    const errorData = await response.json();
                    console.error(errorData);
                    alert("Errore Airtable: " + (errorData.error.message || "riprova"));
                }
            } catch (e) {
                alert("Errore di rete.");
            }
        }

        function showSuccessModal(nome) {
            const successHTML = `
                <div class="fixed inset-0 bg-black/95 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                    <div class="bg-zinc-900 border border-zinc-800 rounded-[40px] max-w-md w-full p-10 text-center shadow-2xl">
                        <div class="text-7xl mb-6">🎉</div>
                        <h2 class="text-4xl font-bold mb-2 text-white">Complimenti!</h2>
                        <p class="text-emerald-400 text-2xl mb-8 font-semibold">@${nome} è tuo</p>
                        <p class="text-zinc-400 mb-10 leading-relaxed">La tua identità digitale è stata creata.</p>
                        <button onclick="window.location.href='profile.html?nome=${nome}'" 
                                class="w-full bg-white text-black py-6 rounded-3xl text-xl font-bold mb-4">
                            Vedi il mio profilo
                        </button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', successHTML);
        }
    </script>
</body>
</html>
