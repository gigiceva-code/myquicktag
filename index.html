<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyQuickTag</title>

<style>
body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
}
input {
    padding: 15px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    width: 200px;
    text-align: center;
}
button {
    padding: 15px 25px;
    background: #50C878;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    margin-top: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>MYQUICKTAG</h1>
<p style="color:#50C878;">Premium Digital Tag</p>

<input id="tagInput" placeholder="@nome">
<br>
<button onclick="go()">Verifica</button>

<script>
function go(){
    let val = document.getElementById("tagInput").value.replace("@","");
    if(!val) return alert("Inserisci un nome");
    window.location.href = "tag.html?nome=" + val;
}
</script>

</body>
</html>
