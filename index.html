<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag | Premium Digital Tag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --smeraldo: #50C878;
            --smeraldo-glow: rgba(80, 200, 120, 0.3);
            --nero-assoluto: #050505;
            --grigio-soffuso: #666;
            --bianco-luxury: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--nero-assoluto);
            color: var(--bianco-luxury);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background: radial-gradient(circle at center, #0a1f14 0%, var(--nero-assoluto) 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header { padding: 30px 5%; max-width: 1200px; margin: 0 auto; width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .logo-box { text-align: center; flex-grow: 1; }
        .title { font-weight: 100; letter-spacing: 10px; font-size: 1.4rem; text-transform: uppercase; margin: 5px 0; }
        .slogan-top { color: var(--smeraldo); font-size: 0.7rem; letter-spacing: 5px; text-transform: uppercase; font-weight: 400; }
        .menu-hamburger { width: 30px; cursor: pointer; }
        .menu-hamburger span { display: block; height: 1px; background: var(--bianco-luxury); margin: 6px 0; transition: 0.3s; }
        .menu-hamburger span:nth-child(2) { width: 18px; }
        .user-icon { width: 30px; text-align: right; opacity: 0.7; }
        .main-stage { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        @keyframes pulseRespiro {
            0% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 20px var(--bianco-luxury); }
            100% { transform: scale(1); opacity: 0.4; }
        }
        .trigger-pallino { width: 10px; height: 10px; background: var(--bianco-luxury); border-radius: 50%; position: absolute; top: 80px; left: 50%; transform: translateX(-50%); z-index: 10; animation: pulseRespiro 4s infinite ease-in-out; }
        .iphone-frame { position: relative; width: 320px; height: 650px; background: #000; border: 8px solid #1a1a1a; border-radius: 50px; box-shadow: 0 0 50px rgba(0,0,0,0.9); overflow: hidden; display: flex; flex-direction: column; }
        .screen { padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100%; }
        .notch { width: 120px; height: 25px; background: #1a1a1a; border-radius: 0 0 15px 15px; margin-bottom: 30px; }
        .avatar { width: 80px; height: 80px; background: #111; border-radius: 50%; margin-bottom: 15px; border: 1px solid #222; display: flex; align-items: center; justify-content: center; }
        .input-box { width: 100%; background: #0a0a0a; border: 1px solid #222; border-radius: 15px; padding: 12px; display: flex; align-items: center; gap: 10px; margin-top: auto; }
        input { background: transparent; border: none; color: white; outline: none; width: 100%; font-family: 'Inter'; font-size: 0.9rem; }
        .btn-verify { width: 100%; background: var(--smeraldo); color: black; border: none; padding: 15px; border-radius: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-top: 15px; cursor: pointer; transition: 0.3s; font-size: 0.8rem; }
        .btn-verify:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--smeraldo-glow); }
        .social-placeholder { color: #333; font-size: 0.7rem; letter-spacing: 2px; margin: 20px 0; }
    </style>
</head>
<body>

<header style="display: flex; justify-content: space-between; align-items: center; padding: 40px 5% 20px 5%; max-width: 1200px; margin: 0 auto 40px auto; flex-wrap: nowrap;">
    <div style="width: 30px; cursor: pointer; flex-shrink: 0;">
        <div style="height: 1px; background: white; margin: 6px 0; width: 25px;"></div>
        <div style="height: 1px; background: white; margin: 6px 0; width: 15px;"></div>
        <div style="height: 1px; background: white; margin: 6px 0; width: 25px;"></div>
    </div>

    <div style="text-align: center; flex-grow: 1; min-width: 200px;">
        <svg width="60" height="60" viewBox="0 0 100 100" style="margin-bottom: 15px;">
            <circle cx="50" cy="50" r="40" stroke="#50C878" stroke-width="2.5" fill="none" />
            <path d="M50 32C40 32 32 40 32 50C32 60 40 68 50 68C53.5 68 56.5 66.5 58.5 64.5V68L65 74.5" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <circle cx="50" cy="50" r="10" stroke="white" stroke-width="2.5" fill="none"/>
        </svg>
        <h1 style="font-weight: 100; letter-spacing: 6px; font-size: 1.1rem; text-transform: uppercase; color: white; margin: 0; white-space: nowrap; font-family: 'Inter', sans-serif;">MY QUICK TAG</h1>
        <p style="color: #50C878; font-size: 0.55rem; letter-spacing: 3px; text-transform: uppercase; font-weight: 400; margin-top: 8px; white-space: nowrap;">INSTANT DIGITAL IDENTITY</p>
    </div>

    <div style="width: 30px; text-align: right; flex-shrink: 0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.2" style="opacity: 0.5;">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
    </div>
</header>
<div class="main-stage">
    <div class="iphone-frame">
        <div class="trigger-pallino"></div>
    <div class="screen" style="width: 100%; padding: 20px; display: flex; flex-direction: column; align-items: center; flex-grow: 1;">
                
                <div style="width: 100px; height: 25px; background: #000; border-radius: 0 0 15px 15px; margin-bottom: 20px; margin-top: -20px;"></div>

                <div style="width: 70px; height: 70px; background: #222; border-radius: 50%; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; border: 1px solid #333;">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#50C878" stroke-width="1.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>

                <div id="display-name" style="font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; color: white; margin-bottom: 5px;">@ILTUNOME</div>
                <div style="font-size: 0.6rem; color: #50C878; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px;">Identità Digitale</div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 20px;">
                    <div style="background: rgba(80, 200, 120, 0.05); border: 1px solid rgba(80, 200, 120, 0.2); padding: 10px; border-radius: 12px; display: flex; align-items: center; gap: 8px;">
                        <span style="color: #50C878; font-size: 0.65rem; font-weight: bold;">Instagram</span>
                        <span style="color: #444; font-size: 0.6rem;">----</span>
                    </div>
                    <div style="background: rgba(80, 200, 120, 0.05); border: 1px solid rgba(80, 200, 120, 0.2); padding: 10px; border-radius: 12px; display: flex; align-items: center; gap: 8px;">
                        <span style="color: #50C878; font-size: 0.65rem; font-weight: bold;">TikTok</span>
                        <span style="color: #444; font-size: 0.6rem;">----</span>
                    </div>
                </div>

                <div style="width: 100%; background: #111; border: 1px solid #222; padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 20px;">
                    <div style="color: #666; font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase;">Curriculum Vitae Pre-set</div>
                </div>

                <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: auto; margin-bottom: 20px; width: 100%;">
                    <div style="width: 70px; height: 70px; background: rgba(80, 200, 120, 0.1); border: 1px solid #50C878; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                        <svg width="45" height="45" viewBox="0 0 24 24" fill="none" stroke="#50C878" stroke-width="1.5">
                            <path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM10 3h1v1h-1zM10 8h1v1h-1z"/>
                        </svg>
                    </div>
                    <div style="width: 40px; height: 40px; border: 1px solid #50C878; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#50C878" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                    </div>
                </div>

                <div style="width: 100%; background: #000; border: 1px solid #333; border-radius: 20px; padding: 12px; display: flex; align-items: center; gap: 10px;">
                    <span style="color: #50C878;">@</span>
                    <input type="text" id="tag-input" placeholder="digita il tuo nome unico..." style="background: transparent; border: none; color: white; font-size: 0.8rem; width: 100%; outline: none;">
                </div>
                
                <button onclick="checkAvailability()" style="width: 100%; background: #50C878; border: none; padding: 15px; border-radius: 20px; color: black; font-weight: 800; text-transform: uppercase; font-size: 0.8rem; margin-top: 10px; cursor: pointer; box-shadow: 0 0 20px rgba(80, 200, 120, 0.4);">
                    Verifica Disponibilità
                </button>
            </div> 
</div>

<footer style="padding: 20px; text-align: center; font-size: 0.6rem; color: #222; letter-spacing: 2px;">
    PRIVACY & COOKIE POLICY | TERMS OF SERVICE
</footer>

<script>
    const input = document.getElementById('tag-input');
    const display = document.getElementById('display-name');

    input.addEventListener('input', (e) => {
        let val = e.target.value.toLowerCase().replace(/\s/g, '');
        display.innerText = val ? `@${val}` : '@iltuonome';
    });

    async function checkTag() {
        const val = input.value;
        if(!val) return;
        alert("Verifica in corso per: " + val + ". Benvenuto nel Lusso Digitale.");
        // Qui collegheremo Airtable nel prossimo step
    }
</script>

</body>
</html>
