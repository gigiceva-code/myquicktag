<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyQuickTag - Un mondo dentro il tuo nome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    
    /* Pulsazione ancora più lenta (6s) e molto più luminosa (da 1 a 0.6) */
    .pulse-zen {
      animation: pulseZen 6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulseZen {
      0%, 100% { opacity: 1; filter: brightness(100%); }
      50% { opacity: 0.6; filter: brightness(90%); }
    }

    .input-group:focus-within {
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
    }
    .input-group:focus-within .at-symbol {
      color: white;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex flex-col justify-between overflow-hidden">

  <header class="w-full p-6 flex justify-between items-center z-50">
    <div class="w-8 h-8"></div> <h1 class="text-3xl font-black tracking-tighter italic uppercase">MyQuickTag</h1>
    <button class="text-white text-3xl focus:outline-none active:scale-95 transition-all">
      <i class="fas fa-bars"></i>
    </button>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center p-6 text-center">
    
    <div class="pulse-zen mb-10 w-full max-w-sm">
      <p class="text-xl text-white font-medium leading-tight">Un mondo dentro il tuo nome</p>
      <p class="text-xl text-white/90 font-medium leading-tight italic">Il tuo nome nel mondo</p>
    </div>

    <div class="w-full max-w-[280px] bg-[#121212] border border-zinc-800 rounded-[2rem] p-2 shadow-3xl transition-all duration-500 input-group">
      <div class="flex items-center px-5 py-3 border-b border-zinc-800/50">
        <span class="text-2xl font-bold text-zinc-600 transition-all duration-500 at-symbol">@</span>
        <input id="searchInput" type="text" placeholder="iltuonome" 
               class="flex-1 bg-transparent outline-none text-lg ml-1 text-white font-semibold uppercase placeholder-zinc-800 tracking-tight">
      </div>
      <button onclick="checkName()" 
              class="w-full bg-white text-black font-extrabold py-3.5 mt-2 rounded-[1.5rem] text-lg hover:bg-zinc-200 transition-all active:scale-95 duration-150 shadow-lg">
        Verifica
      </button>
    </div>
    
    <p id="status" class="mt-8 text-xs font-black uppercase tracking-[0.3em] min-h-[20px] text-zinc-600"></p>
  </main>

  <footer class="pb-10"></footer>

  <script src="https://kit.fontawesome.com/your-code.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <script>
    const AIRTABLE_PAT = "patWfr8e2nM0vvhtR.69b3beff785c42c9d59a6d1f898023a16ce907f43e22716d94b497eef8dec54c";
    const BASE_ID = "appG2S8jV9Ams3wYq";
    const TABLE_NAME = "Tabella 1";

    async function checkName() {
      let input = document.getElementById('searchInput').value.trim();
      const status = document.getElementById('status');
      if (!input) return;

      input = input.replace('@', '').replace(/\s+/g, '').toLowerCase();
      status.innerHTML = '<span class="animate-pulse text-zinc-600">Analisi identità...</span>';

      try {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={nome}='${input}'`;
        const response = await fetch(url, { headers: { Authorization: `Bearer ${AIRTABLE_PAT}` } });
        const data = await response.json();

        if (data.records && data.records.length > 0) {
          status.innerHTML = '<span class="text-red-600">❌ Già occupato</span>';
        } else {
          status.innerHTML = '<span class="text-emerald-500">✨ Disponibile!</span>';
          setTimeout(() => { window.location.href = `tag.html?nome=${input}`; }, 700);
        }
      } catch (e) {
        status.innerHTML = 'Errore di connessione';
      }
    }

    document.getElementById('searchInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') checkName();
    });
  </script>
</body>
</html>
