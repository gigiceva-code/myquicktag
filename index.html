<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MyQuickTag</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, system-ui, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* L'EQUILIBRIO ORIGINALE */
        /* Scala 1.55: si allarga bene ma non invade il logo */
        .iphone-active { 
            transform: scale(1.55) !important; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.9); 
            z-index: 100;
        }

        #iphone-mockup {
            width: 145px; /* Allargato come richiesto */
            height: 290px; /* Altezza proporzionata originale */
            background: #1a1a1a;
            border: 3px solid #333;
            border-radius: 30px;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            will-change: transform;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div style="position: relative; width: 70px; height: 70px; margin-top: 20px; margin-bottom: 10px;">
            <div style="width: 100%; height: 100%; border: 6px solid #50C878; border-radius: 50%; box-sizing: border-box;"></div>
            <div style="position: absolute; width: 6px; height: 20px; background: #50C878; bottom: -2px; right: -2px; transform: rotate(-45deg); border-radius: 3px;"></div>
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); color: #fff; font-size: 34px; font-weight: bold;">@</div>
        </div>

        <h1 style="font-size: 28px; font-weight: 900; margin: 0; text-transform: uppercase;">MYQUICKTAG</h1>
        <p style="color: #50C878; font-size: 12px; font-weight: 600; letter-spacing: 2px; margin-top: 5px; margin-bottom: 30px; text-transform: uppercase;">Istant Digital Identity</p>

        <div style="position: relative; display: flex; flex-direction: column; align-items: center; min-height: 400px; width: 100%; justify-content: center; padding-bottom: 40px;">
            <span style="color: #50C878; font-size: 10px; letter-spacing: 2px; margin-bottom: 15px; opacity: 0.8;">TAP TO SIMULATE</span>
            
            <div id="iphone-mockup" onclick="toggleIphone()">
                <div style="width: 45px; height: 12px; background: #000; border-radius: 6px; margin-top: 10px;"></div>
                <div style="margin-top: 65px; width: 65px; height: 65px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; border: 1px solid #444;">
                     <span style="color: #50C878; font-size: 26px; font-weight: bold;">@</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleIphone() {
            document.getElementById('iphone-mockup').classList.toggle('iphone-active');
        }
    </script>
</body>
</html>
