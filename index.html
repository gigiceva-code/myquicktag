<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag</title>
    <style>
        /* RESET E SFONDO LUXURY */
        body {
            background-color: #000000; /* Nero Assoluto */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Inizia dall'alto */
            min-height: 100vh;
            font-family: sans-serif;
            color: #ffffff;
            padding-top: 60px; /* Spazio iniziale dall'alto */
        }

        /* CONTENITORE PRINCIPALE PER I PEZZI CHE AGGIUNGEREMO */
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* QUI ANDRANNO I CODICI DEI SINGOLI BLOCCHI */
    </style>
</head>
<body>

    <div class="container">
<div style="position: relative; width: 80px; height: 80px; margin-bottom: 15px;">
    <div style="width: 100%; height: 100%; border: 8px solid #50C878; border-radius: 50%; box-sizing: border-box;"></div>
    <div style="position: absolute; width: 8px; height: 28px; background: #50C878; bottom: -8px; right: 4px; transform: rotate(-45deg); border-radius: 4px;"></div>
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); color: #ffffff; font-family: sans-serif; font-size: 45px; font-weight: bold;">@</div>
</div>

<h1 style="color: #ffffff; font-family: sans-serif; font-size: 32px; font-weight: 900; letter-spacing: 1px; margin: 0; text-transform: uppercase;">
    MYQUICKTAG
</h1>
<p style="color: #50C878; font-family: sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; margin-top: 5px; text-transform: uppercase;">
    PREMIUM DIGITAL TAG
</p>

<div style="margin: 20px 0; position: relative; display: flex; flex-direction: column; align-items: center;">
    <span style="color: #50C878; font-family: sans-serif; font-size: 9px; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; opacity: 0.8;">
        Tap to Simulate
    </span>
    <div style="position: absolute; width: 100px; height: 180px; background: rgba(80, 200, 120, 0.15); border-radius: 30px; filter: blur(20px); animation: pulse 2s infinite ease-in-out; z-index: 0; top: 25px;"></div>
    
    <div id="iphone-mockup" onclick="toggleIphone()" style="position: relative; width: 110px; height: 220px; background: #1a1a1a; border: 3px solid #333; border-radius: 22px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); cursor: pointer; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; overflow: hidden; display: flex; flex-direction: column; align-items: center;">
        <div style="width: 35px; height: 10px; background: #000; border-radius: 5px; margin-top: 6px;"></div>
        <div style="margin-top: 35px; width: 45px; height: 45px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; border: 1px solid #444;">
             <span style="color: #50C878; font-size: 18px; font-weight: bold;">@</span>
        </div>
    </div>
</div>

<style>
    @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.5; }
        50% { transform: scale(1.05); opacity: 0.8; }
        100% { transform: scale(0.95); opacity: 0.5; }
    }
    .iphone-active {
        transform: scale(2.3) !important;
        z-index: 100 !important;
        margin-top: 100px !important;
        margin-bottom: 100px !important;
    }
</style>

<script>
    function toggleIphone() {
        const phone = document.getElementById('iphone-mockup');
        phone.classList.toggle('iphone-active');
    }
</script>

    </div> </body>
</html>
