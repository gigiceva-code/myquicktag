<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag | Premium Digital Tag</title>
    <meta name="description" content="Verifica la tua identità digitale esclusiva.">
    
    <style>
        :root { --smeraldo: #50C878; --nero-profondo: #050505; }
        body { 
            background: radial-gradient(circle at center, #0a1f12 0%, #050505 100%); 
            color: white; font-family: 'Inter', sans-serif; margin: 0; height: 100vh; overflow: hidden; 
            display: flex; flex-direction: column;
        }
        header { display: flex; justify-content: space-between; padding: 20px 40px; align-items: center; }
        .logo { font-weight: 200; letter-spacing: 5px; }
        .iphone-frame { 
            width: 280px; height: 500px; border: 8px solid #1a1a1a; border-radius: 40px; 
            margin: 20px auto; position: relative; background: black; 
            display: flex; flex-direction: column; align-items: center; 
            box-shadow: 0 0 50px rgba(80,200,120,0.1); 
        }
        .check-dot { 
            width: 15px; height: 15px; background: white; border-radius: 50%; 
            margin: 20px auto; animation: pulse 4s infinite; cursor: pointer; 
        }
        @keyframes pulse { 
            0%, 100% { transform: scale(1); opacity: 0.5; } 
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 15px var(--smeraldo); } 
        }
        .external-cta { text-align: center; padding-bottom: 40px; }
        input { 
            background: transparent; border: none; border-bottom: 1px solid #333; 
            color: white; padding: 10px; text-align: center; width: 250px; 
            outline: none; font-size: 1.1rem; text-transform: lowercase;
        }
        .btn-verifica { 
            background: var(--smeraldo); color: black; border: none; 
            padding: 15px 40px; border-radius: 5px; font-weight: bold; 
            margin-top: 20px; cursor: pointer; transition: 0.3s;
        }
        .btn-verifica:disabled { background: #333; color: #666; cursor: not-allowed; }
        #status-msg { margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <div class="logo">MY QUICK TAG</div>
</header>

<div class="main-container" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
    <div class="iphone-frame">
        <div style="margin-top:40px; font-size:0.7rem; letter-spacing:3px; color:rgba(255,255,255,0.4);">PREMIUM DIGITAL TAG</div>
        <div id="display-name" style="margin-top:30px; font-size:1.5rem; font-weight:100;">@iltuonome</div>
        <div class="check-dot"></div>
    </div>

    <div class="external-cta">
        <input type="text" placeholder="Digita il tuo nome..." id="name-input">
        <br>
        <button class="btn-verifica" id="btn-verifica">VERIFICA</button>
        <div id="status-msg"></div>
    </div>
</div>

<script>
    // CREDENZIALI INTEGRATE (Punto Zero Operativo)
    const AIRTABLE_TOKEN = "patAnfD8O0FfKWhZc.854657155050f24025d57d5985868875385657454c504a554a5a544a42534c56"; // Il tuo Token
    const BASE_ID = "appU6N1v9pYk0WfM3"; // Il tuo Base ID
    const TABLE_NAME = "Table 1";

    const input = document.getElementById('name-input');
    const display = document.getElementById('display-name');
    const btn = document.getElementById('btn-verifica');
    const statusMsg = document.getElementById('status-msg');

    input.addEventListener('input', (e) => {
        let val = e.target.value.toLowerCase().replace(/\s/g, '');
        display.innerText = val ? '@' + val : '@iltuonome';
        statusMsg.innerText = '';
    });

    btn.addEventListener('click', async () => {
        const nome = input.value.trim().toLowerCase();
        if (!nome) return;

        btn.disabled = true;
        btn.innerText = "CONTROLLO...";
        statusMsg.style.color = "white";
        statusMsg.innerText = "Interrogazione database...";

        try {
            // Formula Airtable per cercare il nome esatto
            const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={Nome}='${nome}'`;
            
            const response = await fetch(url, {
                headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` }
            });

            const data = await response.json();

            if (data.records && data.records.length > 0) {
                statusMsg.style.color = "#ff4444";
                statusMsg.innerText = "Spiacente, nome già occupato.";
            } else {
                statusMsg.style.color = "#50C878";
                statusMsg.innerText = "Identità disponibile! Sblocco offerta...";
                // Qui potremo inserire la transizione fluida verso la fase successiva
            }
        } catch (err) {
            statusMsg.style.color = "#ff4444";
            statusMsg.innerText = "Errore di connessione. Riprova.";
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerText = "VERIFICA";
        }
    });
</script>
</body>
</html>
