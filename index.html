<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag | Identity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .text-smeraldo { color: #00C896; }
        .bg-smeraldo { background-color: #00C896; }
        .border-smeraldo { border-color: #00C896; }
        
        .logo-q { font-weight: 900; }

        /* Respiro più fluido */
        @keyframes luxuryPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.98); }
        }
        .animate-respiro { animation: luxuryPulse 4s infinite ease-in-out; }

        /* Ingresso Smooth */
        @keyframes entrance {
            from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .play-entrance { opacity: 0; animation: entrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .iphone-frame {
            position: relative; width: 200px; height: 400px; margin: 0 auto;
            border: 8px solid #141414; border-radius: 32px; background: #050505;
            box-shadow: 0 0 40px rgba(0, 200, 150, 0.08);
        }
        
        /* Input Glow Focus */
        .input-container:focus-within {
            box-shadow: 0 0 20px rgba(0, 200, 150, 0.15);
            border-color: #00C896;
        }

        .btn-loading {
            background: linear-gradient(90deg, #111 0%, #1a1a1a 50%, #111 100%);
            background-size: 200% 100%;
            animation: loadingSwipe 2s infinite linear;
        }
        @keyframes loadingSwipe {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <header class="mb-8 play-entrance">
        <div class="text-2xl font-900 tracking-tighter uppercase italic">
            <span class="logo-q text-3xl text-smeraldo">Q</span>uick<span class="italic uppercase opacity-90">Tag</span>
        </div>
    </header>

    <div id="hero-phone" class="iphone-frame mb-8 play-entrance" style="animation-delay: 0.2s;">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-24 h-5 bg-[#141414] rounded-b-xl"></div>
        <div class="p-6 flex flex-col items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-[#111] border border-[#222] mt-10 shadow-inner"></div>
            <div class="w-20 h-2 bg-gray-800 rounded-full mb-4"></div>
            <div class="w-full h-8 bg-[#0a0a0a] border border-[#161616] rounded-lg"></div>
            <div class="w-full h-8 bg-[#0a0a0a] border border-[#161616] rounded-lg"></div>
            <div class="w-full h-8 bg-[#0a0a0a] border border-[#161616] rounded-lg"></div>
        </div>
    </div>

    <div class="mb-10 play-entrance" style="animation-delay: 0.4s;">
        <h1 class="text-2xl md:text-3xl font-900 uppercase leading-tight animate-respiro">
            Un mondo dentro <br> il tuo nome
        </h1>
        <p class="text-smeraldo font-900 tracking-[0.3em] text-[10px] uppercase mt-4">
            Instant Digital Identity
        </p>
    </div>

    <div class="w-full max-w-sm play-entrance" style="animation-delay: 0.6s;">
        <div class="input-container flex items-center bg-[#050505] rounded-full border-2 border-[#1a1a1a] p-1 transition-all duration-300 mb-4">
            <span class="pl-6 text-smeraldo font-bold text-2xl">@</span>
            <input type="text" id="tagInput" placeholder="ILTUONOME" autocomplete="off"
                class="w-full py-4 px-2 text-lg font-bold outline-none bg-transparent text-white uppercase placeholder:text-gray-800">
        </div>

        <button onclick="checkTag()" id="mainBtn" 
            class="w-full btn-loading text-gray-500 py-5 rounded-full font-900 text-lg transition-all uppercase tracking-widest cursor-not-allowed">
            Inizializzazione...
        </button>
        
        <p class="text-[10px] text-gray-500 mt-6 uppercase tracking-[0.2em] opacity-60">
            Il tuo link premium al costo di un caffè al mese
        </p>
    </div>

    <div class="fixed bottom-8 right-8 opacity-40 hover:opacity-100 transition-opacity" onclick="location.reload()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="2"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
    </div>

    <script>
        const btn = document.getElementById('mainBtn');
        const inputField = document.getElementById('tagInput');
        
        // Airtable Config (Attenzione: sposta queste logiche su un file .env o server-side appena puoi!)
        const AT_CFG = {
            t: 'pat7XmPCH9o7vNf1i.7f89d532168393539827059727409249765239103984732103',
            b: 'appLqZ8j4W7kP3G9W',
            s: 'Table 1'
        };

        // Ridotto a 3 secondi: l'utente moderno non aspetta 10 secondi
        setTimeout(() => {
            btn.innerText = "VERIFICA DISPONIBILITÀ";
            btn.classList.remove('btn-loading', 'text-gray-500', 'cursor-not-allowed');
            btn.classList.add('bg-smeraldo', 'text-black', 'hover:scale-[1.02]', 'active:scale-[0.98]');
            btn.style.cursor = "pointer";
        }, 3000);

        async function checkTag() {
            const rawValue = inputField.value.trim();
            if(!rawValue || btn.classList.contains('cursor-not-allowed')) return;

            const tag = rawValue.toLowerCase();
            btn.disabled = true;
            btn.innerText = "RICERCA IN CORSO...";
            
            const formula = encodeURIComponent(`{Tag}='@${tag}'`);
            const url = `https://api.airtable.com/v0/${AT_CFG.b}/${encodeURIComponent(AT_CFG.s)}?filterByFormula=${formula}`;

            try {
                const res = await fetch(url, { headers: { "Authorization": `Bearer ${AT_CFG.t}` } });
                const data = await res.json();
                
                if (data.records && data.records.length === 0) {
                    // Feedback successo prima del redirect
                    btn.classList.replace('bg-smeraldo', 'bg-white');
                    btn.innerText = "DISPONIBILE!";
                    setTimeout(() => {
                        window.location.href = `tag.html?nome=${encodeURIComponent(tag)}`;
                    }, 800);
                } else {
                    btn.innerText = "GIÀ PRESO. PROVA ALTRO";
                    btn.classList.replace('bg-smeraldo', 'bg-red-500');
                    setTimeout(() => {
                        btn.innerText = "VERIFICA DISPONIBILITÀ";
                        btn.classList.replace('bg-red-500', 'bg-smeraldo');
                        btn.disabled = false;
                    }, 2000);
                }
            } catch (e) {
                btn.innerText = "ERRORE CONNESSIONE";
                btn.disabled = false;
            }
        }

        // Trigger INVIO da tastiera
        inputField.addEventListener("keypress", (e) => {
            if (e.key === "Enter") checkTag();
        });
    </script>
</body>
</html>
