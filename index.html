<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag | Instant Digital Identity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; }
        .text-smeraldo { color: #00C896; }
        .bg-smeraldo { background-color: #00C896; }
        
        /* Logo Q con @ fusa */
        .logo-q { color: #00C896; font-weight: 900; }

        /* Animazione 1: Respiro Slogan (Paritario 100%) */
        @keyframes luxuryPulse {
            0%, 100% { opacity: 1; filter: brightness(100%); }
            50% { opacity: 0.3; filter: brightness(60%); }
        }
        .animate-respiro { animation: luxuryPulse 5s infinite ease-in-out; }

        /* Animazione 2: Ingresso Triggerata */
        @keyframes entrance {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .play-entrance { animation: entrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* iPhone Mockup Luxury */
        .iphone-frame {
            position: relative; width: 220px; height: 440px; margin: 0 auto;
            border: 10px solid #1a1a1a; border-radius: 38px; background: #000;
            box-shadow: 0 0 35px rgba(0, 200, 150, 0.12);
        }
        .notch {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 100px; height: 20px; background: #1a1a1a; border-bottom-left-radius: 14px; border-bottom-right-radius: 14px;
        }

        /* Freccia Bianca Pulsante */
        @keyframes arrowBounce {
            0%, 100% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(8px); opacity: 0.4; }
        }
        .arrow-down { animation: arrowBounce 1.5s infinite; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 12px solid white; margin: 15px auto; width: 0; }

        /* Tasto Reset Circolare */
        .btn-reset {
            position: fixed; bottom: 25px; right: 25px; width: 50px; height: 50px;
            border-radius: 50%; border: 1px solid #222; background: #000;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.4s; z-index: 50;
        }
        .btn-reset:hover { border-color: #00C896; transform: rotate(180deg); box-shadow: 0 0 15px rgba(0, 200, 150, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <header class="mb-6 play-entrance">
        <div class="text-3xl font-900 tracking-tighter uppercase italic">
            <span class="logo-q text-4xl">Q</span>uick<span class="text-smeraldo italic uppercase">Tag</span>
        </div>
    </header>

    <div id="hero-phone" class="iphone-frame mb-6 play-entrance" style="animation-delay: 0.2s;">
        <div class="notch"></div>
        <div class="p-6 flex flex-col items-center gap-4">
            <div class="w-16 h-16 rounded-full bg-[#0a0a0a] border border-[#222] mt-8 shadow-inner"></div>
            <div class="text-smeraldo text-[10px] font-bold tracking-widest uppercase">@preview</div>
            <div class="w-full h-10 bg-[#080808] border border-[#161616] rounded-xl"></div>
            <div class="w-full h-10 bg-[#080808] border border-[#161616] rounded-xl"></div>
        </div>
    </div>

    <div class="arrow-down mb-6"></div>

    <div class="mb-10 play-entrance" style="animation-delay: 0.4s;">
        <h1 class="text-2xl md:text-3xl font-900 uppercase leading-tight animate-respiro">
            Un mondo dentro <br> il tuo nome
        </h1>
        <h2 class="text-xl md:text-2xl font-700 uppercase text-gray-500 animate-respiro mt-1" style="animation-delay: 2.5s;">
            Il tuo nome nel mondo
        </h2>
        
        <p class="text-smeraldo font-900 tracking-[0.4em] text-[11px] uppercase mt-8">
            Instant Digital Identity
        </p>
    </div>

    <div class="w-full max-w-sm play-entrance" style="animation-delay: 0.6s;">
        <div class="flex items-center bg-[#000] rounded-full border-2 border-[#161616] p-1 focus-within:border-smeraldo transition-all duration-500 mb-4">
            <span class="pl-6 text-smeraldo font-bold text-2xl">@</span>
            <input type="text" id="tagInput" placeholder="ILTUONOME" 
                class="w-full py-4 px-2 text-lg font-bold outline-none bg-transparent text-white uppercase placeholder:text-gray-800">
        </div>

        <button onclick="checkTag()" id="mainBtn" 
            class="w-full bg-[#111] text-gray-600 py-5 rounded-full font-900 text-lg transition-all uppercase tracking-widest cursor-not-allowed">
            Attendere... (10s)
        </button>
        <p class="text-[10px] text-gray-600 mt-6 uppercase tracking-widest italic opacity-50">
            Tutti i tuoi link al prezzo di una colazione all'anno
        </p>
    </div>

    <div class="btn-reset" onclick="resetAnimation()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
    </div>

    <script>
        const btn = document.getElementById('mainBtn');
        // CREDENZIALI BLINDATE
        const AIRTABLE_TOKEN = 'pat7XmPCH9o7vNf1i.7f89d532168393539827059727409249765239103984732103'; 
        const BASE_ID = 'appLqZ8j4W7kP3G9W';
        const TABLE_NAME = 'Table 1'; // AGGIORNATO COME RICHIESTO

        // Timer di sicurezza (10 secondi)
        setTimeout(() => {
            btn.innerText = "VERIFICA";
            btn.classList.remove('bg-[#111]', 'text-gray-600', 'cursor-not-allowed');
            btn.classList.add('bg-smeraldo', 'text-black', 'shadow-[0_15px_30px_rgba(0,200,150,0.2)]');
            btn.style.cursor = "pointer";
        }, 10000);

        function resetAnimation() {
            const elements = document.querySelectorAll('.play-entrance');
            elements.forEach(el => {
                el.style.animation = 'none';
                el.offsetHeight; 
                el.style.animation = null;
            });
        }

        async function checkTag() {
            if(btn.innerText.includes("Attendere")) return;
            const input = document.getElementById('tagInput').value.trim().toLowerCase();
            if(!input) return;

            btn.disabled = true;
            btn.innerText = "CONTROLLO...";
            
            // Query esatta per Table 1
            const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={Tag}='@${input}'`;

            try {
                const response = await fetch(url, { headers: { "Authorization": `Bearer ${AIRTABLE_TOKEN}` } });
                const data = await response.json();
                
                if (data.records && data.records.length === 0) {
                    window.location.href = `tag.html?nome=${encodeURIComponent(input)}`;
                } else {
                    alert("Questo Tag è già riservato. Prova un altro!");
                    btn.disabled = false;
                    btn.innerText = "VERIFICA";
                }
            } catch (e) {
                console.error(e);
                alert("Errore di connessione al database.");
                btn.disabled = false;
                btn.innerText = "VERIFICA";
            }
        }
    </script>
</body>
</html>
