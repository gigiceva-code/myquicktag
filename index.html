<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag | Digital Identity</title>
    <style>
        :root {
            --neon-green: #00df82;
            --dark-bg: #000000;
            --iphone-black: #0b0b0b;
        }

        body {
            margin: 0;
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* LOGO E HEADER */
        .header { text-align: center; margin-bottom: 20px; }
        .logo-q {
            width: 80px;
            height: 80px;
            border: 3px solid var(--neon-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--neon-green);
            margin: 0 auto 10px;
            box-shadow: 0 0 15px rgba(0, 223, 130, 0.3);
        }
        .brand-name { font-weight: 800; letter-spacing: 6px; font-size: 22px; margin: 5px 0; }
        .slogan { color: var(--neon-green); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }

        /* SIMULATORE IPHONE */
        .iphone {
            width: 300px;
            height: 600px;
            background: var(--iphone-black);
            border: 8px solid #1f1f1f;
            border-radius: 45px;
            position: relative;
            padding: 20px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dynamic-island {
            width: 80px;
            height: 25px;
            background: #000;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 85px;
            height: 85px;
            background: #222;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .user-id { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
        .sub-text { font-size: 10px; color: #555; text-transform: uppercase; margin-bottom: 25px; }

        /* VERIFICA INTERNA */
        .status-bar-green {
            width: 100%;
            background: var(--neon-green);
            color: #000;
            border-radius: 8px;
            padding: 8px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        /* GRID SOCIAL */
        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .social-item {
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            padding: 6px;
            font-size: 9px;
            color: var(--neon-green);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* PIN / PASSWORD */
        .pin-container {
            margin-top: 20px;
            width: 60%;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            letter-spacing: 5px;
            font-size: 18px;
        }

        /* QR CODE */
        .qr-section {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 10px;
        }
        .qr-box {
            width: 80px;
            height: 80px;
            border: 2px solid var(--neon-green);
            padding: 5px;
        }

        /* TESTO ESTERNO */
        .external-text { text-align: center; margin-top: 25px; }
        .ext-1 { font-style: italic; font-size: 12px; color: #888; }
        .ext-2 { font-weight: 700; font-size: 16px; margin: 5px 0; text-transform: uppercase; }
        .ext-3 { font-weight: 300; letter-spacing: 2px; font-size: 13px; color: #bbb; }

        /* INPUT VERIFICA FINALE */
        .final-input-container {
            margin-top: 20px;
            width: 320px;
            position: relative;
        }
        .input-pill {
            width: 100%;
            background: #111;
            border: 1px solid #222;
            padding: 15px;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .btn-verify-neon {
            width: 100%;
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-q">@</div>
        <div class="brand-name">MY QUICK TAG</div>
        <div class="slogan">Instant Digital Identity</div>
    </div>

    <div class="iphone">
        <div class="dynamic-island"></div>
        <div class="avatar"></div>
        <div class="user-id">@ ILTUOTAG</div>
        <div class="sub-text">Identità Digitale</div>

        <div class="status-bar-green">
            <span>VERIFICA</span>
            <span>iltuonome</span>
        </div>

        <div class="social-grid">
            <div class="social-item">Facebook</div>
            <div class="social-item">TikTok</div>
            <div class="social-item">LinkedIn</div>
            <div class="social-item">Twitter</div>
            <div class="social-item">Reddit</div>
            <div class="social-item">Instagram</div>
        </div>

        <div class="pin-container">••••</div>

        <div class="qr-section">
            <div class="qr-box">
                <svg viewBox="0 0 100 100" fill="var(--neon-green)">
                    <rect x="10" y="10" width="20" height="20"/>
                    <rect x="70" y="10" width="20" height="20"/>
                    <rect x="10" y="70" width="20" height="20"/>
                    <rect x="40" y="40" width="20" height="20"/>
                </svg>
            </div>
            <div style="background: var(--neon-green); border-radius: 50%; padding: 5px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="black"><path d="M7 10l5 5 5-5H7z"/></svg>
            </div>
        </div>
    </div>

    <div class="external-text">
        <div class="ext-1">Immagina la tua identità così.</div>
        <div class="ext-2">Un mondo dentro il tuo nome</div>
        <div class="ext-3">Il tuo nome nel mondo</div>
    </div>

    <div class="final-input-container">
        <input type="text" class="input-pill" value="@ ILTUONOME" readonly>
        <button class="btn-verify-neon">VERIFICA</button>
    </div>

</body>
</html>
