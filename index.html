<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyQuickTag - Un mondo dentro il tuo nome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    
    /* Pulsazione rallentata del 50% (da 2s a 4s) */
    .pulse-slow {
      animation: pulseCustom 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulseCustom {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .input-group:focus-within {
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.03);
    }
    .input-group:focus-within .at-symbol {
      color: white;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex flex-col items-center justify-center p-6 overflow-hidden">

  <div class="w-full max-w-sm text-center">
    <h1 class="text-5xl font-black tracking-tighter mb-4 italic uppercase">MyQuickTag</h1>
    
    <div class="pulse-slow mb-12">
      <p class="text-lg text-zinc-400 font-medium leading-tight">Un mondo dentro il tuo nome</p>
      <p class="text-lg text-zinc-500 font-medium leading-tight italic">Il tuo nome nel mondo</p>
    </div>

    <div class="bg-[#141414] border border-zinc-800 rounded-[2.5rem] p-2 shadow-2xl transition-all duration-500 input-group">
      <div class="flex items-center px-6 py-5 border-b border-zinc-800/50">
        <span class="text-3xl font-bold text-zinc-700 transition-all duration-500 at-symbol">@</span>
        <input id="searchInput" type="text" placeholder="iltuonome" 
               class="flex-1 bg-transparent outline-none text-2xl ml-2 text-white font-semibold uppercase placeholder-zinc-800 tracking-tight">
      </div>
      <button onclick="checkName()" 
              class="w-full bg-white text-black font-extrabold py-5 mt-2 rounded-[1.8rem] text-xl hover:bg-zinc-200 transition-all active:scale-95 duration-150 shadow-lg">
        Verifica
      </button>
    </div>
    
    <p id="status" class="mt-8 text-xs font-black uppercase tracking-[0.3em] min-h-[20px] text-zinc-500"></p>
  </div>

  <script>
    const AIRTABLE_PAT = "patWfr8e2nM0vvhtR.69b3beff785c42c9d59a6d1f898023a16ce907f43e22716d94b497eef8dec54c";
    const BASE_ID = "appG2S8jV9Ams3wYq";
    const TABLE_NAME = "Tabella 1";

    async function checkName() {
      let input = document.getElementById('searchInput').value.trim();
      const status = document.getElementById('status');
      if (!input) return;

      input = input.replace('@', '').replace(/\s+/g, '').toLowerCase();
      status.innerHTML = '<span class="animate-pulse text-zinc-600">Analisi identità...</span>';

      try {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={nome}='${input}'`;
        const response = await fetch(url, { headers: { Authorization: `Bearer ${AIRTABLE_PAT}` } });
        const data = await response.json();

        if (data.records && data.records.length > 0) {
          status.innerHTML = '<span class="text-red-600">❌ Già occupato</span>';
        } else {
          status.innerHTML = '<span class="text-emerald-500">✨ Disponibile!</span>';
          setTimeout(() => { window.location.href = `tag.html?nome=${input}`; }, 700);
        }
      } catch (e) {
        status.innerHTML = 'Errore di connessione';
      }
    }

    document.getElementById('searchInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') checkName();
    });
  </script>
</body>
</html>
