<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> <title>MyQuickTag - Istant Digital Identity</title>
    <style>
        /* RESET LUXURY */
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; /* Font nativi premium */
            color: #ffffff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 600px; /* Compattezza mobile */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px; /* Aria laterale */
            box-sizing: border-box;
        }

        /* ANIMAZIONE IPHONE: ESPANSIONE CALIBRATA */
        /* Abbiamo aumentato la scala (da 1.6 a 1.95) e ridotto la traslazione (translateY) */
        /* per farlo espandere di più restando centrato, quasi a toccare i bordi. */
        .iphone-active { 
            transform: scale(1.95) translateY(5px) !important; 
            box-shadow: 0 50px 120px rgba(0,0,0,0.95) !important; 
            z-index: 100 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div style="position: relative; width: 80px; height: 80px; margin-top: 30px; margin-bottom: 10px;">
            <div style="width: 100%; height: 100%; border: 8px solid #50C878; border-radius: 50%; box-sizing: border-box;"></div>
            <div style="position: absolute; width: 8px; height: 25px; background: #50C878; bottom: -2px; right: -2px; transform: rotate(-45deg); border-radius: 4px;"></div>
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); color: #ffffff; font-size: 40px; font-weight: bold;">@</div>
        </div>

        <h1 style="font-size: 32px; font-weight: 900; letter-spacing: 1px; margin: 0; text-transform: uppercase; line-height: 1;">MYQUICKTAG</h1>
        
        <p style="color: #50C878; font-size: 13px; font-weight: 600; letter-spacing: 3px; margin-top: 6px; margin-bottom: 20px; text-transform: uppercase;">
            Istant Digital Identity
        </p>

        <div style="position: relative; display: flex; flex-direction: column; align-items: center; min-height: 480px; width: 100%; justify-content: center;">
            
            <span style="color: #50C878; font-size: 10px; letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase; opacity: 0.8; font-weight: 600;">
                Tap to Simulate
            </span>
            
            <div id="iphone-mockup" onclick="toggleIphone()" style="position: relative; width: 130px; height: 260px; background: #1a1a1a; border: 3px solid #333; border-radius: 26px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); cursor: pointer; transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1); /* Transizione più fluida e lenta */ z-index: 10; display: flex; flex-direction: column; align-items: center; will-change: transform;">
                <div style="width: 40px; height: 12px; background: #000; border-radius: 6px; margin-top: 8px;"></div>
                <div style="margin-top: 45px; width: 55px; height: 55px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; border: 1px solid #444;">
                     <span style="color: #50C878; font-size: 22px; font-weight: bold;">@</span>
                </div>
            </div>
        </div>

    </div> <script>
        function toggleIphone() {
            const phone = document.getElementById('iphone-mockup');
            phone.classList.toggle('iphone-active');
        }
    </script>
</body>
</html>
