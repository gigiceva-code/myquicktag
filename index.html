<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag | Premium Identity</title>
    <style>
        :root { --smeraldo: #50C878; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: #000000 !important; 
            min-height: 100vh; 
            color: white; 
            overflow-x: hidden; 
        }
        
        /* Header con Logo @Q */
        header {
            width: 100%; display: flex; align-items: center; justify-content: center; 
            padding: 40px 20px; background: #000;
        }

        .logo-container {
            width: 40px; height: 40px; border: 1.5px solid var(--smeraldo); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; margin-right: 15px; flex-shrink: 0;
        }

        /* Frame iPhone */
        .iphone-frame {
            background: #000; border: 4px solid #1a1a1a; border-radius: 45px;
            width: 310px; height: 630px; margin: 0 auto 40px auto; position: relative;
            box-shadow: 0 0 30px rgba(80, 200, 120, 0.1); overflow: hidden;
        }
        .screen { padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100%; }

        .btn-verify {
            background: var(--smeraldo); color: black; border: none;
            padding: 15px; border-radius: 20px; font-weight: 900;
            text-transform: uppercase; width: 100%; cursor: pointer;
            box-shadow: 0 0 20px rgba(80, 200, 120, 0.4);
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#50C878" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <path d="M16 16l4 4" stroke-linecap="round"/>
        </svg>
        <span style="position: absolute; color: white; font-size: 0.6rem; font-weight: bold; background: #000; padding: 0 2px; bottom: -4px; right: -2px;">@</span>
    </div>
    <div style="display: flex; flex-direction: column;">
        <h1 style="font-weight: 100; letter-spacing: 5px; font-size: 1.1rem; text-transform: uppercase; color: white; margin: 0;">MY QUICK TAG</h1>
        <p style="color: #50C878; font-size: 0.5rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 3px;">INSTANT DIGITAL IDENTITY</p>
    </div>
</header>

<div class="main-stage">
    <div class="iphone-frame">
        <div class="screen">
            <div style="width: 100px; height: 25px; background: #000; border-radius: 0 0 15px 15px; margin-bottom: 20px; margin-top: -20px;"></div>

            <div style="width: 70px; height: 70px; background: #222; border-radius: 50%; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; border: 1px solid #333;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#50C878" stroke-width="1.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>

            <div id="display-name" style="font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; color: white; margin-bottom: 5px;">@ILTUNOME</div>
            <div style="font-size: 0.6rem; color: #50C878; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px;">Identità Digitale</div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 20px;">
                <div style="background: rgba(80, 200, 120, 0.05); border: 1px solid rgba(80, 200, 120, 0.2); padding: 10px; border-radius: 12px; display: flex; align-items: center; gap: 8px;">
                    <span style="color: #50C878; font-size: 0.65rem; font-weight: bold;">Instagram</span>
                </div>
                <div style="background: rgba(80, 200, 120, 0.05); border: 1px solid rgba(80, 200, 120, 0.2); padding: 10px; border-radius: 12px; display: flex; align-items: center; gap: 8px;">
                    <span style="color: #50C878; font-size: 0.65rem; font-weight: bold;">TikTok</span>
                </div>
            </div>

            <div style="width: 100%; background: #111; border: 1px solid #222; padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 20px;">
                <div style="color: #666; font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase;">Curriculum Vitae Pre-set</div>
            </div>

            <div style="margin-top: auto; width: 100%; margin-bottom: 20px;">
                <div style="width: 100%; background: #000; border: 1px solid #333; border-radius: 20px; padding: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <span style="color: #50C878;">@</span>
                    <input type="text" id="tag-input" placeholder="digita il tuo nome unico..." style="background: transparent; border: none; color: white; font-size: 0.8rem; width: 100%; outline: none;">
                </div>
                <button class="btn-verify" onclick="checkTag()">Verifica Disponibilità</button>
            </div>
        </div>
    </div>
</div>

<footer style="padding: 20px; text-align: center; font-size: 0.6rem; color: #444; letter-spacing: 2px;">
    PRIVACY & COOKIE POLICY | TERMS OF SERVICE
</footer>

<script>
    const input = document.getElementById('tag-input');
    const display = document.getElementById('display-name');

    input.addEventListener('input', (e) => {
        let val = e.target.value.toLowerCase().replace(/\s/g, '');
        display.innerText = val ? `@${val}` : '@iltuonome';
    });

    function checkTag() {
        const val = input.value;
        if(!val) return;
        alert("Verifica in corso per: " + val + ". Benvenuto nel Lusso Digitale.");
    }
</script>

</body>
</html>
