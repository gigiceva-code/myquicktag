
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag</title>
    <style>
        body { font-family: Arial; text-align: center; padding-top: 80px; }
        input { padding: 10px; width: 250px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        #risultato { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Cerca il tuo Tag</h1>
    <input type="text" id="nomeInput" placeholder="Inserisci nome (es: gigi)">
    <button onclick="cercaTag()">Verifica</button>
    <div id="risultato"></div>

    <script>
        function cercaTag() {
            const nome = document.getElementById("nomeInput").value.trim().toLowerCase();
            const res = document.getElementById("risultato");
            if(!nome) return;
            // Qui poi collegheremo Airtable con la tua chiave pat...
            res.innerHTML = "Stiamo verificando il tag @" + nome + "...";
            res.style.color = "blue";
        }
    </script>
</body>
</html>
