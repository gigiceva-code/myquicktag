<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyQuickTag</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px 20px;
  background: linear-gradient(135deg,#f5f7ff,#eef1ff);
}

h1 {
  font-size: 32px;
}

h2 {
  margin-top: 10px;
  font-weight: 500;
}

.input-box {
  display:flex;
  align-items:center;
  border:1px solid #ccc;
  border-radius:10px;
  padding:10px;
  max-width:300px;
  margin:20px auto;
  background:white;
}

.input-box span {
  margin-right:5px;
}

.input-box input {
  border:none;
  outline:none;
  width:100%;
  font-size:16px;
}

button {
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#007BFF;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover {
  background:#0056b3;
}

#result {
  margin-top:15px;
  font-size:14px;
}

.footer {
  margin-top:50px;
  font-size:12px;
  color:gray;
}

.footer a {
  margin:0 10px;
  color:gray;
  text-decoration:none;
}
</style>
</head>

<body>

<h1>MyQuickTag</h1>

<h2>Ottieni il tuo @nome prima degli altri</h2>

<p style="margin-top:15px; color:#555;">
Un solo link per condividere contatti, social e informazioni.
</p>

<div class="input-box">
  <span>@</span>
  <input type="text" id="nomeInput" placeholder="nome">
</div>

<button id="searchButton">Controlla il tuo @nome</button>

<p id="result"></p>

<!-- FOOTER LEGGERO -->
<div class="footer">
  <a href="#" onclick="alert('MyQuickTag assegna luso del nome ma non la proprietà legale del marchio.')">Termini</a>
  <a href="#" onclick="alert('Non raccogliamo dati personali sensibili. Usato solo per gestione tag.')">Privacy</a>
  <a href="#" onclick="alert('Usiamo cookie tecnici per il funzionamento del sito.')">Cookie</a>
</div>

<script>

const apiKey = "pat6qz8htyV7b1NSN.f3cdd9392b92318e7b32302f93037810ecb4ee9fbd269c40c0e1c18a93b60b8e";
const baseId = "app4eQDzqixPDbQTd";
const tableName = "Table 1";

const input = document.getElementById("nomeInput");
const result = document.getElementById("result");
const button = document.getElementById("searchButton");

button.addEventListener("click", checkNome);

input.addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    checkNome();
  }
});

async function checkNome() {
  const nome = input.value.trim().toLowerCase();

  if (!nome) return;

  result.innerHTML = "Controllo...";

  const url = `https://api.airtable.com/v0/${baseId}/${tableName}?filterByFormula=LOWER({nome})='${nome}'`;

  try {
    const res = await fetch(url, {
      headers: {
        Authorization: `Bearer ${apiKey}`
      }
    });

    const data = await res.json();

    if (data.records.length > 0) {
      result.innerHTML = "❌ Nome non disponibile";
    } else {
      result.innerHTML = "Perfetto. Questo @nome è tuo.";

      setTimeout(() => {
        window.location.href = "tag.html?nome=" + nome;
      }, 700);
    }

  } catch (error) {
    result.innerHTML = "Errore di connessione";
  }
}

</script>

</body>
</html>
