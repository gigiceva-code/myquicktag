<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag - Un @nome. Una sola identità.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #f5f7ff, #eef1ff); min-height: 100vh; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-sans text-gray-900 flex flex-col min-h-screen">

    <div class="max-w-xl mx-auto px-6 py-20 flex-grow text-center">
        <header class="mb-12">
            <h1 class="text-5xl md:text-6xl font-extrabold text-gray-900 mb-4 tracking-tight">MyQuickTag</h1>
            <h2 class="text-2xl text-gray-700 font-medium">Un @nome. Una sola identità.</h2>
            <p class="mt-4 text-gray-500 max-w-sm mx-auto">Un solo link per condividere contatti, social e informazioni.</p>
        </header>

        <div class="flex flex-col gap-4 justify-center mb-8">
            <div class="flex items-center bg-white border-2 border-white rounded-2xl px-4 py-4 max-w-sm mx-auto w-full shadow-sm focus-within:border-blue-400 transition-all group">
                <span class="text-gray-400 text-lg font-bold transition-colors group-focus-within:text-blue-500 mr-1">@</span>
                <input type="text" id="nomeInput" placeholder="nome" class="bg-transparent border-none outline-none w-full text-lg text-gray-900 p-0 focus:ring-0">
            </div>
            
            <button id="searchButton" onclick="verificaNome()" class="max-w-sm mx-auto w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-2xl shadow-lg transition-all active:scale-95 text-xl">
                Controlla il tuo @nome
            </button>
        </div>

        <div id="risultato" class="min-h-[100px]"></div>
    </div>

    <script>
        const apiKey = 'pat6qz8htyV7b1NSN.f3cdd9392b92318e7b32302f93037810ecb4ee9fbd269c40c0e1c18a93b60b8e';
        const baseId = 'app4eQDzqixPDbQTd';
        const table = 'Table 1';

        const inputField = document.getElementById("nomeInput");
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                document.getElementById("searchButton").click();
            }
        });

        async function verificaNome() {
            const inputOriginale = inputField.value.trim();
            const nomeInMinuscolo = inputOriginale.toLowerCase();
            const risultatoArea = document.getElementById("risultato");

            if (inputOriginale === "") {
                risultatoArea.innerHTML = "<p class='text-red-500 font-bold'>Inserisci un nome.</p>";
                return;
            }
            risultatoArea.innerHTML = `<div class="loader mt-4"></div>`;
            try {
                const response = await fetch(`https://api.airtable.com/v0/${baseId}/${table}?filterByFormula={Tag}='${nomeInMinuscolo}'`, {
                    headers: { Authorization: `Bearer ${apiKey}` }
                });
                const data = await response.json();
                if (data.records && data.records.length > 0) {
                    risultatoArea.innerHTML = `<div class="mt-4 bg-red-50 border-2 border-red-100 p-6 rounded-2xl inline-block"><h3 class="text-xl font-bold text-red-700">❌ @${inputOriginale} già preso</h3></div>`;
                } else {
                    risultatoArea.innerHTML = `<div class="mt-4 bg-green-50 border-2 border-green-100 p-6 rounded-2xl inline-block shadow-sm"><h3 class="text-xl font-bold text-green-700 mb-4">✅ @${inputOriginale} è libero</h3><button onclick="azioneRiceviTag('${nomeInMinuscolo}')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-md">Ricevi il tuo @${inputOriginale}</button></div>`;
                }
            } catch (error) { risultatoArea.innerHTML = "<p class='text-red-500 font-bold'>Riprova tra un istante.</p>"; }
        }
        function azioneRiceviTag(nome) { window.location.href = "tag.html?nome=" + nome; }
    </script>
</body>
</html>
