<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyQuickTag - Trova il tuo nome</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col items-center justify-center px-5 text-center">

  <div class="max-w-3xl w-full">
    <div class="mb-12">
      <h1 class="text-7xl md:text-8xl font-black tracking-tighter mb-4 italic uppercase">MyQuickTag</h1>
      <p class="text-xl md:text-2xl text-zinc-400 font-medium">L'identità digitale che cercavi, in un unico Tag.</p>
    </div>

    <div class="bg-zinc-900 p-3 rounded-[40px] border border-zinc-800 shadow-2xl flex flex-col md:flex-row items-center gap-2">
      <div class="flex items-center flex-1 px-6 w-full">
        <span class="text-3xl font-bold text-emerald-500 mr-2">@</span>
        <input id="tagInput" type="text" placeholder="iltuonome" 
               class="bg-transparent text-2xl font-bold text-white outline-none w-full py-4 uppercase placeholder-zinc-700">
      </div>
      <button onclick="checkTag()" class="bg-white text-black text-xl font-bold px-12 py-5 rounded-[32px] hover:bg-emerald-400 transition-all active:scale-95 w-full md:w-auto">
        VERIFICA
      </button>
    </div>

    <p id="statusMsg" class="mt-8 font-bold text-lg italic uppercase tracking-widest"></p>

    <div class="mt-20 grid grid-cols-1 md:grid-cols-3 gap-8 text-left">
      <div class="bg-zinc-900/50 p-6 rounded-3xl border border-zinc-800/50">
        <i class="fas fa-bolt text-emerald-500 mb-4 text-2xl"></i>
        <h3 class="font-bold mb-2">Rapido</h3>
        <p class="text-sm text-zinc-500">Registra il tuo nome in meno di 30 secondi.</p>
      </div>
      <div class="bg-zinc-900/50 p-6 rounded-3xl border border-zinc-800/50">
        <i class="fas fa-shield-alt text-emerald-500 mb-4 text-2xl"></i>
        <h3 class="font-bold mb-2">Sicuro</h3>
        <p class="text-sm text-zinc-500">La tua identità protetta nel nostro database.</p>
      </div>
      <div class="bg-zinc-900/50 p-6 rounded-3xl border border-zinc-800/50">
        <i class="fas fa-share-alt text-emerald-500 mb-4 text-2xl"></i>
        <h3 class="font-bold mb-2">Social</h3>
        <p class="text-sm text-zinc-500">Un solo link per tutti i tuoi profili social.</p>
      </div>
    </div>
  </div>

  <script>
    // Tuoi dati Airtable già inseriti e pronti
    const AIRTABLE_PAT = "patWfr8e2nM0vvhtR.69b3beff785c42c9d59a6d1f898023a16ce907f43e22716d94b497eef8dec54c";
    const BASE_ID = "appG2S8jV9Ams3wYq";
    const TABLE_NAME = "Tabella 1";

    async function checkTag() {
      const nome = document.getElementById('tagInput').value.trim().toLowerCase();
      const msg = document.getElementById('statusMsg');
      if(!nome) return;

      msg.innerText = "RICERCA IN CORSO...";
      msg.className = "mt-8 font-bold text-lg italic text-zinc-500 animate-pulse";
      
      try {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={nome}='${nome}'`;
        const response = await fetch(url, { headers: { Authorization: `Bearer ${AIRTABLE_PAT}` } });
        const data = await response.json();

        if (data.records && data.records.length > 0) {
          msg.innerText = "❌ NOME GIÀ OCCUPATO";
          msg.className = "mt-8 font-bold text-lg text-red-500";
        } else {
          window.location.href = `tag.html?nome=${nome}`;
        }
      } catch (e) {
        msg.innerText = "ERRORE DI CONNESSIONE.";
        msg.className = "mt-8 font-bold text-lg text-red-500";
      }
    }
  </script>
</body>
</html>
