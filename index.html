<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyQuickTag - Identità Digitale Esclusiva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; background-color: #0a0a0a; color: white; }
    
    .pulse-zen {
      animation: pulseZen 6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulseZen {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Pulsazione lenta per il tasto Verifica */
    @keyframes pulseEmerald {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0px rgba(16, 185, 129, 0); }
      50% { transform: scale(1.02); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
    }
    .btn-emerald {
      background-color: #10b981;
      animation: pulseEmerald 4s ease-in-out infinite;
    }

    .input-group {
      border: 1px solid rgba(255, 255, 255, 0.3); /* Bordo più visibile */
      background: #111111;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-hidden">

  <header class="w-full p-6 flex justify-between items-center z-50">
    <div class="w-8 h-8"></div>
    <h1 class="text-3xl font-black tracking-tighter italic uppercase">MyQuickTag</h1>
    <button class="text-white text-3xl active:scale-95"><i class="fas fa-bars"></i></button>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center p-6 text-center">
    
    <div class="pulse-zen mb-4">
      <p class="text-lg text-white/90 font-medium tracking-tight">Un mondo dentro il tuo nome</p>
      <p class="text-lg text-white/50 font-medium italic tracking-tight">Il tuo nome nel mondo</p>
    </div>

    <div class="relative w-48 h-28 bg-zinc-900 rounded-xl border border-white/10 mb-8 flex items-center justify-around p-4 shadow-2xl overflow-hidden group">
        <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/10 to-transparent opacity-50"></div>
        <div class="w-16 h-16 bg-white/10 rounded flex items-center justify-center">
            <i class="fas fa-qrcode text-white/40 text-3xl"></i>
        </div>
        <div class="flex flex-col gap-2">
            <div class="w-16 h-1.5 bg-emerald-500/40 rounded-full"></div>
            <div class="w-12 h-1.5 bg-white/20 rounded-full"></div>
            <div class="w-14 h-1.5 bg-white/20 rounded-full"></div>
        </div>
    </div>

    <div class="mb-8 w-full max-w-[340px] mx-auto">
      <p class="text-[10px] font-black uppercase tracking-[0.4em] text-emerald-400 mb-3">Instant Digital Identity</p>
      <p class="text-zinc-300 text-[14px] leading-relaxed font-medium mb-4">
        Sfrutta l’innovazione: tutti i tuoi link in un unico Tag. Una soluzione potente, al prezzo di una colazione all'anno.
      </p>
      <p class="text-white text-[13px] font-bold tracking-wide uppercase italic">
        Cattura il tuo Tag. Prima degli altri.
      </p>
    </div>

    <div class="w-full max-w-[280px] rounded-[2rem] p-2 shadow-2xl input-group">
      <div class="flex items-center px-6 py-4 border-b border-white/10">
        <span class="text-2xl font-bold text-emerald-500">@</span>
        <input id="searchInput" type="text" placeholder="iltuonome" 
               class="flex-1 bg-transparent outline-none text-lg ml-1 text-white font-bold uppercase placeholder-zinc-700 tracking-tighter">
      </div>
      <button onclick="checkName()" 
              class="w-full btn-emerald text-black font-black py-4 mt-2 rounded-[1.6rem] text-lg hover:brightness-110 transition-all active:scale-95 shadow-xl uppercase">
        Verifica
      </button>
    </div>
    
    <p id="status" class="mt-8 text-[9px] font-black uppercase tracking-[0.3em] min-h-[20px] text-zinc-500"></p>
  </main>

  <footer class="pb-10 flex justify-center opacity-10">
    <div class="w-1.5 h-1.5 bg-white rounded-full mx-1"></div>
    <div class="w-1.5 h-1.5 bg-white rounded-full mx-1"></div>
    <div class="w-1.5 h-1.5 bg-white rounded-full mx-1"></div>
  </footer>
