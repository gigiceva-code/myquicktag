<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag | Cyber-Luxury</title>
    <style>
        :root {
            --cyber-green: #00ff41;
            --luxury-black: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Effetto Sfondo Ipnotico */
        .bg-glow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #111 0%, #000 70%);
            z-index: 1;
        }

        /* Frase Verde Esterna */
        .external-status {
            position: absolute;
            top: 10%;
            color: var(--cyber-green);
            font-family: monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 2;
        }

        /* Simulatore iPhone */
        .iphone-frame {
            position: relative;
            width: 320px;
            height: 650px;
            background: var(--luxury-black);
            border: 8px solid #1a1a1a;
            border-radius: 50px;
            box-shadow: 0 0 50px rgba(0,0,0,1), 0 0 20px rgba(255,255,255,0.02);
            z-index: 10;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            flex: 1;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .logo {
            font-weight: 200;
            font-size: 1.5rem;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        .slogan {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        .verify-input {
            background: var(--glass);
            border: 1px solid #333;
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            width: 80%;
            text-align: center;
            font-family: monospace;
            font-size: 1.2rem;
            outline: none;
            transition: border 0.3s;
        }

        .verify-input:focus {
            border-color: var(--cyber-green);
        }

        .btn-verify {
            margin-top: 20px;
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-verify:active { transform: scale(0.95); }

        /* Messaggio Verde Interno (Nascosto) */
        #internal-status {
            display: none;
            color: var(--cyber-green);
            font-size: 0.7rem;
            margin-top: 20px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    
    <div class="external-status">System Live // MyQuickTag Cloud</div>

    <div class="iphone-frame">
        <div class="screen" id="main-screen">
            <div class="logo">MYQUICKTAG</div>
            <div class="slogan">Cyber-Luxury Minimal</div>
            
            <input type="text" id="tag-code" class="verify-input" placeholder="INSERT TAG">
            <button class="btn-verify" onclick="verifyTag()">VERIFY</button>
            
            <div id="internal-status">ACCESS GRANTED: SECURE_CONNECTION_ESTABLISHED</div>
        </div>
    </div>

    <script>
        const AIRTABLE_PAT = "TUO_TOKEN_QUI";
        const BASE_ID = "TUO_BASE_ID_QUI";
        const TABLE_NAME = "Table 1";

        async function verifyTag() {
            const code = document.getElementById('tag-code').value;
            const status = document.getElementById('internal-status');
            
            if(!code) return;

            status.style.display = 'block';
            status.innerText = "QUERYING AIRTABLE...";

            try {
                // Logica di fetch reale che avevamo impostato
                // Qui andrà il filtro: filterByFormula=({ID}='${code}')
                console.log("Verifica in corso per:", code);
                
                // Simulo risposta positiva per farti vedere il lusso:
                setTimeout(() => {
                    status.innerText = "AUTHENTICATED: SYSTEM_READY";
                }, 1500);

            } catch (error) {
                status.innerText = "ERROR: CONNECTION_FAILED";
                status.style.color = "red";
            }
        }
    </script>
</body>
</html>
