
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag - Un @nome. Una sola identità.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7ff, #eef1ff);
            min-height: screen;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .example-box {
            background: linear-gradient(135deg, #ffffff, #f3f4ff);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            margin-top: 60px;
        }
    </style>
</head>
<body class="font-sans text-gray-900 flex flex-col min-h-screen">

    <div class="max-w-xl mx-auto px-6 py-16 flex-grow text-center">
        
        <header class="mb-12">
            <h1 class="text-5xl md:text-6xl font-extrabold text-gray-900 mb-6 tracking-tight">MyQuickTag</h1>
            <h2 class="text-2xl text-gray-700 font-normal leading-relaxed">
                Un @nome. Una sola identità.
            </h2>
        </header>

        <div class="flex flex-col gap-2 justify-center mb-6">
            <div class="relative max-w-sm mx-auto w-full">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input type="text" id="nomeInput" 
                    class="block w-full pl-11 pr-4 py-4 border-2 border-white rounded-2xl focus:border-blue-400 focus:ring-0 text-lg transition-all shadow-sm bg-white/80 backdrop-blur-sm" 
                    placeholder="Scegli un @nome">
            </div>
            
            <div>
                <p class="text-[13px] text-gray-400 cursor-pointer hover:text-gray-600 transition-colors" onclick="toggleGuida()">
                    Come funziona?
                </p>
                <div id="guidaBox" class="hidden mt-3 text-[13px] text-gray-500 bg-white/90 backdrop-blur-sm p-4 rounded-xl border border-gray-100 shadow-sm max-w-xs mx-auto text-left">
                    <p class="mb-1">1. Scegli un nome</p>
                    <p class="mb-1">2. Controlla se è disponibile</p>
                    <p>3. Attiva il tuo tag</p>
                </div>
            </div>
        </div>

        <div class="mb-8">
            <button onclick="verificaNome()" class="max-w-sm mx-auto w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-2xl shadow-lg transition-all active:scale-95 text-xl">
                Controlla ora
            </button>
            <p class="text-gray-500 text-[13px] mt-4 font-medium">
                Attivazione gratuita · rinnovo annuale
            </p>
        </div>

        <div id="risultato" class="mb-10 transition-all min-h-[80px]"></div>

        <div class="example-box max-w-[380px] mx-auto text-left border border-white/50">
            <p class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-3">Esempio</p>
            <h3 class="text-4xl font-black text-gray-900 mb-2">@nome</h3>
            <p class="text-gray-500 text-base">Profilo digitale · Link · Contatti</p>
            <div class="mt-6 flex gap-1.5">
                <div class="h-1.5 w-8 bg-blue-500 rounded-full"></div>
                <div class="h-1.5 w-8 bg-blue-200 rounded-full"></div>
                <div class="h-1.5 w-8 bg-blue-100 rounded-full"></div>
            </div>
        </div>

        <div class="mt-20 pt-8 border-t border-gray-200/50 text-[12px] text-gray-400 space-x-3">
            <a href="#" class="hover:underline">Termini di utilizzo</a>
            <span>·</span>
            <a href="#" class="hover:underline">Privacy</a>
            <span>·</span>
            <a href="#" class="hover:underline">Cookie</a>
        </div>

    </div>

    <footer class="py-8 text-center text-gray-400 text-[10px] tracking-widest uppercase">
        &copy; 2024 MyQuickTag Protocol
    </footer>

    <script>
        // --- CONFIGURAZIONE AIRTABLE ---
        const apiKey = 'pat6qz8htyV7b1NSN.f3cdd9392b92318e7b32302f93037810ecb4ee9fbd269c40c0e1c18a93b60b8e';
        const baseId = 'app4eQDzqixPDbQTd';
        const table = 'Table 1';

        function toggleGuida() {
            var box = document.getElementById("guidaBox");
            box.classList.toggle("hidden");
        }

        const inputEl = document.getElementById("nomeInput");
        const risultatoArea = document.getElementById("risultato");

        async function verificaNome() {
            const inputOriginale = inputEl.value.trim();
            const nomeInMinuscolo = inputOriginale.toLowerCase();

            if (inputOriginale === "") {
                risultatoArea.innerHTML = "<p class='text-red-500 font-bold'>Inserisci un nome.</p>";
                return;
            }

            risultatoArea.innerHTML = `<div class="loader"></div>`;

            try {
                const response = await fetch(`https://api.airtable.com/v0/${baseId}/${table}?filterByFormula={Tag}='${nomeInMinuscolo}'`, {
                    headers: { Authorization: `Bearer ${apiKey}` }
                });
                const data = await response.json();

                if (data.records && data.records.length > 0) {
                    risultatoArea.innerHTML = `
                        <div class="bg-red-50/80 backdrop-blur-sm border-2 border-red-100 p-6 rounded-2xl inline-block">
                            <h3 class="text-xl font-bold text-red-700">❌ @${inputOriginale} già preso</h3>
                        </div>`;
                } else {
                    risultatoArea.innerHTML = `
                        <div class="bg-green-50/80 backdrop-blur-sm border-2 border-green-100 p-6 rounded-2xl inline-block shadow-sm">
                            <h3 class="text-xl font-bold text-green-700 mb-4">✅ @${inputOriginale} è libero</h3>
                            <button onclick="azioneRiceviTag('${nomeInMinuscolo}')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-md">
                                Ricevi il tuo @${inputOriginale}
                            </button>
                        </div>`;
                }
            } catch (error) {
                risultatoArea.innerHTML = "<p class='text-red-500 font-bold'>Riprova tra un istante.</p>";
            }
        }

        function azioneRiceviTag(nome) {
            window.location.href = "tag.html?nome=" + nome;
        }
    </script>
</body>
</html>
