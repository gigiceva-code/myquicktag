<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MyQuickTag</title>
    <style>
        body, html {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, system-ui, sans-serif;
            color: #fff;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100dvh; /* Dynamic viewport height per mobile */
            padding: 20px 0;
            box-sizing: border-box;
        }

        /* HEADER: Logo e Titolo sempre in primo piano */
        .header {
            position: relative;
            z-index: 10; 
            text-align: center;
            flex-shrink: 0;
        }

        /* IPHONE: Più alto e con crescita verso l'alto */
        .iphone-container {
            flex-grow: 1;
            display: flex;
            align-items: center; /* Centra l'iPhone nello spazio rimasto */
            justify-content: center;
            width: 100%;
            position: relative;
            padding-bottom: 40px; /* Cuscinetto per Barra Android */
        }

        #iphone-mockup {
            width: 155px;
            height: 300px; /* Più alto di prima */
            background: #1a1a1a;
            border: 3px solid #333;
            border-radius: 30px;
            position: relative;
            transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            transform-origin: bottom center; /* ESPLODE VERSO L'ALTO */
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .iphone-active {
            transform: scale(1.65); /* Espansione generosa */
            box-shadow: 0 0 100px rgba(80, 200, 120, 0.15) !important;
        }

        .notch { width: 50px; height: 14px; background: #000; border-radius: 7px; margin-top: 12px; }
        .chip { margin-top: 55px; width: 65px; height: 65px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="header">
            <div style="position: relative; width: 65px; height: 65px; margin: 0 auto 10px;">
                <div style="width: 100%; height: 100%; border: 6px solid #50C878; border-radius: 50%; box-sizing: border-box;"></div>
                <div style="position: absolute; width: 6px; height: 20px; background: #50C878; bottom: -2px; right: -2px; transform: rotate(-45deg); border-radius: 3px;"></div>
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); color: #fff; font-size: 32px; font-weight: bold;">@</div>
            </div>
            <h1 style="font-size: 26px; font-weight: 900; margin: 0; text-transform: uppercase;">MYQUICKTAG</h1>
            <p style="color: #50C878; font-size: 11px; font-weight: 600; letter-spacing: 2px; margin-top: 4px; text-transform: uppercase;">Istant Digital Identity</p>
        </div>

        <div class="iphone-container">
            <div id="iphone-mockup" onclick="toggleIphone()">
                <div class="notch"></div>
                <span style="color: #50C878; font-size: 9px; margin-top: 10px; opacity: 0.5;">TAP TO SIMULATE</span>
                <div class="chip">
                     <span style="color: #50C878; font-size: 26px; font-weight: bold;">@</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleIphone() {
            document.getElementById('iphone-mockup').classList.toggle('iphone-active');
        }
    </script>
</body>
</html>
