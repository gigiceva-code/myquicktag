
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag</title>
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
            color: #ffffff;
            padding-top: 60px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        @keyframes sloganGlow {
            0% { opacity: 0.2; text-shadow: 0 0 0px rgba(255,255,255,0); }
            50% { opacity: 1; text-shadow: 0 0 15px rgba(255, 255, 255, 0.6); }
            100% { opacity: 0.2; text-shadow: 0 0 0px rgba(255,255,255,0); }
        }

        .slogan-pulse { 
            animation: sloganGlow 5s infinite ease-in-out; 
            color: #ffffff !important; 
            text-align: center;
        }
        
        .iphone-active { 
            transform: scale(1.8) translateY(50px) !important; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.9) !important; 
            z-index: 100 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="position: relative; width: 80px; height: 80px; margin-bottom: 15px;">
            <div style="width: 100%; height: 100%; border: 8px solid #50C878; border-radius: 50%; box-sizing: border-box;"></div>
            <div style="position: absolute; width: 8px; height: 25px; background: #50C878; bottom: -2px; right: -2px; transform: rotate(-45deg); border-radius: 4px;"></div>
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); color: #ffffff; font-size: 40px; font-weight: bold;">@</div>
        </div>

        <h1 style="font-size: 32px; font-weight: 900; letter-spacing: 1px; margin: 0; text-transform: uppercase;">MYQUICKTAG</h1>
        <p style="color: #50C878; font-size: 11px; font-weight: 600; letter-spacing: 3px; margin-top: 5px; text-transform: uppercase;">PREMIUM DIGITAL TAG</p>

        <div style="margin: 50px 0; position: relative; display: flex; flex-direction: column; align-items: center; min-height: 400px;">
            <span style="color: #50C878; font-size: 10px; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; opacity: 0.8;">Tap to Simulate</span>
            <div id="iphone-mockup" onclick="toggleIphone()" style="position: relative; width: 140px; height: 280px; background: #1a1a1a; border: 3px solid #333; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); cursor: pointer; transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 10; display: flex; flex-direction: column; align-items: center;">
                <div style="width: 45px; height: 12px; background: #000; border-radius: 6px; margin-top: 10px;"></div>
                <div style="margin-top: 55px; width: 60px; height: 60px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; border: 1px solid #444;">
                     <span style="color: #50C878; font-size: 24px; font-weight: bold;">@</span>
                </div>
            </div>
        </div>

        <div id="blocco-2" style="margin-top: 100px; padding-bottom: 120px; display: flex; flex-direction: column; align-items: center; width: 100%;">
            <div style="display: flex; align-items: center; gap: 10px; opacity: 0.4; margin-bottom: 50px;">
                <div style="position: relative; width: 25px; height: 25px;">
                    <div style="width: 100%; height: 100%; border: 2px solid #50C878; border-radius: 50%;"></div>
                    <div style="position: absolute; width: 2px; height: 8px; background: #50C878; bottom: 0; right: 0; transform: rotate(-45deg);"></div>
                </div>
                <span style="font-size: 12px; letter-spacing: 3px; text-transform: uppercase;">MyQuickTag</span>
            </div>

            <div style="text-align: center; margin-bottom: 50px;">
                <p class="slogan-pulse" style="font-size: 18px; font-weight: 700; letter-spacing: 2px; margin: 10px 0; text-transform: uppercase;">Il mondo nel tuo nome</p>
                <p class="slogan-pulse" style="font-size: 18px; font-weight: 700; letter-spacing: 2px; margin: 10px 0; text-transform: uppercase;">Il tuo nome nel mondo</p>
            </div>

            <div style="width: 85%; max-width: 320px;">
                <div style="position: relative; margin-bottom: 20px;">
                    <span style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #50C878; font-weight: bold; font-size: 18px;">@</span>
                    <input type="text" placeholder="tuonome" style="width: 100%; background: #111; border: 1px solid #333; border-radius: 12px; padding: 15px 15px 15px 40px; color: #fff; font-size: 16px; outline: none; box-sizing: border-box;">
                </div>
                <button style="width: 100%; background: #50C878; color: #000; border: none; border-radius: 12px; padding: 18px; font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer;">
                    Verifica Disponibilità
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleIphone() {
            const phone = document.getElementById('iphone-mockup');
            phone.classList.toggle('iphone-active');
        }
    </script>
</body>
</html>
