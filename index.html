<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MyQuickTag</title>
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh; /* Forza l'altezza dello schermo */
            font-family: -apple-system, system-ui, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            box-sizing: border-box;
            height: 100%;
        }

        /* IPHONE ATTIVO: CALIBRATO PER ANDROID */
        /* Scala 1.6: il massimo consentito per non toccare i tasti in basso */
        .iphone-active { 
            transform: scale(1.6) !important; 
            box-shadow: 0 30px 80px rgba(80, 200, 120, 0.2); 
            z-index: 100;
        }

        #iphone-mockup {
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
            /* Forza l'origine al centro per un'espansione simmetrica */
            transform-origin: center center; 
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div style="position: relative; width: 60px; height: 60px; margin-bottom: 10px;">
            <div style="width: 100%; height: 100%; border: 5px solid #50C878; border-radius: 50%; box-sizing: border-box;"></div>
            <div style="position: absolute; width: 5px; height: 18px; background: #50C878; bottom: -2px; right: -2px; transform: rotate(-45deg); border-radius: 3px;"></div>
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); color: #ffffff; font-size: 28px; font-weight: bold;">@</div>
        </div>

        <h1 style="font-size: 24px; font-weight: 900; letter-spacing: 1px; margin: 0; text-transform: uppercase;">MYQUICKTAG</h1>
        <p style="color: #50C878; font-size: 11px; font-weight: 600; letter-spacing: 2px; margin-top: 4px; text-transform: uppercase;">Istant Digital Identity</p>

        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding-bottom: 60px;"> <span style="color: #50C878; font-size: 9px; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; opacity: 0.6;">Tap to Simulate</span>
            
            <div id="iphone-mockup" onclick="toggleIphone()" style="position: relative; width: 150px; height: 260px; background: #1a1a1a; border: 3px solid #333; border-radius: 28px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); cursor: pointer; display: flex; flex-direction: column; align-items: center;">
                <div style="width: 40px; height: 12px; background: #000; border-radius: 6px; margin-top: 10px;"></div>
                <div style="margin-top: 45px; width: 60px; height: 60px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; border: 1px solid #444;">
                     <span style="color: #50C878; font-size: 24px; font-weight: bold;">@</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleIphone() {
            const phone = document.getElementById('iphone-mockup');
            phone.classList.toggle('iphone-active');
        }
    </script>
</body>
</html>
