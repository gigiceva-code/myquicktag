<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyQuickTag - Il tuo @nome. Una sola volta.</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <div class="max-w-2xl mx-auto pt-28 px-6 text-center">
    <h1 class="text-7xl font-black tracking-tighter mb-2 italic">MyQuickTag</h1>
    <p class="text-5xl font-semibold text-zinc-400 mb-10">Il tuo @nome.<br>Una sola volta nella vita.</p>

    <div class="max-w-lg mx-auto">
      <div class="flex flex-col sm:flex-row gap-3 bg-zinc-900 border border-zinc-700 rounded-3xl p-2 shadow-2xl">
        <div class="flex-1 flex items-center px-6 py-6">
          <span class="text-blue-500 text-5xl mr-4 font-black">@</span>
          <input id="searchInput" type="text" placeholder="iltuonome" 
                 class="flex-1 bg-transparent outline-none text-3xl placeholder-zinc-500 font-medium uppercase">
        </div>
        <button onclick="checkName()" 
                class="w-full sm:w-auto bg-white text-black font-bold px-14 py-6 rounded-3xl text-xl hover:bg-emerald-400 hover:scale-105 transition-all">
          Verifica
        </button>
      </div>
    </div>

    <p id="status" class="mt-8 text-2xl min-h-[32px] font-black italic uppercase tracking-tighter"></p>

    <div class="mt-20 text-sm text-zinc-500 flex justify-center gap-8 font-bold uppercase tracking-widest">
      <div>Gratis 3 mesi</div>
      <div>2€/anno dopo</div>
      <div>Nome unico per sempre</div>
    </div>
  </div>

  <script>
    // Integrazione Database by Gemini
    const AIRTABLE_PAT = "patWfr8e2nM0vvhtR.69b3beff785c42c9d59a6d1f898023a16ce907f43e22716d94b497eef8dec54c";
    const BASE_ID = "appG2S8jV9Ams3wYq";
    const TABLE_NAME = "Tabella 1";

    async function checkName() {
      let input = document.getElementById('searchInput').value.trim();
      const status = document.getElementById('status');
      if (!input) return;

      input = input.replace('@', '').replace(/\s+/g, '').toLowerCase();
      status.innerHTML = '<span class="text-blue-500 animate-pulse">ANALISI DATABASE...</span>';

      try {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={nome}='${input}'`;
        const response = await fetch(url, { headers: { Authorization: `Bearer ${AIRTABLE_PAT}` } });
        const data = await response.json();

        if (data.records && data.records.length > 0) {
          status.innerHTML = '<span class="text-red-500">❌ TAG GIÀ PRESO</span>';
        } else {
          status.innerHTML = '<span class="text-emerald-400">✅ DISPONIBILE! BLOCCALO...</span>';
          setTimeout(() => {
            window.location.href = `tag.html?nome=${input}`;
          }, 800);
        }
      } catch (e) {
        status.innerHTML = '<span class="text-red-500">ERRORE DI RETE</span>';
      }
    }

    document.getElementById('searchInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') checkName();
    });
  </script>
</body>
</html>
