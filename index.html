
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MyQuickTag - Istant Digital Identity</title>
    <style>
        /* RESET & BASE */
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- BLOCCO 1: BLINDATO --- */
        .iphone-active { 
            transform: scale(1.90) translateY(-15px) !important; 
            box-shadow: 0 60px 150px rgba(0,0,0,0.98) !important; 
            z-index: 100 !important;
        }

        #iphone-mockup {
            transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            will-change: transform;
        }

        /* --- STILE INPUT LUXURY --- */
        .input-luxury:focus {
            border-bottom: 1px solid #50C878 !important;
            color: #50C878 !important;
        }
        
        .btn-verifica:active {
            transform: scale(0.96);
            background-color: #45b36b !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="position: relative; width: 80px; height: 80px; margin-top: 30px; margin-bottom: 10px;">
            <div style="width: 100%; height: 100%; border: 8px solid #50C878; border-radius: 50%; box-sizing: border-box;"></div>
            <div style="position: absolute; width: 8px; height: 25px; background: #50C878; bottom: -2px; right: -2px; transform: rotate(-45deg); border-radius: 4px;"></div>
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); color: #ffffff; font-size: 40px; font-weight: bold;">@</div>
        </div>

        <h1 style="font-size: 32px; font-weight: 900; letter-spacing: 1px; margin: 0; text-transform: uppercase; line-height: 1;">MYQUICKTAG</h1>
        <p style="color: #50C878; font-size: 13px; font-weight: 600; letter-spacing: 3px; margin-top: 6px; margin-bottom: 20px; text-transform: uppercase;">Istant Digital Identity</p>

        <div style="position: relative; display: flex; flex-direction: column; align-items: center; min-height: 500px; width: 100%; justify-content: center;">
            <span style="color: #50C878; font-size: 10px; letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase; opacity: 0.8; font-weight: 600;">Tap to Simulate</span>
            <div id="iphone-mockup" onclick="toggleIphone()" style="position: relative; width: 140px; height: 280px; background: #1a1a1a; border: 3px solid #333; border-radius: 28px; box-shadow: 0 25px 50px rgba(0,0,0,0.7); cursor: pointer; display: flex; flex-direction: column; align-items: center;">
                <div style="width: 45px; height: 12px; background: #000; border-radius: 6px; margin-top: 10px;"></div>
                <div style="margin-top: 50px; width: 60px; height: 60px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; border: 1px solid #444;">
                     <span style="color: #50C878; font-size: 24px; font-weight: bold;">@</span>
                </div>
            </div>
        </div>
    </div>

  <div class="container section-2" style="margin-top: 280px; padding-bottom: 120px;">
        
        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 50px;">
            <div style="position: relative; width: 42px; height: 42px; margin-bottom: 8px; opacity: 0.9;">
                <div style="width: 100%; height: 100%; border: 3px solid #50C878; border-radius: 50%; box-sizing: border-box;"></div>
                <div style="position: absolute; width: 4px; height: 13px; background: #50C878; bottom: -1px; right: -1px; transform: rotate(-45deg); border-radius: 2px;"></div>
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); color: #ffffff; font-size: 19px; font-weight: bold;">@</div>
            </div>
            <span style="font-size: 10px; font-weight: 900; letter-spacing: 4px; color: rgba(255,255,255,0.7); text-transform: uppercase;">MYQUICKTAG</span>
        </div>

        <h2 style="font-size: 18px; font-weight: 600; color: #50C878; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 25px; text-shadow: 0 0 10px rgba(80, 200, 120, 0.2);">
    Premium Digital Tag
</h2>

<div style="margin-bottom: 50px;">
    <p style="font-size: 15px; color: #aaa; letter-spacing: 1px; margin: 8px 0; font-weight: 400;">il mondo nel tuo nome</p>
    <p style="font-size: 15px; color: #aaa; letter-spacing: 1px; margin: 8px 0; font-weight: 400;">il tuo nome nel mondo</p>
    <div style="width: 25px; height: 1px; background: #444; margin: 25px auto;"></div>
    
    <p style="font-size: 19px; font-weight: 400; line-height: 1.5; color: #ffffff; max-width: 320px; margin: 0 auto; text-transform: uppercase; letter-spacing: 1.5px;">
        Un'identità digitale che mette il tuo nome <br>
        <span style="font-weight: 900; color: #ffffff;">al centro del mondo</span>
    </p>
</div>

<div class="input-group" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
    <div style="margin-bottom: 12px; font-size: 10px; color: #50C878; letter-spacing: 3px; text-transform: uppercase; font-weight: 600;">
        Claim yours
    </div>
    
    <div style="display: inline-flex; align-items: center; border-bottom: 1.5px solid #333; transition: border-color 0.4s; min-width: 200px; justify-content: center;" id="input-line">
        <span id="at-symbol" style="color: #444; font-size: 26px; font-weight: bold; padding-bottom: 8px; transition: color 0.3s ease;">@</span>
        <input type="text" placeholder="tuonome" spellcheck="false" 
               oninput="document.getElementById('at-symbol').style.color = this.value.length > 0 ? '#ffffff' : '#444';"
               onfocus="document.getElementById('input-line').style.borderColor='#50C878'"
               onblur="document.getElementById('input-line').style.borderColor='#333'"
               style="width: 160px; background: transparent; border: none; padding: 8px 10px; color: #ffffff; font-size: 26px; font-weight: 400; outline: none; caret-color: #ffffff; text-align: left;">
    </div>
    
    <button class="btn-verifica" style="width: 280px; margin-top: 45px; background: #50C878; color: #000; border: none; padding: 20px; border-radius: 50px; font-size: 16px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; cursor: pointer;">
        VERIFICA
    </button>
</div>

    </div>  
   
    <script>
        function toggleIphone() {
            const phone = document.getElementById('iphone-mockup');
            phone.classList.toggle('iphone-active');
        }
    </script>
</body>
</html>
