<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag</title>
    <style>
        /* RESET E SFONDO LUXURY */
        body {
            background-color: #000000; /* Nero Assoluto */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Inizia dall'alto */
            min-height: 100vh;
            font-family: sans-serif;
            color: #ffffff;
            padding-top: 60px; /* Spazio iniziale dall'alto */
        }

        /* CONTENITORE PRINCIPALE PER I PEZZI CHE AGGIUNGEREMO */
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* QUI ANDRANNO I CODICI DEI SINGOLI BLOCCHI */
    </style>
</head>
<body>

    <div class="container">
 <div style="position: relative; width: 100px; height: 100px; margin-bottom: 25px;">
    <div style="width: 100%; height: 100%; border: 10px solid #50C878; border-radius: 50%; box-sizing: border-box;"></div>
    <div style="position: absolute; width: 10px; height: 35px; background: #50C878; bottom: -10px; right: 6px; transform: rotate(-45deg); border-radius: 5px;"></div>
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); color: #ffffff; font-family: sans-serif; font-size: 55px; font-weight: bold;">@</div>
</div>

<h1 style="color: #ffffff; font-family: sans-serif; font-size: 42px; font-weight: 900; letter-spacing: 1px; margin: 0; text-transform: uppercase; width: 100%;">
    MYQUICKTAG
</h1>

<p style="color: #50C878; font-family: sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 4px; margin-top: 8px; text-transform: uppercase;">
    PREMIUM DIGITAL TAG
</p>
<div style="margin: 40px 0; position: relative; display: flex; flex-direction: column; align-items: center;">
    
    <span style="color: #50C878; font-family: sans-serif; font-size: 10px; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; opacity: 0.8;">
        Tap to Simulate
    </span>

    <div style="position: absolute; width: 120px; height: 220px; background: rgba(80, 200, 120, 0.2); border-radius: 30px; filter: blur(20px); animation: pulse 2s infinite ease-in-out; z-index: 0; top: 30px;"></div>

    <div id="iphone-mockup" onclick="toggleIphone()" style="position: relative; width: 130px; height: 260px; background: #1a1a1a; border: 4px solid #333; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); cursor: pointer; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; overflow: hidden; display: flex; flex-direction: column; align-items: center;">
        
        <div style="width: 40px; height: 12px; background: #000; border-radius: 6px; margin-top: 8px;"></div>
        
        <div style="margin-top: 40px; width: 50px; height: 50px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; border: 1px solid #444;">
             <span style="color: #50C878; font-size: 20px; font-weight: bold;">@</span>
        </div>
    </div>
</div>

<style>
    @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.5; }
        50% { transform: scale(1.05); opacity: 0.8; }
        100% { transform: scale(0.95); opacity: 0.5; }
    }
    
    .iphone-active {
        transform: scale(2.2) !important;
        z-index: 100 !important;
        margin-top: 100px !important;
        margin-bottom: 100px !important;
    }
</style>

<script>
    function toggleIphone() {
        const phone = document.getElementById('iphone-mockup');
        phone.classList.toggle('iphone-active');
    }
</script>

    </div> </body>     
</html>
