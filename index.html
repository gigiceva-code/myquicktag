
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-white font-['Inter']">

    <div class="container mx-auto px-4 py-20 text-center">
        <input type="text" id="tagInput" placeholder="Scegli il tuo nome" class="border-2 p-4 rounded-xl">
        <button onclick="checkTag()" id="mainBtn" class="bg-[#00C896] text-white p-4 rounded-xl font-bold">Verifica</button>
    </div>

    <script>
        // TODO: spostare su backend/proxy per sicurezza (API Key esposta lato client)
        const AIRTABLE_TOKEN = 'pat7XmPCH9o7vNf1i.7f89d5321...'; 
        const BASE_ID = 'appLqZ8j4W7kP3...';
        const TABLE_NAME = 'Leads';

        async function checkTag() {
            const input = document.getElementById('tagInput').value.trim();
            const btn = document.getElementById('mainBtn');
            
            if(!input) return alert("Inserisci un nome");

            btn.disabled = true;
            btn.innerText = "CONTROLLO...";

            // FIX 1: URL Airtable corretto con encodeURIComponent e filterByFormula
            const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={Tag}='@${input}'`;

            try {
                const response = await fetch(url, {
                    headers: { "Authorization": `Bearer ${AIRTABLE_TOKEN}` }
                });
                
                if (!response.ok) throw new Error("Errore API");
                
                const data = await response.json();

                // Se il record non esiste (tag libera), procediamo alla pagina tag
                if (data.records.length === 0) {
                    // FIX 3: Uniformato parametro URL a ?nome=
                    window.location.href = `tag.html?nome=${encodeURIComponent(input)}`;
                } else {
                    alert("Questo nome è già occupato, provane un altro!");
                    btn.disabled = false;
                    btn.innerText = "Verifica";
                }

            } catch (error) {
                console.error("Errore tecnico:", error);
                alert("Errore di connessione. Riprova tra un istante.");
                btn.disabled = false;
                btn.innerText = "Verifica";
            }
        }
    </script>
</body>
</html>
