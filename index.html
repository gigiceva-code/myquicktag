<header class="w-full px-6 py-4 flex justify-between items-center bg-transparent">
  <div class="w-8"></div>

  <div class="flex flex-col items-center">
    <svg width="50" height="50" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-[0_0_15px_rgba(16,185,129,0.5)]">
      <style>
        .draw-path {
          stroke-dasharray: 400;
          stroke-dashoffset: 400;
          animation: draw 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        .inner-at { 
          opacity: 0; 
          animation: fadeIn 0.8s ease forwards 1s; 
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
      </style>
      
      <path class="draw-path" d="M80 50C80 66.5685 66.5685 80 50 80C33.4315 80 20 66.5685 20 50C20 33.4315 33.4315 20 50 20C60.5 20 69.5 25.5 74.5 34" 
            stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
      
      <path class="draw-path" d="M60 60L85 85" 
            stroke="#10b981" stroke-width="7" stroke-linecap="round" style="animation-delay: 0.5s;"/>

      <text x="50" y="56" text-anchor="middle" font-family="Arial" font-weight="900" font-size="28" fill="#10b981" class="inner-at">@</text>
      
      <circle cx="50" cy="50" r="2" fill="white" class="inner-at" style="animation-delay: 1.5s;"/>
    </svg>

    <h2 class="text-[12px] font-black tracking-[0.5em] text-white uppercase italic mt-2">
      MyQuickTag
    </h2>
  </div>

  <button class="text-white text-2xl active:scale-95 w-8">
    <i class="fas fa-bars"></i>
  </button>
</header>
