<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyQuickTag - Un @nome. Una sola identità.</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <div class="max-w-2xl mx-auto pt-20 px-6">
    
    <!-- Hero -->
    <div class="text-center mb-12">
      <h1 class="text-6xl font-semibold tracking-tighter mb-3">MyQuickTag</h1>
      <p class="text-3xl text-zinc-400">Un @nome. Una sola identità.</p>
      <p class="mt-6 text-xl text-zinc-400 font-medium">Il tuo @nome.<br>Una sola volta.</p>
    </div>

    <!-- Search Bar con bottone visibile -->
    <div class="relative max-w-xl mx-auto">
      <div class="flex items-center bg-zinc-900 border border-zinc-700 rounded-3xl px-5 py-5 focus-within:border-blue-500 transition-all">
        <span class="text-blue-500 text-4xl mr-4">@</span>
        
        <input 
          id="searchInput"
          type="text" 
          placeholder="iltuonome"
          class="flex-1 bg-transparent outline-none text-2xl placeholder-zinc-500"
          autocomplete="off">

        <button onclick="checkName()" 
                class="bg-white hover:bg-blue-600 hover:text-white text-black font-semibold px-8 py-4 rounded-3xl transition-all flex items-center gap-2">
          <i class="fas fa-search"></i>
          <span class="hidden sm:inline">Verifica disponibilità</span>
          <span class="sm:hidden">Cerca</span>
        </button>
      </div>
    </div>

    <p id="status" class="text-center mt-6 text-base min-h-[32px]"></p>

    <!-- Trust -->
    <div class="text-center mt-10 text-sm text-zinc-500">
      Attivazione gratuita per 3 mesi • Rinnovo 2€/anno
    </div>

    <!-- Come funziona (cliccabile) -->
    <div class="mt-16 text-center">
      <button onclick="showHowItWorks()" 
              class="text-blue-400 hover:text-blue-300 underline decoration-dotted text-lg">
        Come funziona MyQuickTag →
      </button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-zinc-900 py-8 mt-20">
    <div class="max-w-2xl mx-auto px-6 text-xs text-zinc-500 text-center">
      © 2026 MyQuickTag.it — Progetto indipendente
    </div>
  </footer>

  <script>
    async function checkName() {
      let input = document.getElementById('searchInput').value.trim();
      const status = document.getElementById('status');
      
      if (!input) {
        status.innerHTML = `<span class="text-red-400">Inserisci un nome</span>`;
        return;
      }

      input = input.replace('@', '').replace(/\s+/g, '').toLowerCase();
      document.getElementById('searchInput').value = input;

      status.innerHTML = `<span class="text-blue-400"><i class="fas fa-spinner fa-spin"></i> Controllo in corso...</span>`;

      try {
        const res = await fetch(`https://api.airtable.com/v0/app4eQDzqixPDbQTd/Table%201?filterByFormula=LOWER({nome})%3D'${input}'`, {
          headers: { Authorization: "Bearer pat6qz8htyV7b1NSN.f3cdd9392b92318e7b32302f93037810ecb4ee9fbd269c40c0e1c18a93b60b8e" }
        });

        const data = await res.json();

        if (data.records && data.records.length > 0) {
          status.innerHTML = `<span class="text-red-400">❌ @${input} è già preso</span>`;
        } else {
          status.innerHTML = `<span class="text-emerald-400">✅ @${input} è disponibile!</span>`;
          
          // REDIRECT AUTOMATICO alla pagina tag.html
          setTimeout(() => {
            window.location.href = `tag.html?nome=${input}`;
          }, 1200);
        }
      } catch (e) {
        status.innerHTML = `<span class="text-red-400">Errore di connessione. Riprova.</span>`;
      }
    }

    // Enter key support
    document.getElementById('searchInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') checkName();
    });

    function showHowItWorks() {
      alert("Come funziona:\n\n1. Cerchi il tuo @nome\n2. Se è libero lo attivi gratis per 3 mesi\n3. Personalizzi la tua pagina con link, bio, contatti e QR\n4. Condividi solo @tuonome ovunque");
    }
  </script>
</body>
</html>
