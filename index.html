<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag</title>
    <style>
        /* RESET E SFONDO LUXURY */
        body {
            background-color: #000000; /* Nero Assoluto */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Inizia dall'alto */
            min-height: 100vh;
            font-family: sans-serif;
            color: #ffffff;
            padding-top: 60px; /* Spazio iniziale dall'alto */
        }

        /* CONTENITORE PRINCIPALE PER I PEZZI CHE AGGIUNGEREMO */
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* QUI ANDRANNO I CODICI DEI SINGOLI BLOCCHI */
    </style>
</head>
<body>

    <div class="container">
  <div style="position: relative; width: 120px; height: 120px; margin-bottom: 20px;">
    
    <div style="width: 100%; height: 100%; border: 12px solid #50C878; border-radius: 50%; box-sizing: border-box;"></div>
    
    <div style="position: absolute; width: 12px; height: 40px; background: #50C878; bottom: -12px; right: 8px; transform: rotate(-45deg); border-radius: 6px;"></div>

    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); color: #ffffff; font-family: sans-serif; font-size: 70px; font-weight: bold; text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);">@</div>

  </div>
    </div>
  </div>
</div>      


</body>
</html>
