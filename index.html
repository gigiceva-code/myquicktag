<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag - Un @nome. Una sola identità.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #f5f7ff, #eef1ff); min-height: 100vh; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-sans text-gray-900 flex flex-col min-h-screen">

    <div class="max-w-xl mx-auto px-6 py-20 flex-grow text-center">
        <header class="mb-12">
            <h1 class="text-5xl md:text-6xl font-extrabold text-gray-900 mb-4 tracking-tight">MyQuickTag</h1>
            <h2 class="text-2xl text-gray-700 font-medium">Un @nome. Una sola identità.</h2>
            <p class="mt-4 text-gray-500 max-w-sm mx-auto">Un solo link per condividere contatti, social e informazioni.</p>
        </header>

        <div class="flex flex-col gap-4 justify-center mb-8">
            <div class="flex items-center bg-white border-2 border-white rounded-2xl px-4 py-4 max-w-sm mx-auto w-full shadow-sm focus-within:border-blue-400 transition-all group">
                <span class="text-gray-400 text-lg font-bold transition-colors group-focus-within:text-blue-500 mr-1">@</span>
                <input type="text" id="nomeInput" placeholder="nome" class="bg-transparent border-none outline-none w-full text-lg text-gray-900 p-0 focus:ring-0">
            </div>
            
            <button id="searchButton" class="max-w-sm mx-auto w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-2xl shadow-lg transition-all active:scale-95 text-xl">
                Controlla il tuo @nome
            </button>
        </div>

        <div id="result" class="min-h-[120px] transition-all"></div>

        <div style="margin-top:50px; font-size:12px; color:gray; text-align:center;">
          <a href="#" class="hover:underline" onclick="alert('MyQuickTag assegna il diritto di utilizzo del nome ma non la proprietà del marchio.')">Termini</a>
          |
          <a href="#" class="hover:underline" onclick="alert('Non raccogliamo dati personali sensibili. Utilizzati solo per gestione tecnica del servizio.')">Privacy</a>
          |
          <a href="#" class="hover:underline" onclick="alert('Utilizziamo cookie tecnici necessari al funzionamento del sito.')">Cookie</a>
        </div>
    </div>

    <script>
        // --- CONFIGURAZIONE AIRTABLE (INSERITA DA GEMINI) ---
        const apiKey = 'pat6qz8htyV7b1NSN.f3cdd9392b92318e7b32302f93037810ecb4ee9fbd269c40c0e1c18a93b60b8e';
        const baseId = 'app4eQDzqixPDbQTd';
        const tableName = "Table 1";

        const input = document.getElementById("nomeInput");
        const result = document.getElementById("result");
        const button = document.getElementById("searchButton");

        button.addEventListener("click", checkNome);
        input.addEventListener("keypress", (e) => { if (e.key === "Enter") checkNome(); });

        async function checkNome() {
          const nome = input.value.trim().toLowerCase();
          if (!nome) {
            result.innerHTML = "<span class='text-red-500 font-bold'>Inserisci un nome.</span>";
            return;
          }

          result.innerHTML = `<div class="loader mt-4"></div><p class="text-gray-500 text-sm mt-2">Controllo...</p>`;

          const url = `https://api.airtable.com/v0/${baseId}/Table%201?filterByFormula=LOWER({nome})='${nome}'`;

          try {
            const res = await fetch(url, { headers: { Authorization: `Bearer ${apiKey}` } });
            const data = await res.json();

            if (data.records && data.records.length > 0) {
              result.innerHTML = `
                <div class="mt-4 bg-red-50 p-4 rounded-xl inline-block border border-red-100">
                    <p class="text-red-600 font-bold text-lg">❌ Nome non disponibile</p>
                </div>`;
            } else {
              result.innerHTML = `
                <div class="mt-4 bg-green-50 p-6 rounded-xl inline-block shadow-sm border border-green-100">
                    <p class="text-green-600 font-bold text-xl mb-1">Disponibile</p>
                    <p class="text-gray-600 text-sm mb-4">3 mesi gratuiti · poi 2€/anno per mantenerlo</p>
                    <button onclick="window.location.href='tag.html?nome=${nome}'" class="bg-green-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-green-700 transition-all">
                        Procedi
                    </button>
                </div>`;
            }

          } catch (error) {
            result.innerHTML = "<span class='text-red-500'>Errore di connessione</span>";
            console.log(error);
          }
        }
    </script>
</body>
</html>
