<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuickTag | Luxury Minimal</title>
    <style>
        :root { --smeraldo: #50C878; --nero: #050505; }
        body { margin: 0; background: var(--nero); color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; }
        
        /* HEADER REFINED */
        header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 30px 0; max-width: 400px; }
        .logo-center { text-align: center; flex: 1; }
        .title { font-weight: 100; letter-spacing: 8px; font-size: 1.2rem; margin: 5px 0; color: white; }
        .slogan { color: var(--smeraldo); font-size: 0.6rem; letter-spacing: 4px; text-transform: uppercase; }

        /* IPHONE FRAME LUXURY */
        .iphone { width: 300px; height: 580px; border: 12px solid #1a1a1a; border-radius: 50px; background: black; position: relative; margin-top: 20px; box-shadow: 0 0 60px rgba(80, 200, 120, 0.15); }
        .screen { padding: 60px 20px; text-align: center; }
        .tag-label { font-size: 0.5rem; letter-spacing: 4px; color: var(--smeraldo); text-transform: uppercase; margin-bottom: 40px; opacity: 0.7; }
        #display-name { font-size: 1.8rem; font-weight: 100; margin-bottom: 50px; color: white; }
        
        /* MODULI SOCIAL & CV */
        .social-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; opacity: 0.4; }
        .social-box { border: 1px solid var(--smeraldo); padding: 8px; font-size: 0.5rem; color: var(--smeraldo); letter-spacing: 1px; }
        .cv-box { border: 1px solid white; margin-top: 25px; padding: 15px; font-size: 0.7rem; letter-spacing: 2px; opacity: 0.3; }

        /* INPUT AREA */
        .input-container { margin-top: 40px; text-align: center; }
        input { background: transparent; border: none; border-bottom: 1px solid #333; color: white; text-align: center; font-size: 1.1rem; padding: 15px; width: 280px; outline: none; font-weight: 100; }
        .btn-check { background: var(--smeraldo); color: black; border: none; padding: 20px 60px; font-weight: 800; margin-top: 30px; letter-spacing: 3px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div style="padding-left:20px">☰</div>
    <div class="logo-center">
        <svg width="45" height="45" viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="50" r="45" stroke="#50C878" stroke-width="3" />
            <circle cx="50" cy="50" r="15" stroke="white" stroke-width="3" />
            <path d="M65 65 L80 80" stroke="#50C878" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="title">MY QUICK TAG</div>
        <div class="slogan">Instant Digital Identity</div>
    </div>
    <div style="padding-right:20px">👤</div>
</header>

<div class="iphone">
    <div class="screen">
        <div class="tag-label">Premium Digital Tag</div>
        <div id="display-name">@iltuonome</div>
        <div class="social-grid">
            <div class="social-box">INSTA</div><div class="social-box">TIKTOK</div><div class="social-box">LINKED</div>
            <div class="social-box">X</div><div class="social-box">FB</div><div class="social-box">WEB</div>
        </div>
        <div class="cv-box">PROFESSIONAL CV</div>
    </div>
</div>

<div class="input-container">
    <input type="text" id="tag-input" placeholder="Digita il tuo nome unico..." autocomplete="off">
    <br>
    <button class="btn-check">VERIFICA</button>
</div>

<script>
    const input = document.getElementById('tag-input');
    const display = document.getElementById('display-name');
    input.addEventListener('input', (e) => {
        display.innerText = e.target.value ? '@' + e.target.value.toLowerCase() : '@iltuonome';
    });
</script>

</body>
</html>
