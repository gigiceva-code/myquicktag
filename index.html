<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyQuickTag - Identità Digitale Esclusiva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
    body { 
        font-family: 'Inter', sans-serif; 
        background-color: #0a0a0a; 
        color: white;
        margin: 0;
        overflow-x: hidden;
    }
    
    .pulse-deep { 
        animation: pulseDeep 6s cubic-bezier(0.4, 0, 0.6, 1) infinite; 
    }
    @keyframes pulseDeep { 
        0%, 100% { opacity: 1; transform: scale(1); } 
        50% { opacity: 0.3; transform: scale(0.98); } 
    }

    /* iPhone con bordi DEFINITI per visibilità esterna */
    .iphone-frame {
      width: 170px;
      height: 310px;
      background: #000;
      border-radius: 30px;
      /* Bordo metallico che stacca dallo sfondo nero */
      border: 3px solid #333; 
      position: relative;
      /* Ombra chiara per creare profondità */
      box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 15px rgba(255,255,255,0.05);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .btn-emerald {
      background-color: #10b981;
      color: #000 !important;
      font-weight: 900;
      animation: pulseEmerald 3s ease-in-out infinite;
    }
    @keyframes pulseEmerald {
      0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
      50% { transform: scale(1.04); box-shadow: 0 0 35px rgba(16, 185, 129, 0.6); }
    }

    .input-group {
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: #121212;
    }

    .phone-button {
      width: 100%;
      height: 22px;
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      margin-bottom: 6px;
      border: 1px solid rgba(255,255,255,0.15); /* Bordo più marcato per l'esterno */
      display: flex;
      align-items: center;
      padding-left: 8px;
      font-size: 7px;
      font-weight: 900;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7); /* Testo più luminoso */
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="w-full p-6 flex justify-between items-center z-50">
    <div class="w-8 h-8"></div>
    <h1 class="text-3xl font-black tracking-tighter italic uppercase">MyQuickTag</h1>
    <button class="text-white text-3xl active:scale-95"><i class="fas fa-bars"></i></button>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center px-6 text-center">
    
    <div style="width:100%; display:flex; justify-content:center;">
      <div class="iphone-frame">
        <div class="h-full p-4 flex flex-col items-center" style="background: linear-gradient(180deg, #111 0%, #000 100%);">
            
            <div style="width:50px; height:10px; background:#222; border-radius:0 0 8px 8px; margin-bottom:12px;"></div>

            <div style="width:55px; height:55px; border-radius:50%; background:#222; margin-bottom:8px; border:1px solid #444; display:flex; align-items:center; justify-center;">
                <i class="fas fa-user text-zinc-600 text-xs"></i>
            </div>

            <div style="font-size:15px; font-weight:900; color:#10b981; margin-bottom:2px; text-transform:uppercase;">@iltuonome</div>
            <div style="font-size:8px; color:#666; margin-bottom:15px; font-weight:600; text-transform:uppercase;">Digital Identity</div>

            <div class="phone-button">@ bio</div>
            <div class="phone-button">@ cv</div>
            <div class="phone-button">@ instagram</div>
            <div class="phone-button" style="width:70%;">@ linkedin</div>

            <div style="width:70px; height:70px; background:rgba(16, 185, 129, 0.08); border-radius:12px; margin-top:auto; border:1px solid rgba(16, 185, 129, 0.3); display:flex; align-items:center; justify-center;">
                <i class="fas fa-qrcode text-emerald-500/30 text-2xl"></i>
            </div>
        </div>
      </div>
    </div>

    <div class="mb-6 pulse-deep">
      <p class="text-xl font-black tracking-tighter uppercase italic leading-tight text-white">Un mondo dentro il tuo nome</p>
      <p class="text-xl font-black tracking-tighter uppercase italic leading-tight text-white mt-1">Il tuo nome nel mondo</p>
    </div>

    <div class="mb-8">
      <p class="text-[10px] font-black uppercase tracking-[0.4em] text-emerald-400 mb-2">Instant Digital Identity</p>
      <p class="text-zinc-400 text-[12px] max-w-[280px] mx-auto leading-relaxed font-medium">
        Sfrutta l’innovazione: tutti i tuoi link in un unico Tag al prezzo di una colazione all'anno.
      </p>
    </div>

    <div class="w-full max-w-[300px] space-y-4">
      <div class="rounded-[2.2rem] p-1 input-group shadow-2xl">
        <div class="flex items-center px-6 py-4">
          <span class="text-2xl font-black text-emerald-500">@</span>
          <input id="searchInput" type="text" placeholder="iltuonome" 
                 class="flex-1 bg-transparent outline-none text-xl ml-1 text-white font-bold uppercase placeholder-zinc-800 tracking-tighter">
        </div>
      </div>
      
      <button onclick="checkName()" 
              class="w-full btn-emerald py-5 rounded-[2.2rem] text-xl uppercase tracking-widest active:scale-95 transition-transform">
        Verifica
      </button>
    </div>
    
    <p id="status" class="mt-6 text-[10px] font-black uppercase tracking-[0.2em] min-h-[20px] text-zinc-600 italic"></p>
  </main>

  <footer class="pb-8 opacity-10 flex justify-center">
    <div class="w-1.5 h-1.5 bg-white rounded-full mx-1"></div>
    <div class="w-1.5 h-1.5 bg-white rounded-full mx-1"></div>
    <div class="w-1.5 h-1.5 bg-white rounded-full mx-1"></div>
  </footer>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <script>
    const AIRTABLE_PAT = "patWfr8e2nM0vvhtR.69b3beff785c42c9d59a6d1f898023a16ce907f43e22716d94b497eef8dec54c";
    const BASE_ID = "appG2S8jV9Ams3wYq";
    const TABLE_NAME = "Tabella 1";

    async function checkName() {
      let input = document.getElementById('searchInput').value.trim();
      const status = document.getElementById('status');
      if (!input) return;
      input = input.replace('@', '').replace(/\s+/g, '').toLowerCase();
      status.innerHTML = '<span class="animate-pulse">ANALISI...</span>';

      try {
        const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={nome}='${input}'`;
        const response = await fetch(url, { headers: { Authorization: `Bearer ${AIRTABLE_PAT}` } });
        const data = await response.json();

        if (data.records && data.records.length > 0) {
          status.innerHTML = 'GIÀ NOTARIZZATO';
        } else {
          status.innerHTML = 'DISPONIBILE';
          setTimeout(() => { window.location.href = `tag.html?nome=${input}`; }, 800);
        }
      } catch (e) { status.innerHTML = 'ERRORE CONNESSIONE'; }
    }
    document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') checkName(); });
  </script>
</body>
</html>
