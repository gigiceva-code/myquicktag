
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit</title>

<style>
body {
    background:#000;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:40px;
}
textarea {
    width:250px;
    height:100px;
}
button {
    padding:15px;
    background:#50C878;
    border:none;
    border-radius:10px;
}
</style>
</head>

<body>

<h2 id="nome"></h2>

<textarea id="bio" placeholder="Scrivi la tua bio"></textarea>
<br><br>
<button onclick="salva()">Salva</button>

<script>
const AIRTABLE_TOKEN = "patAnfD8O0FfKWhZc.854657155050f24025d57d5985868875385657454c504a554a5a544a42534c56";
const BASE_ID = "app4eQDzqixPDbQTd";
const TABLE_NAME = "Table 1";

const params = new URLSearchParams(window.location.search);
const username = params.get("nome");

document.getElementById("nome").innerText = "@" + username;

async function salva(){
    const bio = document.getElementById("bio").value;

    const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={Tag}='@${username}'`, {
        headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` }
    });

    const data = await res.json();
    const id = data.records[0].id;

    await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}/${id}`, {
        method: "PATCH",
        headers: {
            Authorization: `Bearer ${AIRTABLE_TOKEN}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            fields: { Bio: bio }
        })
    });

    alert("Salvato!");
    window.location.href = "profile.html?nome=" + username;
}
</script>

</body>
</html>
