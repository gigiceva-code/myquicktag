<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Configurazione Ecosistema - myquicktag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link id="dynamic-manifest" rel="manifest" href="">
    <link id="dynamic-icon" rel="icon" href="">
    <style>
        :root {
            --bg-esterno: #0d0d0f;
            --accent-smeraldo: #50C878;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        /* --- MOTORE "GABBIA D'ACCIAIO" --- */
        html, body {
            height: 100%; width: 100%; overflow: hidden; background-color: var(--bg-esterno);
            font-family: 'Inter', sans-serif; touch-action: none;
        }
        body { display: flex; justify-content: center; align-items: center; }

        .configurator-wrapper {
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
            padding: 16px 16px calc(16px + env(safe-area-inset-bottom)) 16px; 
        }

        #profile-content {
            width: 100%; max-width: 410px; height: 100%; max-height: 840px;
            padding: 40px 24px 32px 24px;
            border-radius: 28px;
            display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 30px 70px rgba(0,0,0,0.9); overflow: hidden; 
            transition: all 0.4s ease; /* Transizione morbida per il cambio tema */
        }

      /* --- I 5 TEMI UFFICIALI RICALIBRATI (LUXURY) --- */
        
        /* 1. EMERALD */
        #profile-content[data-theme="emerald"] { border: 1px solid rgba(0, 230, 128, 0.8); }
        #profile-content[data-theme="emerald"] .username-capsule { background: rgba(0, 230, 128, 0.02); border: 1px solid rgba(0, 230, 128, 0.3); }
        #profile-content[data-theme="emerald"] .username-display { color: #ffffff; }
        #profile-content[data-theme="emerald"] .testo-pass { color: #00E680; text-shadow: 0 0 10px rgba(0, 230, 128, 0.2); }

        /* 2. BLACK DNA (Stealth Puro) */
        #profile-content[data-theme="black_dna"] { border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: inset 0 0 20px rgba(255,255,255,0.02); } 
        #profile-content[data-theme="black_dna"] .username-capsule { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); }
        #profile-content[data-theme="black_dna"] .username-display { color: #ffffff; }
        #profile-content[data-theme="black_dna"] .testo-pass { color: #ffffff; opacity: 0.9; }

        /* 3. TITANIUM */
        #profile-content[data-theme="titanium"] { border: 1px solid rgba(176, 176, 181, 0.8); }
        #profile-content[data-theme="titanium"] .username-capsule { background: rgba(176, 176, 181, 0.02); border: 1px solid rgba(176, 176, 181, 0.3); }
        #profile-content[data-theme="titanium"] .username-display { color: #ffffff; }
        #profile-content[data-theme="titanium"] .testo-pass { color: #b0b0b5; }

        /* 4. OBSIDIAN GOLD */
        #profile-content[data-theme="obsidian_gold"] { border: 1px solid rgba(229, 193, 88, 0.8); }
        #profile-content[data-theme="obsidian_gold"] .username-capsule { background: rgba(229, 193, 88, 0.02); border: 1px solid rgba(229, 193, 88, 0.3); }
        #profile-content[data-theme="obsidian_gold"] .username-display { color: #ffffff; }
        #profile-content[data-theme="obsidian_gold"] .testo-pass { color: #e5c158; text-shadow: 0 0 10px rgba(229, 193, 88, 0.2); }

        /* 5. SATIN ROSE */
        #profile-content[data-theme="satin_rose"] { border: 1px solid rgba(200, 150, 142, 0.8); }
        #profile-content[data-theme="satin_rose"] .username-capsule { background: rgba(200, 150, 142, 0.02); border: 1px solid rgba(200, 150, 142, 0.3); }
        #profile-content[data-theme="satin_rose"] .username-display { color: #ffffff; }
        #profile-content[data-theme="satin_rose"] .testo-pass { color: #c8968e; text-shadow: 0 0 10px rgba(200, 150, 142, 0.2); }
        
/* HEADER - Riorganizzato per centratura assoluta */
        .header-monolith {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
        }

       /* --- SOLUZIONE 4: BADGE LUXURY ADATTIVO --- */
        .username-capsule {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* Taglio geometrico luxury stile stemma */
            border-radius: 16px 4px 16px 4px; 
            padding: 14px 24px;
            margin: 15px auto;
            width: fit-content;
            max-width: 92%;
            min-height: 56px;
            box-sizing: border-box;
            position: relative;
            transition: all 0.3s ease;
        }

        /* L'accento geometrico superiore tipico dei brand di lusso */
        .username-capsule::before {
            content: "◆";
            font-size: 0.55rem;
            margin-bottom: 6px;
            opacity: 0.6;
            display: block;
            letter-spacing: 0;
        }

       .username-display {
            font-size: 0.95rem; 
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            /* Tassativo: Niente tagli automatici, decide il nostro JS */
            white-space: normal;
word-break: keep-all; /* Impedisce di spezzare le parole a metà */
overflow-wrap: break-word; /* Va a capo solo se la parola è più larga dell'intero schermo */
        }
        #mainGrid { display: flex; flex-direction: column; justify-content: space-between; align-items: center; flex: 1; width: 100%; padding: 30px 0 30px 0; }
        .casella { padding: 4px 0; cursor: pointer; transition: opacity 0.2s; }
        .casella:active { opacity: 0.6; }

        .testo-pass { font-size: 0.75rem; letter-spacing: 3px; font-weight: 300; transition: all 0.4s ease;}
        .testo-crea { font-size: 0.75rem; letter-spacing: 3px; font-weight: 500; color: #ffffff; transition: opacity 0.5s ease-in-out;}

        /* --- IL CASSETTO FROSTED GLASS --- */
        .drawer-backdrop { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: transparent; z-index: 1900; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .drawer-backdrop.active { opacity: 1; pointer-events: auto; }

                      
          /* IL CASSETTO BLINDATO (L'ID vince su tutto) */
        #drawer-style.drawer-glass {
            position: fixed !important; 
            bottom: -100% !important; 
            
            /* Staccato maggiormente dai lati per mostrare la cornice */
            left: 26px !important; 
            right: 26px !important; 
            width: auto !important; 
            margin: 0 auto !important; 
            max-width: 360px !important; /* Più stretto della cornice (max 410px) */
            
            background: rgba(30, 30, 35, 0.3) !important; 
            backdrop-filter: blur(15px) !important; 
            -webkit-backdrop-filter: blur(15px) !important; 
            
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 28px !important; 
            padding: 24px !important;
            z-index: 2000 !important; 
            transition: bottom 0.4s cubic-bezier(0.32, 0.72, 0, 1) !important; 
            box-sizing: border-box !important;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8) !important; 
        }

        /* Il galleggiamento forzato */
        #drawer-style.drawer-glass.open { 
            bottom: 24px !important; 
        }


        /* HEADER E TITOLO SFINATI */
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 4px; }
        .drawer-title { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; color: #ffffff; flex: 1; text-align: center; }

        .drawer-close { color: rgba(255, 255, 255, 0.6); font-size: 1rem; cursor: pointer; padding: 5px; width: 30px; text-align: center; }
        .drawer-close:active { color: #ffffff; }

        /* BARRE DI SELEZIONE */
        .style-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
        .style-bar-label { cursor: pointer; display: block; }
        .style-bar-label input { display: none; }
        .style-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04); border-radius: 10px;
            color: #a0a0a0; font-size: 0.65rem; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .color-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .style-bar-label input:checked + .style-bar { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); color: #ffffff; }

        /* BOTTONE RIPRISTINATO ALLA SUA BELLEZZA ORIGINALE */
        .btn-crea {
            display: block; width: 100%; padding: 16px; background: #ffffff; color: #000000;
            border: none; border-radius: 14px; font-weight: 600; font-size: 0.85rem;
            letter-spacing: 2px; cursor: pointer; transition: transform 0.2s;
            margin: 0 auto; text-align: center;
        }
        .btn-crea:active { transform: scale(0.98); }
                      /* --- NOTIFICA TOAST (Feedback Visivo Affinato) --- */
        #toast-notification {
            position: fixed;
            bottom: -100px; /* Ora è nascosta in basso */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 35, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px; 
            padding: 10px 20px; /* Più snella ed elegante */
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-size: 0.65rem; /* Font leggermente ridotto */
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap; /* TASSATIVO: Impedisce l'a capo */
            z-index: 3000;
            /* Transizione spostata su "bottom" */
            transition: bottom 0.5s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.5s ease;
            opacity: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        #toast-notification.show {
            bottom: 60px; /* Galleggia morbida sopra il tasto + CREA */
            opacity: 1;
        }

        #toast-notification i {
            color: var(--accent-smeraldo);
            font-size: 1rem;
        }
          /* --- QR MODAL (APPLE WALLET STYLE) --- */
        .qr-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 3000; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .qr-modal-overlay.active { opacity: 1; pointer-events: auto; }

        .qr-card {
            width: 290px; background: rgba(30, 30, 35, 0.4);
            border-radius: 32px; padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; flex-direction: column; align-items: center;
            transform: scale(0.9) translateY(20px); transition: all 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            position: relative;
        }
        .qr-modal-overlay.active .qr-card { transform: scale(1) translateY(0); }

        .qr-close-btn {
            position: absolute; top: 20px; right: 24px; color: rgba(255, 255, 255, 0.4);
            font-size: 1.2rem; cursor: pointer; transition: color 0.2s; padding: 5px;
        }
        .qr-close-btn:active { color: #ffffff; }

        .qr-title-modal { font-size: 0.8rem; letter-spacing: 4px; font-weight: 500; color: #fff; margin-bottom: 35px; text-transform: uppercase;}

        .qr-svg-wrapper {
            width: 190px; height: 190px; padding: 20px; border-radius: 24px;
            background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center;
            transition: all 0.5s ease;
        }
        .qr-svg { width: 100%; height: 100%; transition: all 0.5s ease; }
        
        /* --- SINCRONIZZAZIONE COLORI QR (EFFETTO ILLUMINATO) --- */
        body[data-qr-theme="emerald"] .qr-svg-wrapper { border: 1px solid rgba(0, 230, 128, 0.25); box-shadow: 0 0 35px rgba(0, 230, 128, 0.15); }
        body[data-qr-theme="emerald"] .qr-svg { fill: #00E680; filter: drop-shadow(0 0 8px rgba(0, 230, 128, 0.4)); }

        body[data-qr-theme="black_dna"] .qr-svg-wrapper { border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 0 35px rgba(255, 255, 255, 0.03); }
        body[data-qr-theme="black_dna"] .qr-svg { fill: #ffffff; filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.25)); }

        body[data-qr-theme="titanium"] .qr-svg-wrapper { border: 1px solid rgba(176, 176, 181, 0.2); box-shadow: 0 0 35px rgba(176, 176, 181, 0.1); }
        body[data-qr-theme="titanium"] .qr-svg { fill: #b0b0b5; }

        body[data-qr-theme="obsidian_gold"] .qr-svg-wrapper { border: 1px solid rgba(229, 193, 88, 0.25); box-shadow: 0 0 35px rgba(229, 193, 88, 0.15); }
        body[data-qr-theme="obsidian_gold"] .qr-svg { fill: #e5c158; filter: drop-shadow(0 0 8px rgba(229, 193, 88, 0.35)); }

        body[data-qr-theme="satin_rose"] .qr-svg-wrapper { border: 1px solid rgba(200, 150, 142, 0.25); box-shadow: 0 0 35px rgba(200, 150, 142, 0.15); }
        body[data-qr-theme="satin_rose"] .qr-svg { fill: #c8968e; filter: drop-shadow(0 0 8px rgba(200, 150, 142, 0.35)); }
       
                /* --- DOCK BAR INFERIORE --- */
        .luxury-dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            /* Parte nascosta 100px più in basso */
            transform: translateX(-50%) translateY(100px); 
            background: rgba(30, 30, 35, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            display: flex;
            gap: 30px;
            padding: 14px 32px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* Classe per farla apparire */
        .luxury-dock.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .dock-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: color 0.3s;
        }

        .dock-item:active {
            transform: scale(0.9);
        }

        .dock-item.active, .dock-item:hover {
            color: #ffffff;
        }

        .dock-item i {
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .dock-item span {
            font-size: 0.5rem;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

    </style>
</head>
<body>

   <div class="configurator-wrapper">
       <div id="profile-content" data-theme="black_dna"> 
           <div class="header-monolith">
                <div class="username-capsule">
                    <div class="username-display" id="tag-username">@TUONOME.IT</div>
                </div>
            </div>

            <div id="mainGrid">
                
                <div class="casella" id="casella-qr" onclick="apriModalQR()">
                    <span class="testo-pass">DIGITAL PASS</span>
                </div>

                <div class="casella" id="casella-crea" onclick="apriDrawer('drawer-identita')">
                    <span class="testo-crea">+ CREA LA TUA TAG</span>
                </div>
            </div>
       </div>
   </div>

   <div class="drawer-backdrop" id="drawer-backdrop" onclick="chiudiSenzaSalvare()"></div>

   <div class="drawer-glass" id="drawer-style">
       <div class="drawer-header" style="flex-direction: column; align-items: center; margin-bottom: 24px; position: relative;">
           <i class="fas fa-chevron-down drawer-close" onclick="chiudiSenzaSalvare()" style="position: absolute; left: 0; top: 0;"></i>
           <div class="drawer-title" style="font-size: 0.75rem; letter-spacing: 3px;">DIGITAL STYLE</div>
           <div style="font-size: 0.55rem; color: #86868b; letter-spacing: 1px; margin-top: 6px; text-transform: uppercase;">Definisci il tuo stile</div>
       </div>
       <div class="drawer-glass" id="drawer-identita">
       <div class="drawer-header" style="flex-direction: column; align-items: center; margin-bottom: 24px; position: relative;">
           <i class="fas fa-chevron-down drawer-close" onclick="chiudiSenzaSalvare()" style="position: absolute; left: 0; top: 0;"></i>
           <div class="drawer-title" style="font-size: 0.75rem; letter-spacing: 3px;">IDENTITÀ BRAND</div>
           <div style="font-size: 0.55rem; color: #86868b; letter-spacing: 1px; margin-top: 6px; text-transform: uppercase;">Chi sei?</div>
       </div>

       <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 24px;">
           <div>
               <label style="font-size: 0.6rem; color: #a0a0a0; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; display: block;">Nome Mostrato (Usa gli spazi)</label>
               <input type="text" id="field-username_display" placeholder="Es. Concessionaria Audi Volkswagen" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 14px; border-radius: 12px; font-family: 'Inter', sans-serif; outline: none;">
           </div>

           <div>
               <label style="font-size: 0.6rem; color: #a0a0a0; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; display: block;">La tua Bio / Payoff</label>
               <textarea id="field-bio" placeholder="Descrivi il tuo business in poche parole..." rows="3" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 14px; border-radius: 12px; font-family: 'Inter', sans-serif; outline: none; resize: none;"></textarea>
           </div>
       </div>

       <button class="btn-crea" onclick="confermaEChiudiCassetto()">SALVA IDENTITÀ</button>
   </div>

       <div class="style-list">
           <label class="style-bar-label">
               <input type="radio" name="digital_style" value="black_dna" checked onchange="applicaTemaLive()">
               <div class="style-bar">
                   <span>Black DNA</span>
                   <div class="color-dot" style="background: #ffffff; border: 1px solid rgba(255,255,255,0.3);"></div>
               </div>
           </label>

           <label class="style-bar-label">
               <input type="radio" name="digital_style" value="emerald" onchange="applicaTemaLive()">
               <div class="style-bar">
                   <span>Emerald</span>
                   <div class="color-dot" style="background: #00E680;"></div>
               </div>
           </label>

           <label class="style-bar-label">
               <input type="radio" name="digital_style" value="titanium" onchange="applicaTemaLive()">
               <div class="style-bar">
                   <span>Titanium</span>
                   <div class="color-dot" style="background: #b0b0b5;"></div>
               </div>
           </label>

           <label class="style-bar-label">
               <input type="radio" name="digital_style" value="obsidian_gold" onchange="applicaTemaLive()">
               <div class="style-bar">
                   <span>Obsidian Gold</span>
                   <div class="color-dot" style="background: #e5c158;"></div>
               </div>
           </label>

           <label class="style-bar-label">
               <input type="radio" name="digital_style" value="satin_rose" onchange="applicaTemaLive()">
               <div class="style-bar">
                   <span>Satin Rose</span>
                   <div class="color-dot" style="background: #c8968e;"></div>
               </div>
           </label>
       </div>
       <button class="btn-crea" onclick="confermaEChiudiCassetto()" style="margin-top: 10px;">CONFERMA STILE</button>
   </div>
   <div class="qr-modal-overlay" id="modal-qr" onclick="chiudiModalQR(event)">
       <div class="qr-card">
           <i class="fas fa-times qr-close-btn" onclick="chiudiModalQR(event)"></i>
           <div class="qr-title-modal">ANTEPRIMA STILE</div>
           
           <div class="qr-svg-wrapper">
               <svg viewBox="0 0 100 100" class="qr-svg" xmlns="http://www.w3.org/2000/svg">
                   <path d="M10,10 h22 v22 h-22 z M14,14 h14 v14 h-14 z M18,18 h6 v6 h-6 z" />
                   <path d="M68,10 h22 v22 h-22 z M72,14 h14 v14 h-14 z M76,18 h6 v6 h-6 z" />
                   <path d="M10,68 h22 v22 h-22 z M14,72 h14 v14 h-14 z M18,76 h6 v6 h-6 z" />
                   
                   <path d="M38,10 h6 v6 h-6 z M48,10 h16 v6 h-16 z M38,20 h26 v6 h-26 z M10,38 h6 v16 h-6 z M20,38 h22 v6 h-22 z M46,38 h6 v16 h-6 z M56,38 h26 v6 h-26 z M74,48 h16 v6 h-16 z M38,48 h6 v6 h-6 z M38,58 h22 v6 h-22 z M58,58 h6 v24 h-6 z M74,68 h16 v16 h-16 z M38,78 h6 v6 h-6 z M48,68 h6 v16 h-6 z M28,10 h6 v6 h-6 z M28,28 h6 v6 h-6 z M10,28 h6 v6 h-6 z M66,10 h6 v6 h-6 z M82,28 h6 v6 h-6 z M28,66 h6 v6 h-6 z M10,66 h6 v6 h-6 z M68,68 h6 v6 h-6 z M14,48 h4 v4 h-4 z M24,54 h4 v4 h-4 z M24,14 h4 v4 h-4 z M54,24 h4 v4 h-4 z M84,48 h4 v4 h-4 z" />
                   
                   <path d="M42,46 v-4 a8,8 0 0,1 16,0 v4 h3 v18 h-22 v-18 z M45,46 h10 v-4 a5,5 0 0,0 -10,0 z M48.5,53.5 a1.5,1.5 0 0,0 3,0 v-2 a1.5,1.5 0 0,0 -3,0 z" />
               </svg>
           </div>
           
           <div style="font-size: 0.6rem; color: rgba(255,255,255,0.5); letter-spacing: 2px; margin-top: 24px; text-transform: uppercase;">QR Demo • Attivazione post-checkout</div>
       </div>
   </div>
    
   <!-- DOCK BAR (Menu di navigazione inferiore) -->
   <div class="luxury-dock" id="bottom-dock">
       <!-- Tasto per riaprire lo Stile -->
       <div class="dock-item" onclick="apriDrawerStyle()">
           <i class="fas fa-palette"></i>
           <span>STILE</span>
       </div>
       
       <!-- Altre icone (es. Profilo, Piani) andranno aggiunte qui in futuro -->
   </div>

   <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
    // --- MOTORE CENTRALE MYQUICKTAG ---
    const params = new URLSearchParams(window.location.search);
    const nomeUtente = params.get("u");
    let canaliCorrenti = [];
    let activeDrawerId = null;

    document.addEventListener("DOMContentLoaded", () => {
        if (nomeUtente) { 
            const nomePulito = nomeUtente.replace('@', '').trim().toUpperCase();
            const tagElement = document.getElementById("tag-username");

            // Scalatura primordiale (senza spazi)
            if (nomePulito.length > 28) {
                tagElement.style.fontSize = "0.65rem";
            } else if (nomePulito.length > 20) {
                tagElement.style.fontSize = "0.75rem";
            } else {
                tagElement.style.fontSize = "0.95rem";
            }
            
            // Tag vuota primordiale: solo la @ e il nome
            tagElement.innerText = "@" + nomePulito;
            inizializzaPagina(); 
        }

        attivaAscoltatoriLive();
        setTimeout(aggiornaTagLive, 100);
    });

    // --- LOGICA A "BOLLA" (LOCAL STATE) & UI LIVE ---
    function aggiornaTagLive() {
        const container = document.getElementById('profile-content');
        if (!container) return;

        const elUsername = document.getElementById('tag-username');
        const fieldDisplay = document.getElementById('field-username_display');

        // La magia editoriale: se scrivi il nome con gli spazi, vince lui sul monoblocco della URL
        if (elUsername) {
            if (fieldDisplay && fieldDisplay.value.trim() !== '') {
                let valDisplay = fieldDisplay.value.trim().toUpperCase();
                if (!valDisplay.startsWith('@')) valDisplay = '@' + valDisplay;
                
                elUsername.innerText = valDisplay;
                elUsername.style.fontSize = "0.95rem"; // Il CSS penserà ad andare a capo in modo fluido
            } else if (nomeUtente) {
                const nomePulito = nomeUtente.replace('@', '').trim().toUpperCase();
                elUsername.innerText = '@' + nomePulito;
            }
        }

        // Cambio Temi
        const stileSelezionato = document.querySelector('input[name="digital_style"]:checked')?.value || "black_dna";
        container.setAttribute('data-theme', stileSelezionato);
        document.body.setAttribute('data-qr-theme', stileSelezionato);

        const getVal = (id) => document.getElementById(id)?.value?.trim() || '';

        // Mappa visibilità campi primari
        const mappaCaselle = {
            'casella-bio':      getVal('field-bio'),
            'casella-sito':     getVal('field-sito_web'),
            'casella-cv':       getVal('field-cv'),
            'casella-contatti': getVal('vcf-telefono1') || getVal('vcf-email1') || getVal('field-email'),
        };

        for (const [id, valore] of Object.entries(mappaCaselle)) {
            const el = container.querySelector('#' + id);
            if (el) el.style.display = valore ? 'flex' : 'none';
        }

        // Tasto Crea Scompare se ho inserito dei dati
        const haIdentita = fieldDisplay?.value || getVal('field-bio');
        const elCrea = container.querySelector('#casella-crea');
        if (elCrea) elCrea.style.display = haIdentita ? 'none' : 'flex';
    }

    function attivaAscoltatoriLive() {
        // Ogni volta che digiti, la tag cambia in tempo reale a zero impatto server
        const selettori = ['field-username_display', 'field-bio', 'field-email', 'field-sito_web', 'field-cv', 'field-quick_action_tipo', 'field-quick_action_url', 'vcf-telefono1', 'vcf-nome'];
        selettori.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', aggiornaTagLive);
                el.addEventListener('change', aggiornaTagLive);
            }
        });
    }

    // --- GESTIONE INTERFACCIA E CASSETTI (DRAWERS) ---
    function apriDrawer(idDrawer) {
        document.querySelectorAll('.drawer-glass.open').forEach(d => {
            if(d.id !== idDrawer) d.classList.remove('open');
        });

        const drawer = document.getElementById(idDrawer);
        const backdrop = document.getElementById('drawer-backdrop');
        
        if (backdrop) backdrop.classList.add('active');
        activeDrawerId = idDrawer;

        setTimeout(() => { if (drawer) drawer.classList.add('open'); }, 10);
    }

    function chiudiSenzaSalvare() {
        document.querySelectorAll('.drawer-glass').forEach(d => d.classList.remove('open'));
        const backdrop = document.getElementById('drawer-backdrop');
        if (backdrop) {
            setTimeout(() => backdrop.classList.remove('active'), 300);
        }
        activeDrawerId = null;
        aggiornaTagLive();
    }

    function confermaEChiudiCassetto() {
        aggiornaTagLive();
        
        // Logica a Bolla: qui salviamo nel Local State visivo, 
        // e opzionalmente in background tramite draft_json (Sbloccato)
        salvaDati(false, true); 

        // Accende la dock se non si vedeva
        const dock = document.getElementById('bottom-dock');
        if(dock && (document.getElementById('field-username_display')?.value || document.getElementById('field-bio')?.value)) {
            dock.classList.add('show');
        }
        
        chiudiSenzaSalvare();
    }

    // --- GESTIONE API AIRTABLE ---
    async function inizializzaPagina() {
        const nomePulito = nomeUtente.replace('@', '').trim().toLowerCase();

        try {
            const response = await fetch(`/api/get-profile?u=${nomePulito}`);
            const data = await response.json();

            const f = (() => {
                if (data.fields?.draft_json) {
                    try {
                        const bozza = JSON.parse(data.fields.draft_json);
                        return { ...bozza, stato: data.fields.stato, plan: data.fields.plan };
                    } catch(e) {}
                }
                return data.fields || data;
            })();

            if (f) {
                // Popolamento Identità
                if (f.username_display) {
                    const elDisp = document.getElementById('field-username_display');
                    if (elDisp) elDisp.value = f.username_display.replace('@', '');
                }

                const campi = ['bio', 'email', 'sito_web', 'cv'];
                campi.forEach(c => {
                    const el = document.getElementById(`field-${c}`);
                    if (el && f[c]) el.value = f[c];
                });

                // Popolamento Stile
                if (f.digital_style) {
                    const radio = document.querySelector(`input[name="digital_style"][value="${f.digital_style}"]`);
                    if (radio) radio.checked = true;
                }
                
                aggiornaTagLive();
            }
        } catch (e) { console.error("Errore inizializzazione:", e); }
    }

    async function salvaDati(mostraAnteprima = false, salvataggioSilenzioso = false) {
        const tagDallUrl = params.get("u") || "";
        const nomePerSistema = tagDallUrl.replace('@', '').trim().toLowerCase();
        const getVal = (id) => document.getElementById(id) ? document.getElementById(id).value.trim() : "";

        // Il draft_json diventa il nostro scudo anti-sovraccarico per Airtable
        const bozza = {
            username_system: nomePerSistema,
            username_display: getVal("field-username_display") ? '@' + getVal("field-username_display").toUpperCase() : tagDallUrl,
            digital_style: document.querySelector('input[name="digital_style"]:checked')?.value || "black_dna",
            bio: getVal("field-bio"),
            // ... [Gli altri moduli json verranno uniti qui gradualmente]
        }; 

        try {
            const response = await fetch('/api/update-profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username_system: nomePerSistema, draft_json: JSON.stringify(bozza) })
            });
            // Nel caso silenzioso la pagina non si ricarica brutalmente, proteggendo il workflow visivo.
        } catch (error) { console.error("Errore comunicazione server:", error); }
    }

    // --- SISTEMA QR NATIVO LUXURY ---
    function apriModalQR() {
        const modal = document.getElementById('modal-qr');
        if(modal) modal.classList.add('active');
    }
    
    function chiudiModalQR(event) {
        if (event.target.id === 'modal-qr' || event.target.classList.contains('qr-close-btn')) {
            document.getElementById('modal-qr').classList.remove('active');
        }
    }

 // --- TRUCCO SVILUPPATORE (3 tocchi) ---
        let tapCount = 0;
        const usernameDisplay = document.getElementById('tag-username');

        if(usernameDisplay) {
            usernameDisplay.addEventListener('click', function() {
                tapCount++;
                if (tapCount >= 3) {
                    const url = new URL(window.location.href);
                    url.searchParams.set('ts', new Date().getTime());
                    window.location.href = url.toString();
                }
                setTimeout(() => { tapCount = 0; }, 1000);
            });
        }
    </script>


</body>
</html>
