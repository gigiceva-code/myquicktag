<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Configurazione Ecosistema - myquicktag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link id="dynamic-manifest" rel="manifest" href="">
    <link id="dynamic-icon" rel="icon" href="">
    <style>
        :root {
            --bg-esterno: #0d0d0f;
            --bg-chassis: #000000;
            --accent-gold: #d4af37;
            --accent-smeraldo: #50C878;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- MOTORE "GABBIA D'ACCIAIO" --- */
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-esterno);
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .configurator-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 16px calc(16px + env(safe-area-inset-bottom)) 16px; 
        }

        #profile-content {
            width: 100%;
            max-width: 410px;
            height: 100%; 
            max-height: 840px;
            
            padding: 40px 24px 32px 24px;
            background-color: var(--bg-chassis);
            border: 1px solid rgba(80, 200, 120, 0.6); 
            border-radius: 28px;
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 30px 70px rgba(0,0,0,0.9);
            overflow: hidden; 
        }

        /* --- ELEMENTI INTERNI --- */
        .header-monolith { text-align: center; }
        
        .username-capsule {
            display: inline-flex;    
            align-items: center;
            justify-content: center;
            border-radius: 8px; 
            padding: 6px 18px;             
            margin: 10px auto;             
            background: rgba(80, 200, 120, 0.02);
            border: 1px solid rgba(80, 200, 120, 0.25);
        }

        .username-display {
            font-size: 1.05rem; 
            font-weight: 400;
            letter-spacing: 2px; 
            text-transform: uppercase;
            color: #ffffff; 
        }

        #mainGrid {
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            align-items: center;
            flex: 1; 
            width: 100%;
            padding: 30px 0 30px 0; 
        }

        .casella {
            padding: 4px 0; 
            cursor: pointer;
        }

        .casella-invito { font-size: 0; line-height: 0; }
        .casella-invito::after {
            font-size: 0.75rem; 
            letter-spacing: 3px; 
            font-weight: 300;
        }

        #casella-qr .casella-invito::after { content: 'DIGITAL PASS'; color: var(--accent-smeraldo); }
        #casella-crea .casella-invito::after { content: '+ CREA LA TUA TAG'; color: #ffffff; font-weight: 500; }
    </style>
</head>
<body>

   <div class="configurator-wrapper">
       <div id="profile-content">
            
            <div class="header-monolith">
                <div class="username-capsule">
                    <h1 class="username-display" id="tag-username">@...</h1>
                </div>
            </div>

            <div id="mainGrid">
                <div class="casella" id="casella-qr">
                    <span class="casella-invito"></span>
                </div>

                <div class="casella" id="casella-crea">
                    <span class="casella-invito"></span>
                </div>
            </div>

       </div>
   </div>

    <script>
        // Legge il parametro "u" dall'URL in arrivo dall'index
        const params = new URLSearchParams(window.location.search);
        const nomeUtente = params.get("u");

        if (nomeUtente) { 
            const nomePulito = nomeUtente.replace('@', '').trim().toUpperCase();
            document.getElementById("tag-username").innerText = "@" + nomePulito;
        }
    </script>
</body>
</html>
