
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Modifica Profilo - MyQuickTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #ffffff;
            --text-sec: #a0a0a0;
        }

        body {
            margin: 0; padding: 20px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex; flex-direction: column; align-items: center;
        }

        .edit-container { width: 100%; max-width: 400px; }

        .header { text-align: left; margin: 30px 0; width: 100%; }
        .header h1 { font-size: 1.5rem; margin: 0; font-weight: 600; }
        .header p { color: var(--text-sec); font-size: 0.9rem; margin-top: 5px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { 
            display: block; font-size: 0.75rem; color: var(--text-sec); 
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; margin-left: 5px;
        }

        input, textarea {
            width: 100%; padding: 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px; color: white;
            font-family: 'Inter', sans-serif; font-size: 0.95rem;
            box-sizing: border-box; outline: none;
        }

        input:focus, textarea:focus { border-color: rgba(255,255,255,0.3); }

        textarea { height: 100px; resize: none; }

        .save-btn {
            width: 100%; padding: 18px; margin-top: 20px;
            background: white; color: black;
            border: none; border-radius: 14px;
            font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: transform 0.2s;
        }

        .save-btn:active { transform: scale(0.97); }

        .back-link {
            display: block; text-align: center; margin-top: 25px;
            color: var(--text-sec); text-decoration: none; font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="edit-container">
        <div class="header">
            <h1 id="user-display">@NOME</h1>
            <p>Aggiorna le tue informazioni digitali</p>
        </div>

        <div class="form-group">
            <label>Biografia</label>
            <textarea id="field-bio" placeholder="Racconta chi sei..."></textarea>
        </div>

        <div class="form-group">
            <label><i class="fab fa-instagram"></i> Instagram (Link completo)</label>
            <input type="text" id="field-instagram" placeholder="https://instagram.com/tuonome">
        </div>

        <div class="form-group">
            <label><i class="fab fa-linkedin"></i> LinkedIn (Link completo)</label>
            <input type="text" id="field-linkedin" placeholder="https://linkedin.com/in/tuonome">
        </div>

        <div class="form-group">
            <label><i class="fas fa-globe"></i> Sito Web</label>
            <input type="text" id="field-sito" placeholder="https://www.tuosito.it">
        </div>

        <button class="save-btn" onclick="salvaDati()">SALVA MODIFICHE</button>

        <a href="#" id="back-to-dash" class="back-link">Torna alla Dashboard</a>
    </div>

    <script>
     const params = new URLSearchParams(window.location.search);
const nomeUtente = params.get("u"); // Usa 'u' come deciso
let recordId = ""; 

if (nomeUtente) {
    inizializzaPagina();
} else {
    document.body.innerHTML = "<div style='padding:50px; text-align:center;'>Parametro mancante.</div>";
}

async function inizializzaPagina() {
    const nomePulito = nomeUtente.trim().toLowerCase();
    document.getElementById("user-display").innerText = "@" + nomePulito.toUpperCase();
    document.getElementById("back-to-dash").href = `profile.html?u=${nomePulito}`;

    try {
        // Chiamiamo l'API sicura invece di Airtable direttamente
        const response = await fetch(`/api/get-profile?u=${nomePulito}`);
        const data = await response.json();

        if (data.success) {
            recordId = data.id;
            const f = data.fields;

            // Riempiamo i campi
            document.getElementById("field-bio").value = f.bio || "";
            document.getElementById("field-instagram").value = f.instagram || "";
            document.getElementById("field-linkedin").value = f.linkedin || "";
            document.getElementById("field-sito").value = f.sito_web || "";
        }
    } catch (error) {
        console.error("Errore inizializzazione:", error);
    }
}

async function salvaDati() {
    if (!nomeUtente) return alert("Errore: Nome utente mancante.");

    const btn = document.querySelector(".save-btn");
    btn.innerText = "SALVATAGGIO...";
    btn.disabled = true;

    // Prendiamo i valori dai campi
    const datiDaInviare = {
        nomeTag: nomeUtente.trim().toLowerCase(),
        email: "", // Puoi aggiungere un campo email se serve
        telefono: "", // Puoi aggiungere un campo telefono se serve
        messaggio: document.getElementById("field-bio").value, // Usiamo bio come messaggio
        // Aggiungi qui gli altri campi se vuoi passarli a update_profile.js
    };

    try {
        // CHIAMIAMO LA TUA API (update_profile.js) invece di Airtable direttamente
        const response = await fetch('/api/update_profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datiDaInviare)
        });

        const result = await response.json();

        if (response.ok && result.success) {
            alert("Profilo aggiornato!");
            window.location.href = `profile.html?u=${nomeUtente.toLowerCase()}`;
        } else {
            alert("Errore durante il salvataggio: " + (result.error || "Riprova"));
        }
    } catch (error) {
        alert("Errore di connessione con il server.");
    } finally {
        btn.innerText = "SALVA MODIFICHE";
        btn.disabled = false;
    }
}


    </script>
</body>
</html>
