
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Modifica Profilo - MyQuickTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link id="dynamic-manifest" rel="manifest" href="">
    <link id="dynamic-icon" rel="icon" href="">

    <style>
           /* Effetto accensione showroom */
    body {
        opacity: 0;
        transition: opacity 0.6s ease-out;
    } 
    :root {
        --bg-color: #0a0a0a;
        --card-bg: rgba(255, 255, 255, 0.05);
        --border-color: rgba(255, 255, 255, 0.1);
        --accent: #ffffff;
        --text-sec: #a0a0a0;
    }
    body {
        margin: 0; padding: 20px;
        background-color: var(--bg-color);
        font-family: 'Inter', sans-serif;
        color: white;
        display: flex; flex-direction: column; align-items: center;
    }
    .edit-container { 
        width: 100%; 
        max-width: 400px; 
        padding-bottom: 120px; /* Spazio extra per non far coprire i campi dal bottone */
    }
    .header { text-align: left; margin: 30px 0; width: 100%; }
    .header h1 { font-size: 1.5rem; margin: 0; font-weight: 600; }
    .header p { color: var(--text-sec); font-size: 0.9rem; margin-top: 5px; }
    .section-title { 
        font-size: 0.8rem; color: var(--accent); 
        text-transform: uppercase; letter-spacing: 2px;
        margin: 30px 0 15px 5px; border-bottom: 1px solid var(--border-color);
        padding-bottom: 5px;
    }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { 
        display: block; font-size: 0.7rem; color: var(--text-sec); 
        text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; margin-left: 5px;
    }
    input, textarea {
        width: 100%; padding: 12px 15px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 10px; color: white;
        font-family: 'Inter', sans-serif; font-size: 0.9rem;
        box-sizing: border-box; outline: none;
    }
    input:focus, textarea:focus { border-color: rgba(255,255,255,0.3); }
    textarea { height: 80px; resize: none; }
    
    .plan-selector { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 20px 0; }
    .plan-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px; padding: 15px;
        cursor: pointer; display: flex; align-items: center;
    }
    .plan-card.selected {
        border-color: #ffffff;
        background: rgba(255, 255, 255, 0.1);
    }
    .plan-card i { font-size: 1.2rem; margin-right: 15px; color: var(--text-sec); }
    .plan-card.selected i { color: #ffffff; }
    .plan-info h3 { margin: 0; font-size: 0.9rem; font-weight: 600; }
    .plan-info p { margin: 2px 0 0; font-size: 0.75rem; color: var(--text-sec); }

    /* CONTENITORE STICKY CON SFUMATURA FUMO LUXURY PER PROTEGGERE I TESTI */
    .sticky-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: linear-gradient(to top, #0a0a0a 70%, rgba(10,10,10,0) 100%);
        padding: 15px 20px 30px 20px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 100;
    }

    .save-btn {
        width: 100%; max-width: 400px; padding: 18px;
        background: white; color: black;
        border: none; border-radius: 14px;
        font-weight: 600; font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .back-link {
        display: block; text-align: center; margin-top: 15px;
        color: var(--text-sec); text-decoration: none; font-size: 0.85rem; letter-spacing: 0.5px;
    }
    
    .style-selector { margin: 30px 0; text-align: left; }
    .style-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 15px;
    }
    .style-card input { display: none; }
    .style-preview {
        padding: 15px 5px;
        border-radius: 8px;
        border: 1px solid #333;
        font-size: 10px;
        text-transform: uppercase;
        font-weight: bold;
        text-align: center;
        cursor: pointer;
    }
    /* Sostituito il vecchio verde con un Bianco Minimal in linea con il brand */
    .style-card input:checked + .style-preview {
        border-color: #ffffff;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }
    .black { background: #000; color: #fff; }
    .titanium { background: #1c1c1e; color: #f5f5f7; border-color: #48484a; }
    .gold { background: #000; color: #d4af37; border-color: #d4af37; }

    /* RESET DEL TOCCO E MICROPIACERE AMMORTIZZATO SU TUTTO */
    a, div, span, button, .plan-card, .style-preview {
        -webkit-tap-highlight-color: transparent !important;
        tap-highlight-color: transparent !important;
    }
    .plan-card, .style-preview, .save-btn, .back-link {
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                    background-color 0.3s ease, 
                    border-color 0.3s ease !important;
    }
    .plan-card:active, .style-preview:active {
        transform: scale(0.97) !important;
        background: rgba(255, 255, 255, 0.08) !important;
    }
    .save-btn:active {
        transform: scale(0.98) !important;
        background-color: #e5e5e5 !important;
    }

    </style>
</head>
<body>

    <div class="edit-container">
        <div class="header">
            <h1 id="user-display">@CARICAMENTO...</h1>
            <p>Gestisci i tuoi collegamenti</p>
        </div>

        <div class="section-title">Bio</div>
        <div class="form-group">
            <label>La tua biografia</label>
            <textarea id="field-bio" placeholder="Racconta chi sei..."></textarea>
        </div>

        <div class="section-title">Identity Styles</div>
        <div class="style-selector">
            <div class="style-options">
                <label class="style-card">
                    <input type="radio" name="digital_style" value="black" checked>
                    <div class="style-preview black">Black DNA</div>
                </label>
                <label class="style-card">
                    <input type="radio" name="digital_style" value="titanium">
                    <div class="style-preview titanium">Titanium</div>
                </label>
                <label class="style-card">
                    <input type="radio" name="digital_style" value="obsidian_gold">
                    <div class="style-preview gold">Obsidian Gold</div>
                </label>
            </div>
        </div>

        <div class="section-title">Scegli il tuo Piano</div>
        <div class="plan-selector">
            <div class="plan-card selected" id="plan-BASE" onclick="selectPlan('BASE')">
                <i class="fas fa-seedling"></i>
                <div class="plan-info"><h3>BASE</h3><p>Profilo essenziale gratuito</p></div>
            </div>
            <div class="plan-card" id="plan-PREMIUM" onclick="selectPlan('PREMIUM')">
                <i class="fas fa-crown"></i>
                <div class="plan-info"><h3>PREMIUM</h3><p>Link illimitati e funzioni extra</p></div>
            </div>
            <div class="plan-card" id="plan-GOLD" onclick="selectPlan('GOLD')">
                <i class="fas fa-gem"></i>
                <div class="plan-info"><h3>GOLD</h3><p>Business Showroom e NFC</p></div>
            </div>
        </div>
        <input type="hidden" id="field-plan" value="BASE">

        <div class="section-title">Contatti Diretti</div>
        <div class="form-group"><label>Email</label><input type="text" id="field-email"></div>
        <div class="form-group"><label>Telefono</label><input type="text" id="field-phone"></div>
        <div class="form-group"><label>Sito Web</label><input type="text" id="field-sito_web"></div>
        <div class="form-group"><label>Link CV (URL)</label><input type="text" id="field-cv"></div>

      <div class="section-title">Social Network</div>

<div class="form-group" style="display:flex; gap:8px; align-items:center;">
    <input type="text" id="input-nuovo-canale" placeholder="Incolla il link del tuo canale..." style="flex:1;">
    <button onclick="aggiungiCanale()" style="padding:12px 16px; background:white; color:black; border:none; border-radius:10px; font-weight:600; font-size:0.85rem; cursor:pointer; white-space:nowrap; flex-shrink:0;">+ Aggiungi</button>
</div>

<div id="lista-canali" style="display:flex; flex-direction:column; gap:8px; margin-top:8px;"></div>
<input type="hidden" id="field-config_canali" value="[]">

        <div class="sticky-footer">
    <button class="save-btn" onclick="salvaDati()">SALVA MODIFICHE</button>
    <a href="#" id="back-to-dash" class="back-link">Annulla e torna al profilo</a>
</div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const nomeUtente = params.get("u");
    let currentPlan = "BASE";

    if (nomeUtente) { inizializzaPagina(); }

    function selectPlan(plan) {
        document.getElementById('field-plan').value = plan;
        document.querySelectorAll('.plan-card').forEach(card => card.classList.remove('selected'));
        document.getElementById('plan-' + plan).classList.add('selected');
    }

    
async function inizializzaPagina() {
    const nomePulito = nomeUtente.replace('@', '').trim().toLowerCase();
    document.getElementById("user-display").innerText = "@" + nomePulito.toUpperCase();
    document.getElementById("back-to-dash").href = `profile.html?u=${nomePulito}`;

    try {
        const response = await fetch(`/api/get-profile?u=${nomePulito}`);
        const data = await response.json();
        const f = data.fields || data;
        
        if (f) {
            if(f.plan) selectPlan(f.plan);
            
         // Popolamento dinamico di tutti i campi
const campi = ['bio', 'email', 'sito_web', 'cv'];
campi.forEach(c => {
    const el = document.getElementById(`field-${c}`);
    if (el && f[c]) el.value = f[c];
});

// Carica canali social esistenti
if (f.config_canali) {
    try {
        const parsed = JSON.parse(f.config_canali);
        if (Array.isArray(parsed)) {
            canaliCorrenti = parsed;
            aggiornaListaCanali();
            aggiornaHiddenField();
        }
    } catch(e) {}
} 
            // Caricamento dello stile radio button
            if (f.digital_style) {
                const radio = document.querySelector(`input[name="digital_style"][value="${f.digital_style}"]`);
                if (radio) radio.checked = true;
            }
        }
    } catch (e) { console.error("Errore inizializzazione:", e); }
}
// --- DIZIONARIO RICONOSCIMENTO SOCIAL DAL DOMINIO ---
const socialDizionario = [
    { chiave: "instagram",  domini: ["instagram.com"],           icona: "fab fa-instagram" },
    { chiave: "tiktok",     domini: ["tiktok.com"],              icona: "fab fa-tiktok" },
    { chiave: "facebook",   domini: ["facebook.com","fb.com"],   icona: "fab fa-facebook-f" },
    { chiave: "youtube",    domini: ["youtube.com","youtu.be"],  icona: "fab fa-youtube" },
    { chiave: "linkedin",   domini: ["linkedin.com"],            icona: "fab fa-linkedin-in" },
    { chiave: "x",          domini: ["x.com","twitter.com"],     icona: "fab fa-x-twitter" },
    { chiave: "whatsapp",   domini: ["wa.me","whatsapp.com"],    icona: "fab fa-whatsapp" },
    { chiave: "telegram",   domini: ["t.me","telegram.me"],      icona: "fab fa-telegram-plane" },
    { chiave: "github",     domini: ["github.com"],              icona: "fab fa-github" },
    { chiave: "spotify",    domini: ["spotify.com","open.spotify.com"], icona: "fab fa-spotify" },
    { chiave: "twitch",     domini: ["twitch.tv"],               icona: "fab fa-twitch" },
    { chiave: "pinterest",  domini: ["pinterest.com"],           icona: "fab fa-pinterest-p" },
    { chiave: "reddit",     domini: ["reddit.com"],              icona: "fab fa-reddit" },
    { chiave: "behance",    domini: ["behance.net"],             icona: "fab fa-behance" },
    { chiave: "dribbble",   domini: ["dribbble.com"],            icona: "fab fa-dribbble" },
    { chiave: "strava",     domini: ["strava.com"],              icona: "fab fa-strava" },
];

function normalizzaUrl(val) {
    if (!val) return "";
    val = val.trim();
    if (!val.startsWith("http://") && !val.startsWith("https://")) {
        val = "https://" + val;
    }
    return val;
}

function riconosciSocial(url) {
    try {
        const hostname = new URL(url).hostname.replace("www.", "");
        for (const social of socialDizionario) {
            if (social.domini.some(d => hostname === d || hostname.endsWith("." + d))) {
                return { nome: social.chiave, icona: social.icona };
            }
        }
    } catch(e) {}
    return { nome: "link", icona: "fas fa-share-alt" };
}

let canaliCorrenti = [];

function aggiungiCanale() {
    const input = document.getElementById("input-nuovo-canale");
    let url = input.value.trim();
    if (!url) return;

    url = normalizzaUrl(url);

    // Evita duplicati
    if (canaliCorrenti.find(c => c.url === url)) {
        input.value = "";
        return;
    }

    const { nome, icona } = riconosciSocial(url);
    canaliCorrenti.push({ nome, url });
    aggiornaListaCanali();
    aggiornaHiddenField();
    input.value = "";
}

function rimuoviCanale(index) {
    canaliCorrenti.splice(index, 1);
    aggiornaListaCanali();
    aggiornaHiddenField();
}

function aggiornaListaCanali() {
    const lista = document.getElementById("lista-canali");
    lista.innerHTML = "";

    canaliCorrenti.forEach((canale, i) => {
        const { icona } = riconosciSocial(canale.url);
        const dominio = (() => {
            try { return new URL(canale.url).hostname.replace("www.", ""); }
            catch(e) { return canale.url; }
        })();

        const card = document.createElement("div");
        card.style.cssText = "display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:12px 14px;";
        card.innerHTML = `
            <i class="${icona}" style="font-size:1.1rem; color:#ffffff; flex-shrink:0; width:20px; text-align:center;"></i>
            <span style="flex:1; font-size:0.85rem; color:#a0a0a0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${dominio}</span>
            <button onclick="rimuoviCanale(${i})" style="background:none; border:none; color:#a0a0a0; font-size:1rem; cursor:pointer; padding:0; flex-shrink:0; line-height:1;">✕</button>
        `;
        lista.appendChild(card);
    });
}

function aggiornaHiddenField() {
    document.getElementById("field-config_canali").value = JSON.stringify(canaliCorrenti);
}

// Aggiungere invio con tasto Enter nel campo input
document.addEventListener("DOMContentLoaded", function() {
    const inputCanale = document.getElementById("input-nuovo-canale");
    if (inputCanale) {
        inputCanale.addEventListener("keydown", function(e) {
            if (e.key === "Enter") { e.preventDefault(); aggiungiCanale(); }
        });
    }
});
    
async function salvaDati() {
    const btn = document.querySelector(".save-btn");
    btn.innerText = "SALVATAGGIO...";
    btn.disabled = true;

    const tagDallUrl = params.get("u") || "";
    const nomePerSistema = tagDallUrl.replace('@', '').trim().toLowerCase();

    const getVal = (id) => {
        const el = document.getElementById(id);
        return el ? el.value.trim() : "";
    };

  const datiDaInviare = {
    username_system: nomePerSistema,
    username_display: tagDallUrl.startsWith('@') ? tagDallUrl : '@' + tagDallUrl,
    plan: getVal("field-plan") || "BASE",
    digital_style: document.querySelector('input[name="digital_style"]:checked')?.value || "black",
    bio: getVal("field-bio"),
    email: getVal("field-email"),
    sito_web: normalizzaUrl(getVal("field-sito_web")),
    cv: normalizzaUrl(getVal("field-cv")),
    config_canali: document.getElementById("field-config_canali").value
};
    try {
        // CAMBIATO: Puntiamo a update-profile.js che hai nella cartella
        const response = await fetch('/api/update-profile', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datiDaInviare)
        });

        const result = await response.json();
        
        if (response.ok || result.success) {
    window.location.href = `profile.html?u=${nomePerSistema}`;
} else {
    console.error("Errore API:", result.error);
    alert("Impossibile salvare le modifiche. Si prega di riprovare tra pochi istanti.");
}

    } catch (error) {
        console.error("Errore di rete:", error);
        alert("Il cantiere non comunica con l'ufficio. Verifica il file api/update-profile.js");
    } finally {
        btn.innerText = "SALVA MODIFICHE";
        btn.disabled = false;
    }
}
      
    function luxuryNavigate(event, url) {
        event.preventDefault();
        setTimeout(function() {
            window.location.href = url;
        }, 250);
    }

    document.addEventListener("DOMContentLoaded", function() {
        // Fa apparire la pagina in dissolvenza
        document.body.style.opacity = "1";

        // Gestione dell'uscita ammortizzata a 250ms
        const backLink = document.getElementById("back-to-dash");
        if (backLink) {
            backLink.addEventListener("click", function(e) {
                const urlParams = new URLSearchParams(window.location.search);
                const uParam = urlParams.get("u") || "";
                const nomePulitoLocale = uParam.replace('@', '').trim().toLowerCase();
                luxuryNavigate(e, `profile.html?u=${nomePulitoLocale}`);
            });
        }
    });
async function salvaBozza(nomeMinuto, bozza) {
    try {
        await fetch("/api/update-profile", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: nomeMinuto,
                fields: {
                    draft_json: JSON.stringify(bozza)
                }
            })
        });
        return true;
    } catch (e) {
        console.error("Errore salvataggio bozza:", e);
        return false;
    }
}
</script>
</body>
</html>
