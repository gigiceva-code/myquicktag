<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalizza @${nome} - MyQuickTag</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen">
  <div class="max-w-2xl mx-auto pt-12 px-5">
    <h1 class="text-4xl font-bold mb-2">Personalizza <span class="text-emerald-400">@<span id="nomeDisplay"></span></span></h1>
    <div class="bg-zinc-900 rounded-3xl p-8 space-y-10 mt-10">
      <div>
        <label class="block text-sm text-zinc-400 mb-2">Bio</label>
        <textarea id="bio" rows="4" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-5 text-white" placeholder="Scrivi qualcosa su di te..."></textarea>
      </div>
      <div>
        <label class="block text-sm text-zinc-400 mb-4">I tuoi link</label>
        <input id="instagram" type="text" placeholder="Instagram @username" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 mb-4">
        <input id="website" type="text" placeholder="Sito Web" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4">
      </div>
    </div>
    <button onclick="saveProfile()" class="w-full mt-12 bg-emerald-500 hover:bg-emerald-600 py-7 rounded-3xl text-2xl font-semibold transition-all">
      💾 Salva e Pubblica
    </button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const nome = urlParams.get('nome') || 'tuonome';
    document.getElementById('nomeDisplay').textContent = nome;

    function saveProfile() {
      // Per ora simuliamo il salvataggio della bio
      alert(`✅ Profilo di @${nome} aggiornato!`);
      window.location.href = `profile.html?nome=${nome}`;
    }
  </script>
</body>
</html>
