
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Modifica Profilo - MyQuickTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #ffffff;
            --text-sec: #a0a0a0;
        }

        body {
            margin: 0; padding: 20px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex; flex-direction: column; align-items: center;
        }

        .edit-container { width: 100%; max-width: 400px; }

        .header { text-align: left; margin: 30px 0; width: 100%; }
        .header h1 { font-size: 1.5rem; margin: 0; font-weight: 600; }
        .header p { color: var(--text-sec); font-size: 0.9rem; margin-top: 5px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { 
            display: block; font-size: 0.75rem; color: var(--text-sec); 
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; margin-left: 5px;
        }

        input, textarea {
            width: 100%; padding: 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px; color: white;
            font-family: 'Inter', sans-serif; font-size: 0.95rem;
            box-sizing: border-box; outline: none;
        }

        input:focus, textarea:focus { border-color: rgba(255,255,255,0.3); }

        textarea { height: 100px; resize: none; }

        .save-btn {
            width: 100%; padding: 18px; margin-top: 20px;
            background: white; color: black;
            border: none; border-radius: 14px;
            font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: transform 0.2s;
        }

        .save-btn:active { transform: scale(0.97); }

        .back-link {
            display: block; text-align: center; margin-top: 25px;
            color: var(--text-sec); text-decoration: none; font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="edit-container">
        <div class="header">
            <h1 id="user-display">@NOME</h1>
            <p>Aggiorna le tue informazioni digitali</p>
        </div>

        <div class="form-group">
            <label>Biografia</label>
            <textarea id="field-bio" placeholder="Racconta chi sei..."></textarea>
        </div>

        <div class="form-group">
            <label><i class="fab fa-instagram"></i> Instagram (Link completo)</label>
            <input type="text" id="field-instagram" placeholder="https://instagram.com/tuonome">
        </div>

        <div class="form-group">
            <label><i class="fab fa-linkedin"></i> LinkedIn (Link completo)</label>
            <input type="text" id="field-linkedin" placeholder="https://linkedin.com/in/tuonome">
        </div>

        <div class="form-group">
            <label><i class="fas fa-globe"></i> Sito Web</label>
            <input type="text" id="field-sito" placeholder="https://www.tuosito.it">
        </div>

        <button class="save-btn" onclick="salvaDati()">SALVA MODIFICHE</button>

        <a href="#" id="back-to-dash" class="back-link">Torna alla Dashboard</a>
    </div>

    <script>
        const AIRTABLE_TOKEN = "patHk1SHEGGvX0Odw.02f0d009cc72eb8fe01b9b8ec6876217b9d57f09c135cee6a40d63611974ccc9"; 
const BASE_ID = "app4eQDzqixPDbQTd";
const TABLE_NAME = "Table 1";

const params = new URLSearchParams(window.location.search);
const nomeUtente = params.get("nome");
let recordId = ""; // Lo riempiremo all'avvio

if (nomeUtente) {
    inizializzaPagina();
} else {
    document.body.innerHTML = "<div style='padding:50px; text-align:center;'>Parametro mancante.</div>";
}

async function inizializzaPagina() {
    const nomePulito = nomeUtente.trim().toLowerCase();
    document.getElementById("user-display").innerText = "@" + nomePulito.toUpperCase();
    document.getElementById("back-to-dash").href = `profile.html?nome=${nomePulito}`;

    // 1. Recuperiamo i dati attuali
    const url = `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}?filterByFormula=({nome}='${nomePulito}')`;
    
    try {
        const response = await fetch(url, {
            headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` }
        });
        const data = await response.json();

        if (data.records.length > 0) {
            const r = data.records[0];
            recordId = r.id; // Fondamentale per il salvataggio dopo
            const f = r.fields;

            // 2. Riempiamo i campi del form
            document.getElementById("field-bio").value = f.bio || "";
            document.getElementById("field-instagram").value = f.instagram || "";
            document.getElementById("field-linkedin").value = f.linkedin || "";
            document.getElementById("field-sito").value = f.sito_web || "";
        }
    } catch (error) {
        console.error("Errore inizializzazione:", error);
    }
}

async function salvaDati() {
    if (!recordId) return alert("Errore: ID record non trovato.");

    const btn = document.querySelector(".save-btn");
    btn.innerText = "SALVATAGGIO...";
    btn.disabled = true;

    // Preparazione dati da inviare
    const updateData = {
        fields: {
            bio: document.getElementById("field-bio").value,
            instagram: document.getElementById("field-instagram").value,
            linkedin: document.getElementById("field-linkedin").value,
            sito_web: document.getElementById("field-sito").value
        }
    };

    try {
        const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}/${recordId}`, {
            method: "PATCH",
            headers: {
                Authorization: `Bearer ${AIRTABLE_TOKEN}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(updateData)
        });

        if (response.ok) {
            alert("Profilo aggiornato con successo!");
            window.location.href = `profile.html?nome=${nomeUtente.toLowerCase()}`;
        } else {
            alert("Errore durante il salvataggio.");
        }
    } catch (error) {
        console.error("Errore salvataggio:", error);
        alert("Errore di connessione.");
    } finally {
        btn.innerText = "SALVA MODIFICHE";
        btn.disabled = false;
    }
}

    </script>
</body>
</html>
