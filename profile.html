<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Identity Console - MyQuickTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link id="dynamic-manifest" rel="manifest" href="">
    <link id="dynamic-icon" rel="icon" href="">

    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(255, 255, 255, 0.02);
            --border-white: rgba(255, 255, 255, 0.9);
            --accent-smeraldo: #50C878;
            --accent-ambra: #FFBF00;
            --accent-rubino: #DE3163;
            --text-sec: #6c6c70; 
        }

        body {
            margin: 0; padding: 24px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex; flex-direction: column; align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-container { 
            width: 100%; 
            max-width: 400px; 
            min-height: 88vh;
            display: flex;
            flex-direction: column;
        }

        .user-welcome { text-align: left; margin: 50px 0 35px; width: 100%; }
        .user-welcome h1 { font-size: 1.8rem; margin: 0; font-weight: 600; letter-spacing: -0.8px; color: var(--accent-smeraldo); }
        .user-welcome p { color: #ffffff; font-size: 1.05rem; font-weight: 500; letter-spacing: -0.2px; margin: 6px 0 0; text-transform: uppercase; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 45px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-white); padding: 22px; border-radius: 16px; text-align: left; }
        .stat-card i { color: var(--accent-smeraldo); font-size: 0.95rem; margin-bottom: 14px; display: block; }
        .stat-card .value { font-size: 1.6rem; font-weight: 500; display: block; color: #ffffff; letter-spacing: -0.5px; }
        .stat-card .label { font-size: 0.65rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 6px; display: block; font-weight: 500; }

        .menu-label { font-size: 1rem; color: var(--accent-smeraldo); text-align: center; text-transform: lowercase; letter-spacing: 3px; margin: 15px auto 35px auto; font-weight: 400; width: 100%; }
        
        /* Struttura pulsanti standard */
        .action-btn {
            display: flex; align-items: center;
            background: var(--card-bg); border: 1px solid var(--border-white);
            padding: 22px; border-radius: 14px;
            text-decoration: none; color: white; margin-bottom: 20px;
            transition: all 0.2s ease;
        }
        .action-btn:last-child { margin-bottom: 0; }
        .action-btn:active { transform: scale(0.99); background: rgba(255,255,255,0.05); }
        
        .action-btn i.btn-icon { width: 32px; font-size: 1.1rem; color: #ffffff; opacity: 0.9; }
        .action-btn span { flex-grow: 1; font-size: 0.95rem; font-weight: 400; letter-spacing: -0.2px; }
        .action-btn .chevron { font-size: 0.75rem; color: var(--accent-smeraldo); opacity: 0.8; }

        /* Tavoletta di Vetro Satinata Base (Default Smeraldo) */
        .glass-hero-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%) !important;
            border: 2px solid rgba(255, 255, 255, 0.4) !important;
            border-radius: 20px !important;
            padding: 24px 22px !important;
            margin-bottom: 28px;
            overflow: hidden;
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.4),
                0 12px 24px rgba(0, 0, 0, 0.5), 
                0 0 30px 4px rgba(80, 200, 120, 0.25) !important;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) !important;
        }

        .glass-hero-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(115deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.1) 30%, transparent 30.1%, transparent 100%);
            pointer-events: none;
        }

        .glass-content-top { display: flex; align-items: center; width: 100%; }
        
        .glass-sub-text {
            font-size: 0.65rem !important;
            color: var(--accent-smeraldo);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
            text-align: center;
            margin-top: 6px;
            display: block;
            width: 100%;
            opacity: 0.9;
            transition: color 0.3s ease;
        }

        .glass-hero-btn:active {
            transform: scale(0.97) !important;
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.2),
                0 6px 12px rgba(0, 0, 0, 0.5), 
                0 0 15px 2px rgba(80, 200, 120, 0.15) !important;
        }

        /* STATI DINAMICI DI SCADENZA CON COMPATIBILITÀ GRACE PERIOD */
        
        /* Stato di Avviso o Grazia (Arancione) */
        .glass-hero-btn.state-warning {
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.4),
                0 12px 24px rgba(0, 0, 0, 0.5), 
                0 0 30px 4px rgba(255, 191, 0, 0.22) !important;
        }
        .glass-hero-btn.state-warning .glass-sub-text { color: var(--accent-ambra) !important; }
        .glass-hero-btn.state-warning .chevron { color: var(--accent-ambra) !important; }

        /* Stato Bloccato Oltre i 14 Giorni di Grazia (Rosso) */
        .glass-hero-btn.state-danger {
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.4),
                0 12px 24px rgba(0, 0, 0, 0.5), 
                0 0 30px 4px rgba(222, 49, 99, 0.25) !important;
        }
        .glass-hero-btn.state-danger .glass-sub-text { color: var(--accent-rubino) !important; }
        .glass-hero-btn.state-danger .chevron { color: var(--accent-rubino) !important; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="user-welcome">
            <h1>Identity Console</h1>
            <p id="dash-user">@UTENTE</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-chart-line"></i>
                <span class="value" id="count-visits">-</span>
                <span class="label">Scansioni</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-shield-alt"></i>
                <span class="value" id="days-left">-</span>
                <span class="label">Status Trial</span>
            </div>
        </div>

        <div class="menu-label">identity system</div>
        
        <a href="#" id="link-view" class="action-btn glass-hero-btn">
            <div class="glass-content-top">
                <i class="fas fa-arrow-right btn-icon"></i>
                <span>View Tag</span>
                <i class="fas fa-chevron-right chevron"></i>
            </div>
            <span class="glass-sub-text" id="badge-status">Active Identity</span>
        </a>

        <a href="#" id="link-edit" class="action-btn">
            <i class="fas fa-sliders-h btn-icon"></i>
            <span>Configure</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

        <a href="#" id="link-qr" class="action-btn">
            <i class="fas fa-qrcode btn-icon"></i>
            <span>QR Identity</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

        <a href="#" id="link-account" class="action-btn">
            <i class="fas fa-user-shield btn-icon"></i>
            <span>Account & Security</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>
    </div>

<script>
const params = new URLSearchParams(window.location.search);
const nomeUtenteURL = params.get("u") || ""; 

if (nomeUtenteURL) {
    const nomeIniziale = nomeUtenteURL.replace('@', '').trim();
    const nomeMinuto = nomeIniziale.toLowerCase();

    // Attivazione Manifest Dinamico
    document.getElementById("dynamic-manifest").href = `/api/manifest?u=${nomeMinuto}`;
    document.getElementById("dynamic-icon").href = `/api/icon?u=${nomeMinuto}`;

    // Configurazione visualizzazione header
    document.getElementById("dash-user").innerText = "@" + nomeIniziale.toUpperCase();
    
    // Ancoraggio logica parametrica nativa
    document.getElementById("link-view").href = `tag.html?u=${nomeMinuto}`;
    document.getElementById("link-edit").href = `edit.html?u=${nomeMinuto}`;
    document.getElementById("link-qr").href = `qr.html?u=${nomeMinuto}`;
    document.getElementById("link-account").href = `account.html?u=${nomeMinuto}`;

    caricaDatiDashboard(nomeMinuto);
} else {
    document.body.innerHTML = "<div style='padding:50px; text-align:center; font-family:sans-serif; color:#6c6c70; font-size:0.9rem; letter-spacing:1px;'>ACCESS DENIED. PARAMETER MISSING.</div>";
}

async function caricaDatiDashboard(nomeMinuto) {
    try {
        const response = await fetch(`/api/get-profile?u=${nomeMinuto}`);
        const data = await response.json();

        if (data.success && data.fields) {
            const record = data.fields;

            if (record.username_display) {
                const displayPulito = record.username_display.replace('@', '').trim();
                document.getElementById("dash-user").innerText = "@" + displayPulito.toUpperCase();
            }

            // CALCOLO GIORNI REALI DALLA SCADENZA DI AIRTABLE
            let giorniEffettivi = 90; 

            if (record.data_scadenza) {
                const oggi = new Date();
                const scadenza = new Date(record.data_scadenza);
                const diffTime = scadenza - oggi;
                giorniEffettivi = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                // Aggiorna il contatore visivo della card (mostra 0 GG se è scaduto)
                document.getElementById("days-left").innerText = giorniEffettivi > 0 ? giorniEffettivi + " GG" : "0 GG";
            } else {
                document.getElementById("days-left").innerText = "90 GG";
            }

            const btnView = document.getElementById("link-view");
            const badgeStatus = document.getElementById("badge-status");

            // REGIA DEI COLORI CON LOGICA DI GRAZIA (+14 GIORNI EXTRA)
            if (giorniEffettivi < -14) {
                // Sospensione Totale: Oltre i 14 giorni di tolleranza (Rosso)
                btnView.classList.add("state-danger");
                btnView.classList.remove("state-warning");
                badgeStatus.innerText = "Identity Suspended";
            } else if (giorniEffettivi <= 0) {
                // Periodo di Grazia attivo: Scaduto ma dentro i 14 giorni (Arancione)
                btnView.classList.add("state-warning");
                btnView.classList.remove("state-danger");
                badgeStatus.innerText = "Grace Period Active";
            } else if (giorniEffettivi <= 10) {
                // Pre-avviso: Mancano meno di 10 giorni alla scadenza (Arancione)
                btnView.classList.add("state-warning");
                btnView.classList.remove("state-danger");
                badgeStatus.innerText = "Identity Expiring";
            } else {
                // Regolare: Tutto online e verde (Verde)
                btnView.classList.remove("state-warning", "state-danger");
                badgeStatus.innerText = "Active Identity";
            }

            document.getElementById("count-visits").innerText = record.views || record.visits || "0";
        }
    } catch (error) {
        console.error("Errore di cantiere:", error);
    }
}
</script>
   
</body>
</html>
