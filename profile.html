
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Identity Console - MyQuickTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link id="dynamic-manifest" rel="manifest" href="">
    <link id="dynamic-icon" rel="icon" href="">

<style>
    :root {
        --bg-color: #000000;
        --card-bg: rgba(255, 255, 255, 0.02);
        --border-white: rgba(255, 255, 255, 0.9);
        --accent-smeraldo: #50C878;
        --text-sec: #6c6c70; 
    }

    body {
        margin: 0; padding: 16px;
        background-color: var(--bg-color);
        font-family: 'Inter', sans-serif;
        color: white;
        display: flex; flex-direction: column; align-items: center;
        height: 100vh; overflow: hidden;
    }

    .dashboard-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; }

    .user-welcome { text-align: left; margin: 10px 0 15px; width: 100%; }
    .user-welcome h1 { font-size: 1.5rem; margin: 0; font-weight: 600; color: var(--accent-smeraldo); }
    .user-welcome p { color: #ffffff; font-size: 0.9rem; margin: 2px 0 0; text-transform: uppercase; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border-white); padding: 12px; border-radius: 12px; }
    .stat-card i { color: var(--accent-smeraldo); font-size: 0.8rem; margin-bottom: 5px; display: block; }
    .stat-card .value { font-size: 1.2rem; font-weight: 500; display: block; color: #ffffff; }
    .stat-card .label { font-size: 0.6rem; color: var(--text-sec); text-transform: uppercase; margin-top: 2px; display: block; }

    .menu-label { font-size: 0.8rem; color: var(--accent-smeraldo); text-align: center; text-transform: lowercase; letter-spacing: 2px; margin: 5px auto 10px auto; }
    
    section { margin-bottom: 15px; }

    .action-btn {
        display: flex; align-items: center; background: transparent; border: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 12px 0; text-decoration: none; color: white;
    }
    .action-btn i.btn-icon { width: 25px; font-size: 0.9rem; color: var(--accent-smeraldo); }
    .action-btn span { flex-grow: 1; font-size: 0.9rem; }
    
    .hero-activation-card {
        background: #0a0a0a; border: 1px solid rgba(80, 200, 120, 0.3);
        padding: 15px; border-radius: 20px; text-decoration: none; display: flex; flex-direction: column; gap: 10px; color: white;
    }
    .hero-header { display: flex; align-items: center; gap: 10px; }
    .qr-icon-box { width: 40px; height: 40px; background: rgba(80, 200, 120, 0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--accent-smeraldo); font-size: 1.2rem; }
    .hero-text h3 { margin: 0; font-size: 0.9rem; }
    .hero-text p { color: #888; font-size: 0.75rem; margin: 0; }
    .btn-visualizza { background: rgba(80, 200, 120, 0.15); border: 1px solid rgba(80, 200, 120, 0.4); color: var(--accent-smeraldo); padding: 8px; border-radius: 10px; text-align: center; font-size: 0.75rem; font-weight: 600; }
</style>
</head>
<body>

 <div class="dashboard-container">
        <div class="user-welcome">
            <h1>Identity Console</h1>
            <p id="dash-user">@UTENTE</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-chart-line"></i>
                <span class="value" id="count-visits">-</span>
                <span class="label">Scansioni</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-shield-alt"></i>
                <span class="value" id="days-left">-</span>
                <span class="label">Status Trial</span>
            </div>
        </div>

        <section id="block-identity-system">
            <div class="menu-label">identity system</div>
            <a href="#" id="link-view" class="hero-activation-card">
                <div class="hero-header">
                    <div class="qr-icon-box"><i class="fas fa-qrcode"></i></div>
                    <div class="hero-text">
                        <h3 id="view-title">Attiva la tua Identità</h3>
                        <p id="view-desc">Mostra, condividi e lascia il segno.</p>
                    </div>
                </div>
                <div class="btn-visualizza">VISUALIZZA TAG <i class="fas fa-chevron-right"></i></div>
            </a>
        </section>
        <section id="block-gestione">
            <div class="menu-label">gestione</div>
            
            <a href="#" id="link-edit" class="action-btn">
                <i class="fas fa-sliders-h btn-icon"></i>
                <span>Configure</span>
                <i class="fas fa-chevron-right chevron"></i>
            </a>
            <a href="#" id="link-qr" class="action-btn">
                <i class="fas fa-qrcode btn-icon"></i>
                <span>QR Identity</span>
                <i class="fas fa-chevron-right chevron"></i>
            </a>
            <a href="#" id="link-account" class="action-btn">
                <i class="fas fa-user-shield btn-icon"></i>
                <span>Account & Security</span>
                <i class="fas fa-chevron-right chevron"></i>
            </a>
            
            <a href="#" id="link-upgrade" class="action-btn">
                <i class="fas fa-rocket btn-icon"></i>
                <span>Upgrade</span>
                <i class="fas fa-chevron-right chevron"></i>
            </a>
            <a href="#" class="action-btn">
                <i class="fas fa-cog btn-icon"></i>
                <span>System Settings</span>
                <i class="fas fa-chevron-right chevron"></i>
            </a>
            <a href="#" class="action-btn">
                <i class="fas fa-bolt btn-icon"></i>
                <span>Quick Actions</span>
                <i class="fas fa-chevron-right chevron"></i>
            </a>
        </section>

        <section id="block-growth">
        </section>
    </div>

        
        </section>

        <section id="block-growth">
            </section>
    </div>


<script>
const params = new URLSearchParams(window.location.search);
const nomeUtenteURL = params.get("u") || ""; 

if (nomeUtenteURL) {
    const nomeIniziale = nomeUtenteURL.replace('@', '').trim();
    const nomeMinuto = nomeIniziale.toLowerCase();

    // Attivazione Manifest Dinamico
    document.getElementById("dynamic-manifest").href = `/api/manifest?u=${nomeMinuto}`;
    document.getElementById("dynamic-icon").href = `/api/icon?u=${nomeMinuto}`;

    // Configurazione visualizzazione header
    document.getElementById("dash-user").innerText = "@" + nomeIniziale.toUpperCase();
    
    // RIPRISTINO ANCORAGGIO LOGICA PARAMENTRICA COERENTE CON EDIT.HTML
    document.getElementById("link-view").href = `tag.html?u=${nomeMinuto}`;
    document.getElementById("link-edit").href = `edit.html?u=${nomeMinuto}`;
    document.getElementById("link-qr").href = `qr.html?u=${nomeMinuto}`;
    document.getElementById("link-account").href = `account.html?u=${nomeMinuto}`;

    caricaDatiDashboard(nomeMinuto);
} else {
    document.body.innerHTML = "<div style='padding:50px; text-align:center; font-family:sans-serif; color:#6c6c70; font-size:0.9rem; letter-spacing:1px;'>ACCESS DENIED. PARAMETER MISSING.</div>";
}

async function caricaDatiDashboard(nomeMinuto) {
    try {
        const response = await fetch(`/api/get-profile?u=${nomeMinuto}`);
        const data = await response.json();

        if (data.success && data.fields) {
            const record = data.fields;

            // Logica Magic Button corretta per il nuovo layout Hero
            const stato = (record.stato || "").toLowerCase().trim();
            const btnView = document.getElementById("link-view");
                        if (stato === "in attesa") {
                document.getElementById("view-title").innerText = "Attiva la tua Identità";
                document.getElementById("view-desc").innerText = "Il tuo profilo è pronto per essere lanciato.";
                btnView.classList.add("pulsing-effect");
            }
 

            if (record.username_display) {
                const displayPulito = record.username_display.replace('@', '').trim();
                document.getElementById("dash-user").innerText = "@" + displayPulito.toUpperCase();
            }

            if (record.data_scadenza) {
                const oggi = new Date();
                const scadenza = new Date(record.data_scadenza);
                const diffTime = scadenza - oggi;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                document.getElementById("days-left").innerText = diffDays > 0 ? diffDays + " GG" : "0 GG";
            } else {
                document.getElementById("days-left").innerText = "90 GG";
            }

            document.getElementById("count-visits").innerText = record.views || record.visits || "0";
        }
    } catch (error) {
        console.warn("Il sistema sta ripristinando la connessione con l'identità digitale.");
    }
}



    // AGGIORNAMENTO BOTTONE MAGIC
async function checkMagicButton(nomeMinuto) {
    try {
        const response = await fetch(`/api/get-profile?u=${nomeMinuto}`);
        const data = await response.json();
        if (data.success && data.fields) {
            const stato = (data.fields.stato || "").toLowerCase().trim();
            const btnView = document.getElementById("link-view");

            if (stato === "in attesa") {
                btnView.querySelector("span").innerText = "Attiva la tua Identità";
                btnView.classList.add("pulsing-effect");
            }
        }
    } catch (e) {
        console.error("Errore magic button:", e);
    }
}

</script>
   
</body>
</html>
