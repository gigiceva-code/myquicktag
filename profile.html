<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dashboard - MyQuickTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000; /* Nero Assoluto Luxury */
            --card-bg: rgba(255, 255, 255, 0.02);
            --border-color: rgba(255, 255, 255, 0.06);
            --accent-smeraldo: #50C878; /* Verde Smeraldo Istituzionale */
            --text-sec: #6c6c70; /* Grigio scuro calibrato per il minimalismo */
        }

        body {
            margin: 0; padding: 24px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex; flex-direction: column; align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-container { width: 100%; max-width: 400px; }

        /* Header Premium Identity */
        .user-welcome { text-align: left; margin: 50px 0 35px; width: 100%; }
        .user-welcome h1 { font-size: 1.7rem; margin: 0; font-weight: 600; letter-spacing: -0.8px; color: #ffffff; }
        .user-welcome p { color: var(--accent-smeraldo); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin: 8px 0 0; }

        /* Matrici statistiche minimali */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 22px; border-radius: 16px; text-align: left;
            transition: border 0.3s ease;
        }

        .stat-card i { color: var(--accent-smeraldo); font-size: 0.95rem; margin-bottom: 14px; display: block; }
        .stat-card .value { font-size: 1.6rem; font-weight: 500; display: block; color: #ffffff; letter-spacing: -0.5px; }
        .stat-card .label { font-size: 0.65rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 6px; display: block; font-weight: 500; }

        /* Liste d'azione ad alta conversione */
        .menu-label { font-size: 0.7rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; margin-left: 4px; font-weight: 600; }
        
        .action-btn {
            display: flex; align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px; border-radius: 14px;
            text-decoration: none; color: white; margin-bottom: 14px;
            transition: all 0.2s ease;
        }

        .action-btn:active { transform: scale(0.99); background: rgba(255,255,255,0.05); }
        .action-btn i.btn-icon { width: 32px; font-size: 1.1rem; color: #ffffff; opacity: 0.8; }
        .action-btn span { flex-grow: 1; font-size: 0.9rem; font-weight: 400; letter-spacing: -0.2px; }
        .action-btn .chevron { font-size: 0.75rem; color: var(--text-sec); opacity: 0.6; }

        /* Il pilastro d'élite visivo */
        .btn-primary { 
            border: 1px solid rgba(80, 200, 120, 0.25); 
            background: rgba(80, 200, 120, 0.03); 
        }
        .btn-primary i.btn-icon { color: var(--accent-smeraldo); opacity: 1; }
        .btn-primary span { font-weight: 500; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="user-welcome">
            <h1 id="dash-user">@UTENTE</h1>
            <p>Premium Identity Hub</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-chart-line"></i>
                <span class="value" id="count-visits">-</span>
                <span class="label">Scansioni</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-shield-alt"></i>
                <span class="value" id="days-left">-</span>
                <span class="label">Status Trial</span>
            </div>
        </div>

        <div class="menu-label">Management & Logistics</div>
        
        <a href="#" id="link-view" class="action-btn btn-primary">
            <i class="fas fa-arrow-right btn-icon"></i>
            <span>Digital Showroom</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

        <a href="#" id="link-edit" class="action-btn">
            <i class="fas fa-sliders-h btn-icon"></i>
            <span>Craft & Configuration</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

        <a href="#" id="link-qr" class="action-btn">
            <i class="fas fa-qrcode btn-icon"></i>
            <span>Instant Acquisition Gate</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

    </div>

<script>
const params = new URLSearchParams(window.location.search);
const nomeUtente = params.get("u"); 

if (nomeUtente) {
    caricaDatiDashboard(nomeUtente.toLowerCase());
} else {
    document.body.innerHTML = "<div style='padding:50px; text-align:center; font-family:sans-serif; color:#6c6c70; font-size:0.9rem; letter-spacing:1px;'>ACCESS DENIED. PARAMETER MISSING.</div>";
}

async function caricaDatiDashboard(nome) {
    const nomePulito = nome.replace('@', '').trim().toLowerCase();
    
    try {
        const response = await fetch(`/api/get-profile?u=${nomePulito}`);
        const data = await response.json();

        if (data.success) {
            const record = data.fields;

            document.getElementById("dash-user").innerText = "@" + nomePulito.toUpperCase();

            if (record.data_scadenza) {
                const oggi = new Date();
                const scadenza = new Date(record.data_scadenza);
                const diffTime = scadenza - oggi;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                document.getElementById("days-left").innerText = diffDays > 0 ? diffDays + " GG" : "0 GG";
            } else {
                document.getElementById("days-left").innerText = "90 GG";
            }

            document.getElementById("count-visits").innerText = record.views || record.visits || "0";

            // Rotte pulite ad alta tecnologia
            document.getElementById("link-view").href = `/u/${nomePulito}`;
            document.getElementById("link-edit").href = `/edit?u=${nomePulito}`;
            document.getElementById("link-qr").href = `/qr?u=${nomePulito}`;

        } else {
            alert("Errore: Identità non rilevata nell'ecosistema.");
        }
    } catch (error) {
        console.error("Errore infrastruttura:", error);
    }
}
</script>
   
</body>
</html>
