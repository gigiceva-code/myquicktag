
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dashboard - MyQuickTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000; /* Nero Assoluto Luxury */
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-smeraldo: #50C878; /* Il Verde del Brand */
            --text-sec: #8e8e93;
        }

        body {
            margin: 0; padding: 24px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex; flex-direction: column; align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-container { width: 100%; max-width: 400px; }

        /* Header Dashboard */
        .user-welcome { text-align: left; margin: 40px 0 30px; width: 100%; }
        .user-welcome h1 { font-size: 1.6rem; margin: 0; font-weight: 600; letter-spacing: -0.5px; }
        .user-welcome p { color: var(--text-sec); font-size: 0.9rem; margin: 6px 0 0; }

        /* Card Statistiche */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 35px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px; border-radius: 18px; text-align: left;
        }

        .stat-card i { color: var(--accent-smeraldo); font-size: 1rem; margin-bottom: 12px; display: block; }
        .stat-card .value { font-size: 1.4rem; font-weight: 600; display: block; color: #ffffff; }
        .stat-card .label { font-size: 0.7rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; display: block; }

        /* Menu Azioni */
        .menu-label { font-size: 0.75rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 15px; margin-left: 5px; font-weight: 600; }
        
        .action-btn {
            display: flex; align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 18px 20px; border-radius: 16px;
            text-decoration: none; color: white; margin-bottom: 14px;
            transition: all 0.2s ease;
        }

        .action-btn:active { transform: scale(0.98); background: rgba(255,255,255,0.08); }
        .action-btn i.btn-icon { width: 35px; font-size: 1.15rem; color: #ffffff; }
        .action-btn span { flex-grow: 1; font-size: 0.95rem; font-weight: 400; padding-left: 2px; }
        .action-btn .chevron { font-size: 0.8rem; color: var(--text-sec); }

        /* Il Bottone d'élite per visualizzare il lavoro finito */
        .btn-primary { 
            border: 1px solid var(--accent-smeraldo); 
            background: rgba(80, 200, 120, 0.08); 
        }
        .btn-primary i.btn-icon { color: var(--accent-smeraldo); }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="user-welcome">
            <h1 id="dash-user">@UTENTE</h1>
            <p>Ufficio di Comando • MyQuickTag</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-chart-line"></i>
                <span class="value" id="count-visits">-</span>
                <span class="label">Scansioni</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-shield-alt"></i>
                <span class="value" id="days-left">-</span>
                <span class="label">Giorni Free</span>
            </div>
        </div>

        <div class="menu-label">Personalizzazione e Lavoro</div>
        
        <a href="#" id="link-view" class="action-btn btn-primary">
            <i class="fas fa-arrow-right btn-icon"></i>
            <span>Visualizza la tua Chiave (Tag)</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

        <a href="#" id="link-edit" class="action-btn">
            <i class="fas fa-sliders-h btn-icon"></i>
            <span>Modifica Profilo e Contatti</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

        <a href="#" id="link-qr" class="action-btn">
            <i class="fas fa-qrcode btn-icon"></i>
            <span>Il tuo QR Code Dinamico</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

    </div>

<script>
const params = new URLSearchParams(window.location.search);
const nomeUtente = params.get("u"); 

if (nomeUtente) {
    caricaDatiDashboard(nomeUtente.toLowerCase());
} else {
    document.body.innerHTML = "<div style='padding:50px; text-align:center; font-family:sans-serif;'>Accesso negato. Parametro mancante.</div>";
}

async function caricaDatiDashboard(nome) {
    const nomePulito = nome.replace('@', '').trim().toLowerCase();
    
    try {
        const response = await fetch(`/api/get-profile?u=${nomePulito}`);
        const data = await response.json();

        if (data.success) {
            const record = data.fields;

            // Aggiorna l'interfaccia con il tag maiuscolo d'impatto
            document.getElementById("dash-user").innerText = "@" + nomePulito.toUpperCase();

            // Calcolo dei giorni di prova gratuiti rimanenti (target 90 giorni)
            if (record.data_scadenza) {
                const oggi = new Date();
                const scadenza = new Date(record.data_scadenza);
                const diffTime = scadenza - oggi;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                document.getElementById("days-left").innerText = diffDays > 0 ? diffDays : "0";
            } else {
                document.getElementById("days-left").innerText = "90";
            }

            // Conteggio visualizzazioni reali dal database
            document.getElementById("count-visits").innerText = record.views || record.visits || "0";

            // PRETTY URL: Indirizziamo TUTTI i pulsanti sui percorsi d'élite puliti, non più file .html
            document.getElementById("link-view").href = `/u/${nomePulito}`;
            document.getElementById("link-edit").href = `/edit?u=${nomePulito}`;
            document.getElementById("link-qr").href = `/qr?u=${nomePulito}`;

        } else {
            alert("Errore: Profilo non trovato all'interno dell'ecosistema.");
        }
    } catch (error) {
        console.error("Errore nel recupero dati di cantiere:", error);
    }
}
</script>
   
</body>
</html>
