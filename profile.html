
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MyQuickTag Profile</title>
    <style>
        :root { --green: #50C878; --bg: #000; }
        body { 
            background: var(--bg); color: white; font-family: sans-serif; 
            margin: 0; padding: 80px 20px 40px; /* Padding extra in alto */
            display: flex; flex-direction: column; align-items: center; 
        }
        #tag-header { 
            color: var(--green); border: 1px solid var(--green); 
            padding: 10px 20px; border-radius: 50px; font-weight: bold;
            margin-bottom: 30px; text-transform: uppercase;
        }
        #bio-text { text-align: center; font-size: 1.1rem; line-height: 1.5; margin-bottom: 30px; }
        .link-btn { 
            width: 100%; max-width: 300px; background: #111; border: 1px solid #333;
            color: white; padding: 15px; margin-bottom: 10px; border-radius: 12px;
            text-decoration: none; text-align: center; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="tag-header">Caricamento...</div>
    <p id="bio-text">Recupero dati in corso...</p>
    <div id="links-box" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>

<script>
const TOKEN = "PatAnfD8O0FfKWhZc.854657155050f24025d57d5985868875385657454c504a554a5a544a42534c56";
const BASE = "app4eQDzqixPDbQTd";
const TABLE = "Table 1"; // <--- USIAMO IL NOME IN INGLESE ORIGINALE

const urlParams = new URLSearchParams(window.location.search);
const userTag = urlParams.get("nome");

async function fetchData() {
    try {
        const response = await fetch(`https://api.airtable.com/v0/${BASE}/${encodeURIComponent(TABLE)}?filterByFormula=LOWER({nome})='@${userTag.toLowerCase()}'`, {
            headers: { Authorization: `Bearer ${TOKEN}` }
        });
        
        const data = await response.json();
        
        if (data.records && data.records.length > 0) {
            const user = data.records[0].fields;
            // biografia è minuscolo come abbiamo visto negli screen
            document.getElementById("bio-text").innerText = user.biografia || "Profilo attivo.";
            
            const box = document.getElementById("links-box");
            if(user.Instagram) addLink(box, "INSTAGRAM", "https://instagram.com/" + user.Instagram);
            if(user.LinkedIn) addLink(box, "LINKEDIN", user.LinkedIn);
            if(user.sito) addLink(box, "SITO WEB", user.sito);
        } else {
            document.getElementById("bio-text").innerText = "Non trovo @" + userTag + ". Controlla che su Airtable ci sia scritto @test tutto minuscolo.";
        }
    } catch (err) {
        document.getElementById("bio-text").innerText = "Errore di connessione.";
    }
}
// ... resto del codice identico
</script>
</body>
</html>
