
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dashboard - MyQuickTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #ffffff;
            --text-sec: #a0a0a0;
        }

        body {
            margin: 0; padding: 20px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex; flex-direction: column; align-items: center;
        }

        .dashboard-container { width: 100%; max-width: 400px; }

        /* Header Dashboard */
        .user-welcome { text-align: left; margin: 40px 0 30px; width: 100%; }
        .user-welcome h1 { font-size: 1.5rem; margin: 0; font-weight: 600; }
        .user-welcome p { color: var(--text-sec); font-size: 0.9rem; margin: 5px 0 0; }

        /* Card Statistiche */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px; border-radius: 18px; text-align: left;
            backdrop-filter: blur(10px);
        }

        .stat-card i { color: var(--text-sec); font-size: 1rem; margin-bottom: 10px; display: block; }
        .stat-card .value { font-size: 1.3rem; font-weight: 600; display: block; }
        .stat-card .label { font-size: 0.7rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1px; }

        /* Menu Azioni */
        .menu-label { font-size: 0.75rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 15px; margin-left: 5px; }
        
        .action-btn {
            display: flex; align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 18px 20px; border-radius: 16px;
            text-decoration: none; color: white; margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .action-btn:active { transform: scale(0.98); background: rgba(255,255,255,0.1); }
        .action-btn i { width: 35px; font-size: 1.1rem; }
        .action-btn span { flex-grow: 1; font-size: 0.95rem; font-weight: 400; }
        .action-btn .chevron { font-size: 0.8rem; color: var(--text-sec); }

        .btn-primary { border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="user-welcome">
            <h1 id="dash-user">@UTENTE</h1>
            <p>Gestione del tuo Digital Profile</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-eye"></i>
                <span class="value" id="count-visits">-</span>
                <span class="label">Visite Totali</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-clock"></i>
                <span class="value" id="days-left">-</span>
                <span class="label">Giorni Rimasti</span>
            </div>
        </div>

        <div class="menu-label">Azioni Rapide</div>
        
        <a href="#" id="link-view" class="action-btn btn-primary" target="_blank">
            <i class="fas fa-external-link-alt"></i>
            <span>Visualizza la tua Tag</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

        <a href="#" id="link-edit" class="action-btn">
            <i class="fas fa-user-edit"></i>
            <span>Modifica Profilo</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

        <a href="#" id="link-qr" class="action-btn">
            <i class="fas fa-qrcode"></i>
            <span>Il tuo QR Code</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

    </div>

    <script>
        // Lo scriveremo nello STEP 2 per collegare i dati reali
    </script>
</body>
</html>
