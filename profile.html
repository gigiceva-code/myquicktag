
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dashboard - MyQuickTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #ffffff;
            --text-sec: #a0a0a0;
        }

        body {
            margin: 0; padding: 20px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex; flex-direction: column; align-items: center;
        }

        .dashboard-container { width: 100%; max-width: 400px; }

        /* Header Dashboard */
        .user-welcome { text-align: left; margin: 40px 0 30px; width: 100%; }
        .user-welcome h1 { font-size: 1.5rem; margin: 0; font-weight: 600; }
        .user-welcome p { color: var(--text-sec); font-size: 0.9rem; margin: 5px 0 0; }

        /* Card Statistiche */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px; border-radius: 18px; text-align: left;
            backdrop-filter: blur(10px);
        }

        .stat-card i { color: var(--text-sec); font-size: 1rem; margin-bottom: 10px; display: block; }
        .stat-card .value { font-size: 1.3rem; font-weight: 600; display: block; }
        .stat-card .label { font-size: 0.7rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1px; }

        /* Menu Azioni */
        .menu-label { font-size: 0.75rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 15px; margin-left: 5px; }
        
        .action-btn {
            display: flex; align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 18px 20px; border-radius: 16px;
            text-decoration: none; color: white; margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .action-btn:active { transform: scale(0.98); background: rgba(255,255,255,0.1); }
        .action-btn i { width: 35px; font-size: 1.1rem; }
        .action-btn span { flex-grow: 1; font-size: 0.95rem; font-weight: 400; }
        .action-btn .chevron { font-size: 0.8rem; color: var(--text-sec); }

        .btn-primary { border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); }
    </style>
</head>
    <!-- Overlay per impostazione Password -->
<div id="password-setup-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:10000; flex-direction:column; align-items:center; justify-content:center; color:white; font-family: sans-serif;">
    
    <div style="text-align:center; max-width:400px; padding:20px;">
        <h2 style="letter-spacing:2px; margin-bottom:10px;">PROTEGGI LA TUA IDENTITÀ</h2>
        <p style="opacity:0.7; font-size:14px; margin-bottom:30px;">Il tuo @tag è pronto. Crea una password per accedere al tuo Identity Portal in futuro.</p>
        
        <input type="password" id="final-password" placeholder="Scegli la tua Password" 
               style="width:100%; padding:15px; background:transparent; border:1px solid #333; color:white; border-radius:5px; margin-bottom:20px; outline:none; text-align:center;">
        
        <button onclick="saveFinalPassword()" 
                style="width:100%; padding:15px; background:#ffffff; color:#000; border:none; border-radius:5px; cursor:pointer; font-weight:bold; letter-spacing:1px;">
            ATTIVA PROFILO
        </button>
    </div>
</div>
<body>

    <div class="dashboard-container">
        <div class="user-welcome">
            <h1 id="dash-user">@UTENTE</h1>
            <p>Gestione del tuo Digital Profile</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-eye"></i>
                <span class="value" id="count-visits">-</span>
                <span class="label">Visite Totali</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-clock"></i>
                <span class="value" id="days-left">-</span>
                <span class="label">Giorni Rimasti</span>
            </div>
        </div>

        <div class="menu-label">Azioni Rapide</div>
        
        <a href="#" id="link-view" class="action-btn btn-primary" target="_blank">
            <i class="fas fa-external-link-alt"></i>
            <span>Visualizza la tua Tag</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

        <a href="#" id="link-edit" class="action-btn">
            <i class="fas fa-user-edit"></i>
            <span>Modifica Profilo</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

        <a href="#" id="link-qr" class="action-btn">
            <i class="fas fa-qrcode"></i>
            <span>Il tuo QR Code</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
const nomeUtente = params.get("u"); // Ora usa 'u' come le altre pagine

if (nomeUtente) {
    caricaDatiDashboard(nomeUtente.toLowerCase());
} else {
    document.body.innerHTML = "<div style='padding:50px; text-align:center;'>Accesso non autorizzato.</div>";
}

async function caricaDatiDashboard(nome) {
    const nomePulito = nome.trim().toLowerCase();
    
    try {
        // Usiamo l'API sicura che abbiamo creato prima
        const response = await fetch(`/api/get-profile?u=${nomePulito}`);
        const data = await response.json();

        if (data.success) {
            const record = data.fields;

            // 1. Aggiorna Nome in alto
            document.getElementById("dash-user").innerText = "@" + nomePulito.toUpperCase();

            // 2. Calcolo Giorni Rimasti
            if (record.data_scadenza) {
                const oggi = new Date();
                const scadenza = new Date(record.data_scadenza);
                const diffTime = scadenza - oggi;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                document.getElementById("days-left").innerText = diffDays > 0 ? diffDays : "0";
            } else {
                document.getElementById("days-left").innerText = "90";
            }

            // 3. Statistiche Visite
            document.getElementById("count-visits").innerText = record.visits || "0";

            // 4. Link di Navigazione (Tutti uniformati con 'u')
            document.getElementById("link-view").href = `tag.html?u=${nomePulito}`;
            document.getElementById("link-edit").href = `edit.html?u=${nomePulito}`;
            document.getElementById("link-qr").href = `qr.html?u=${nomePulito}`;

        } else {
            alert("Errore: Profilo non trovato.");
        }
    } catch (error) {
        console.error("Errore critico:", error);
        alert("Errore di connessione al database.");
    }
}
       async function saveFinalPassword() {
    // 1. Recuperiamo il tag dall'URL (es. ?u=gigi)
    const urlParams = new URLSearchParams(window.location.search);
    const tag = urlParams.get('u') || urlParams.get('user');
    
    const pwd = document.getElementById('final-password').value;
    const btn = document.querySelector('#password-setup-overlay button');

    if (!pwd || pwd.length < 4) {
        alert("Inserisci una password valida (almeno 4 caratteri).");
        return;
    }

    btn.innerText = "ATTIVAZIONE IN CORSO...";
    btn.disabled = true;

    try {
        const response = await fetch('/api/set-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tag: tag, password: pwd })
        });

        const data = await response.json();

        if (data.success) {
            btn.style.background = "#4CAF50";
            btn.innerText = "PROFILO ATTIVO!";
            
            setTimeout(() => {
                // Dopo il successo, lo mandiamo al tag finale o al portale
                window.location.href = `/tag.html?u=${tag}`;
            }, 1500);
        } else {
            alert(data.message || "Errore durante il salvataggio.");
            btn.disabled = false;
            btn.innerText = "ATTIVA PROFILO";
        }
    } catch (error) {
        console.error("Errore:", error);
        alert("Errore tecnico durante l'attivazione.");
        btn.disabled = false;
    }
} 
    </script>
</body>
</html>
