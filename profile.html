<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@${nome} - MyQuickTag</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <div id="profileContent" class="max-w-2xl mx-auto pt-12 px-5"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const nome = urlParams.get('nome')?.toLowerCase() || '';

    // Qui in futuro recupererai i dati da Airtable
    document.getElementById('profileContent').innerHTML = `
      <div class="text-center">
        <div class="w-32 h-32 mx-auto bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl flex items-center justify-center text-7xl mb-6 shadow-2xl">👤</div>
        <h1 class="text-5xl font-bold">@${nome}</h1>
        <p class="text-emerald-400 mt-1">Identità digitale su MyQuickTag</p>
      </div>

      <div class="mt-12 bg-zinc-900 rounded-3xl p-8">
        <p class="text-zinc-300 text-lg leading-relaxed text-center" id="bioText">
          La tua bio apparirà qui una volta salvata.
        </p>

        <div class="mt-10 space-y-4" id="linksContainer">
          <!-- I link appariranno qui dinamicamente in futuro -->
        </div>
      </div>

      <div class="text-center mt-16 text-xs text-zinc-500">
        Questo è un profilo MyQuickTag • @${nome}
      </div>
    `;
  </script>
</body>
</html>
