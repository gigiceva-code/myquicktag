<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MyQuickTag Profile</title>
    <style>
        :root { --green: #50C878; --bg: #000; }
        body { 
            background: var(--bg); color: white; font-family: sans-serif; 
            margin: 0; padding: 120px 20px 40px; display: flex; flex-direction: column; align-items: center; 
        }
        .header-fix {
            position: fixed; top: 0; left: 0; width: 100%; height: 100px;
            background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        #tag-header { 
            color: var(--green); border: 1px solid var(--green); 
            padding: 10px 25px; border-radius: 50px; font-weight: bold;
        }
        #bio-text { text-align: center; font-size: 1.1rem; margin-bottom: 30px; max-width: 300px; line-height: 1.6; }
        .link-btn { 
            width: 100%; max-width: 320px; background: #111; border: 1px solid #333;
            color: white; padding: 20px; margin-bottom: 15px; border-radius: 15px;
            text-decoration: none; text-align: center; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-fix">
        <div id="tag-header" id="display-tag">@...</div>
    </div>
    
    <p id="bio-text">Caricamento in corso...</p>
    <div id="links-box" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>

<script>
const TOKEN = "PatAnfD8O0FfKWhZc.854657155050f24025d57d5985868875385657454c504a554a5a544a42534c56";
const BASE = "app4eQDzqixPDbQTd";
const TABLE = "Table 1"; 

const params = new URLSearchParams(window.location.search);
const userParam = params.get("nome") || "test";

// Mostriamo il tag esattamente come lo scrivi nel link (es. test)
document.getElementById("tag-header").innerText = "@" + userParam;

async function load() {
    try {
        // Questa formula dice ad Airtable: "Converti tutto in minuscolo e poi confronta"
        // Così @test, @Test e @TEST funzioneranno tutti allo stesso modo.
        const formula = `LOWER({Nome})='@${userParam.toLowerCase()}'`;
        
        const response = await fetch(`https://api.airtable.com/v0/${BASE}/${encodeURIComponent(TABLE)}?filterByFormula=${encodeURIComponent(formula)}`, {
            headers: { Authorization: `Bearer ${TOKEN}` }
        });
        const data = await response.json();

        if(data.records && data.records.length > 0) {
            const f = data.records[0].fields;
            
            // Usiamo i nomi delle colonne visti nei tuoi screen: 'bio', 'instagram', 'sito'
            document.getElementById("bio-text").innerText = f.bio || "Nessuna biografia.";
            
            const box = document.getElementById("links-box");
            box.innerHTML = ""; 
            
            if(f.instagram) addBtn(box, "INSTAGRAM", "https://instagram.com/" + f.instagram);
            if(f.linkedin) addBtn(box, "LINKEDIN", f.linkedin);
            if(f.sito) addBtn(box, "SITO WEB", f.sito);
        } else {
            document.getElementById("bio-text").innerText = "Non trovo @" + userParam + " su Airtable. Controlla la colonna 'nome'.";
        }
    } catch(e) {
        document.getElementById("bio-text").innerText = "Errore tecnico di connessione.";
    }
}

function addBtn(container, label, url) {
    const a = document.createElement("a");
    a.className = "link-btn";
    a.href = url.startsWith('http') ? url : 'https://' + url;
    a.innerText = label;
    container.appendChild(a);
}

load();
</script>
</body>
</html>
