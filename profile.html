<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilo MyQuickTag</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-5">
  <div class="max-w-md w-full text-center" id="profileContent"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const nome = urlParams.get('nome') || 'utente';

    document.getElementById('profileContent').innerHTML = `
      <div class="w-32 h-32 mx-auto bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl flex items-center justify-center text-7xl mb-6 shadow-2xl font-bold">👤</div>
      <h1 class="text-5xl font-bold mb-2 uppercase tracking-tighter">@${nome}</h1>
      <p class="text-emerald-400 font-medium mb-10 italic">Identità digitale MyQuickTag</p>
      <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl shadow-xl">
        <p class="text-zinc-400 leading-relaxed">Benvenuto sul mio profilo ufficiale! Presto qui troverai tutti i miei link e contenuti esclusivi.</p>
      </div>
    `;
  </script>
</body>
</html>
