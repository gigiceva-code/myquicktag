<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MyQuickTag Profile</title>
    <style>
        :root { --green: #50C878; --bg: #000; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 120px 20px 40px; display: flex; flex-direction: column; align-items: center; }
        .header-fix { position: fixed; top: 0; left: 0; width: 100%; height: 100px; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
        #tag-header { color: var(--green); border: 1px solid var(--green); padding: 10px 25px; border-radius: 50px; font-weight: bold; text-transform: uppercase; }
        #bio-text { text-align: center; font-size: 1.1rem; margin-bottom: 30px; max-width: 300px; line-height: 1.6; }
        .link-btn { width: 100%; max-width: 320px; background: #111; border: 1px solid #333; color: white; padding: 20px; margin-bottom: 15px; border-radius: 15px; text-decoration: none; text-align: center; font-weight: bold; display: block; }
    </style>
</head>
<body>

    <div class="header-fix">
        <div id="tag-header">@...</div>
    </div>
    
    <p id="bio-text">Caricamento...</p>
    <div id="links-box" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>

<script>
// DATI DI CONNESSIONE
const TOKEN = "PatAnfD8O0FfKWhZc.854657155050f24025d57d5985868875385657454c504a554a5a544a42534c56";
const BASE = "app4eQDzqixPDbQTd";
const TABLE = "Table 1"; 

// RECUPERO PARAMETRO DALL'URL
const params = new URLSearchParams(window.location.search);
const userParam = params.get("nome") || "test";
document.getElementById("tag-header").innerText = userParam.toUpperCase();

async function load() {
    try {
        // FORMULA CORRETTA: Usa Nome con la N maiuscola
      const formula = "LOWER({nome})='" + userParam.toLowerCase() + "'";
        const url = "https://api.airtable.com/v0/" + BASE + "/" + encodeURIComponent(TABLE) + "?filterByFormula=" + encodeURIComponent(formula);

        const response = await fetch(url, {
            headers: { Authorization: "Bearer " + TOKEN }
        });
        const data = await response.json();

        if (data.records && data.records.length > 0) {
            const f = data.records[0].fields;
            
            // MOSTRA BIO
            document.getElementById("bio-text").innerText = f.bio || "Nessuna biografia inserita.";
            
            // MOSTRA LINK
            const box = document.getElementById("links-box");
            box.innerHTML = ""; 
            
            if(f.instagram) addBtn(box, "INSTAGRAM", "https://instagram.com/" + f.instagram);
            if(f.linkedin) addBtn(box, "LINKEDIN", f.linkedin);
            if(f.sito) addBtn(box, "SITO WEB", f.sito);
            
        } else {
            document.getElementById("bio-text").innerText = "Utente @" + userParam + " non trovato nel database.";
        }
    } catch(e) {
        document.getElementById("bio-text").innerText = "Errore di connessione al database.";
    }
}

function addBtn(container, label, url) {
    const a = document.createElement("a");
    a.className = "link-btn";
    a.href = url.startsWith('http') ? url : 'https://' + url;
    a.innerText = label;
    container.appendChild(a);
}

load();
</script>
</body>
</html>
