<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MyQuickTag Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --green: #50C878; --bg: #000; --card: #111; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #tag-display { font-size: 16px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; color: var(--green); margin-bottom: 30px; border: 1px solid var(--green); padding: 5px 15px; border-radius: 50px; }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--green); padding: 5px; margin-bottom: 20px; display: none; overflow: hidden; }
        .profile-img img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        #bio { font-size: 16px; color: #f0f0f0; text-align: center; max-width: 280px; line-height: 1.6; margin-bottom: 35px; }
        .links-container { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
        .btn-link { background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 16px; text-decoration: none; color: white; font-weight: 600; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .share-fab { position: fixed; bottom: 30px; background: var(--green); color: black; padding: 15px 30px; border-radius: 50px; font-weight: 900; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 10px 30px rgba(80, 200, 120, 0.4); cursor: pointer; }
    </style>
</head>
<body>

    <div id="tag-display">@...</div>
    <div class="profile-img" id="imgContainer"><img id="userImg" src="" alt="Profile"></div>
    <p id="bio">Caricamento profilo...</p>
    <div class="links-container" id="links"></div>
    <div class="share-fab" onclick="shareProfile()">Condividi Profilo</div>

<script>
const AIRTABLE_TOKEN = "PatAnfD8O0FfKWhZc.854657155050f24025d57d5985868875385657454c504a554a5a544a42534c56";
const BASE_ID = "app4eQDzqixPDbQTd";
const TABLE_NAME = "Table 1";

const params = new URLSearchParams(window.location.search);
const username = params.get("nome");

if(username) { 
    document.getElementById("tag-display").innerText = "@" + username.toUpperCase(); 
}

async function load(){
    try {
        const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={nome}='@${username}'`, {
            headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` }
        });
        const data = await res.json();
        
        if(data.records.length > 0){
            const fields = data.records[0].fields;
            
            // Usa 'biografia' (minuscolo) come visto nello screen
            document.getElementById("bio").innerText = fields.biografia || ""; 
            
            if(fields.avatar) {
                const imgUrl = Array.isArray(fields.avatar) ? fields.avatar[0].url : fields.avatar;
                document.getElementById("userImg").src = imgUrl;
                document.getElementById("imgContainer").style.display = "block";
            }

            const linksArea = document.getElementById("links");
            // Mapping esatto nomi colonne: Instagram, LinkedIn, sito
            const menuItems = [
                { id: 'Instagram', label: '📸 INSTAGRAM', prefix: 'https://instagram.com/' },
                { id: 'LinkedIn', label: '💼 LINKEDIN', prefix: '' },
                { id: 'sito', label: '🌐 SITO WEB', prefix: '' }
            ];

            menuItems.forEach(item => {
                if(fields[item.id]) {
                    const a = document.createElement("a");
                    a.href = item.prefix + fields[item.id];
                    a.className = "btn-link";
                    a.innerHTML = item.label;
                    linksArea.appendChild(a);
                }
            });
        } else {
            document.getElementById("bio").innerText = "Profilo non trovato.";
        }
    } catch (e) { 
        document.getElementById("bio").innerText = "Errore di connessione.";
    }
}

function shareProfile() {
    if (navigator.share) {
        navigator.share({ title: `MyQuickTag | @${username}`, url: window.location.href });
    }
}
load();
</script>
</body>
</html>
