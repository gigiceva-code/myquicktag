<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Identity Console - MyQuickTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000; /* Nero Assoluto Luxury */
            --card-bg: rgba(255, 255, 255, 0.02);
            --border-white: rgba(255, 255, 255, 0.9); /* Bianco Nitido d'élite per i contorni */
            --accent-smeraldo: #50C878; /* Verde Smeraldo Brand */
            --text-sec: #6c6c70; /* Grigio Calmo e Sobrio */
        }

        body {
            margin: 0; padding: 24px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex; flex-direction: column; align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-container { 
            width: 100%; 
            max-width: 400px; 
            min-height: 85vh; /* Spinge la struttura a occupare lo schermo verticalmente eliminando il vuoto sotto */
            display: flex;
            flex-direction: column;
        }

        /* Header Console Minimal Luxury */
        .user-welcome { text-align: left; margin: 50px 0 35px; width: 100%; }
        .user-welcome h1 { font-size: 1.8rem; margin: 0; font-weight: 600; letter-spacing: -0.8px; color: var(--accent-smeraldo); }
        .user-welcome p { color: #ffffff; font-size: 1.05rem; font-weight: 500; letter-spacing: -0.2px; margin: 6px 0 0; }

        /* Matrici Statistiche con contorni bianchi netti */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 45px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-white);
            padding: 22px; border-radius: 16px; text-align: left;
        }

        .stat-card i { color: var(--accent-smeraldo); font-size: 0.95rem; margin-bottom: 14px; display: block; }
        .stat-card .value { font-size: 1.6rem; font-weight: 500; display: block; color: #ffffff; letter-spacing: -0.5px; }
        .stat-card .label { font-size: 0.65rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 6px; display: block; font-weight: 500; }

        /* Divisore Centrale calibrato al millimetro per la leggibilità display */
        .menu-label { 
            font-size: 1rem; 
            color: var(--accent-smeraldo); 
            text-align: center; 
            text-transform: lowercase; 
            letter-spacing: 3px; 
            margin: 15px auto 35px auto; 
            font-weight: 400; 
            width: 100%;
        }
        
        /* Navigazione d'Élite con contorni bianchi netti e passo allargato */
        .action-btn {
            display: flex; align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-white);
            padding: 22px; /* Padding aumentato a 22px per dare imponenza */
            border-radius: 14px;
            text-decoration: none; color: white; 
            margin-bottom: 20px; /* Spazio aumentato a 20px per eliminare il vuoto in basso */
            transition: all 0.2s ease;
        }

        .action-btn:last-child { margin-bottom: 0; }

        .action-btn:active { transform: scale(0.99); background: rgba(255,255,255,0.05); }
        
        /* Icone di sinistra: TUTTE uniformate in Bianco Puro (inclusa la freccia di View Tag) */
        .action-btn i.btn-icon { width: 32px; font-size: 1.1rem; color: #ffffff; opacity: 0.9; }
        .action-btn span { flex-grow: 1; font-size: 0.95rem; font-weight: 400; letter-spacing: -0.2px; }
        
        /* Piccoli Chevron a destra: tinti in Verde Smeraldo per il dettaglio d'élite */
        .action-btn .chevron { font-size: 0.75rem; color: var(--accent-smeraldo); opacity: 0.8; }

        .btn-primary { 
            background: rgba(255, 255, 255, 0.01); 
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="user-welcome">
            <h1>Identity Console</h1>
            <p id="dash-user">@UTENTE</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-chart-line"></i>
                <span class="value" id="count-visits">-</span>
                <span class="label">Scansioni</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-shield-alt"></i>
                <span class="value" id="days-left">-</span>
                <span class="label">Status Trial</span>
            </div>
        </div>

        <div class="menu-label">identity system</div>
        
        <a href="#" id="link-view" class="action-btn btn-primary">
            <i class="fas fa-arrow-right btn-icon"></i>
            <span>View Tag</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

        <a href="#" id="link-edit" class="action-btn">
            <i class="fas fa-sliders-h btn-icon"></i>
            <span>Configure</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

        <a href="#" id="link-qr" class="action-btn">
            <i class="fas fa-qrcode btn-icon"></i>
            <span>QR Identity</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

        <a href="#" id="link-account" class="action-btn">
            <i class="fas fa-user-shield btn-icon"></i>
            <span>Account & Security</span>
            <i class="fas fa-chevron-right chevron"></i>
        </a>

    </div>

<script>
const params = new URLSearchParams(window.location.search);
const nomeUtente = params.get("u"); 

if (nomeUtente) {
    // Forza il minuscolo subito all'ingresso, allineando l'URL alla logica di username_system
    caricaDatiDashboard(nomeUtente.toLowerCase());
} else {
    document.body.innerHTML = "<div style='padding:50px; text-align:center; font-family:sans-serif; color:#6c6c70; font-size:0.9rem; letter-spacing:1px;'>ACCESS DENIED. PARAMETER MISSING.</div>";
}

async function caricaDatiDashboard(nome) {
    const nomePulito = nome.replace('@', '').trim().toLowerCase();
    
    try {
        const response = await fetch(`/api/get-profile?u=${nomePulito}`);
        const data = await response.json();

        if (data.success) {
            const record = data.fields;

            // Mostra il nome in minuscolo (o come preferisci, per ora segue il flusso pulito)
            document.getElementById("dash-user").innerText = "@" + nomePulito;

            if (record.data_scadenza) {
                const oggi = new Date();
                const scadenza = new Date(record.data_scadenza);
                const diffTime = scadenza - oggi;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                document.getElementById("days-left").innerText = diffDays > 0 ? diffDays + " GG" : "0 GG";
            } else {
                document.getElementById("days-left").innerText = "90 GG";
            }

            document.getElementById("count-visits").innerText = record.views || record.visits || "0";

            // Tutte le rotte vengono generate rigorosamente in minuscolo (username_system)
            document.getElementById("link-view").href = `/u/${nomePulito}`;
            document.getElementById("link-edit").href = `/edit?u=${nomePulito}`;
            document.getElementById("link-qr").href = `/qr?u=${nomePulito}`;
            document.getElementById("link-account").href = `/account?u=${nomePulito}`;

        } else {
            alert("Errore: Identità non rilevata nell'ecosistema.");
        }
    } catch (error) {
        console.error("Errore infrastruttura:", error);
    }
}
</script>
   
</body>
</html>
