
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profilo</title>

<style>
body {
    background:#000;
    color:white;
    text-align:center;
    font-family:Arial;
    padding:40px;
}
</style>
</head>

<body>

<h1 id="nome"></h1>
<p id="bio"></p>

<script>
const AIRTABLE_TOKEN = "patAnfD8O0FfKWhZc.854657155050f24025d57d5985868875385657454c504a554a5a544a42534c56";
const BASE_ID = "app4eQDzqixPDbQTd";
const TABLE_NAME = "Table 1";

const params = new URLSearchParams(window.location.search);
const username = params.get("nome");

document.getElementById("nome").innerText = "@" + username;

async function load(){
    const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?filterByFormula={Tag}='@${username}'`, {
        headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` }
    });

    const data = await res.json();

    if(data.records.length > 0){
        document.getElementById("bio").innerText = data.records[0].fields.Bio || "";
    }
}

load();
</script>

</body>
</html>
